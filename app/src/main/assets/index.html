<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Finanças</title>
<style>
:root{
  --ink:#0B1210; --surface:#141D19; --surface2:#1C2823; --line:#28362F;
  --text:#EEF5F1; --muted:#9AADA4; --mango:#FFB547; --heart:#FF5E7E; --violet:#9B8CFF; --ok:#34D399; --late:#FF6B5E;
  --marca:#2FBF84; --marca-tx:#03241A;
  --serif:"Noto Serif","Roboto Serif",Georgia,serif;
  --sans:Roboto,"Google Sans",system-ui,sans-serif;
}
/* Tema opcional "Seu Centavo": caderno de contas antigo (papel, tinta, carimbos) */
body.tema-centavo{
  --ink:#EDE2C4; --surface:#FBF5E3; --surface2:#E6D8B4; --line:#C9B68C;
  --text:#2B2118; --muted:#76664F; --mango:#B9791F; --heart:#B3261E; --violet:#34458A; --ok:#2E7D4F; --late:#B3261E;
  --marca:#2F6B4E; --marca-tx:#FBF5E3; --nav:rgba(237,226,196,.96);
  --serif:"Courier Prime","Courier New",Courier,monospace;
  background:repeating-linear-gradient(transparent 0 27px, rgba(120,90,50,.09) 27px 28px), var(--ink);
}
body.tema-centavo.fundo-kraft{--ink:#CDB083; --surface:#E2CDA2; --surface2:#BFA06E; --line:#8C7048; --muted:#5B4A33; --nav:rgba(205,176,131,.97)}
body.tema-centavo.fundo-noite{--ink:#1C1712; --surface:#2A231A; --surface2:#3A3024; --line:#5A4A35; --text:#F1E6CC; --muted:#B5A482; --mango:#E0A23A; --heart:#F0716A; --violet:#9FB0F0; --ok:#6CCB92; --late:#F0716A; --marca:#E0A23A; --marca-tx:#1C1712; --nav:rgba(28,23,18,.97)}
body.tema-centavo.fundo-noite{background:repeating-linear-gradient(transparent 0 27px, rgba(255,230,180,.05) 27px 28px), var(--ink)}
body.tema-centavo .topo{background:linear-gradient(var(--ink) 75%,transparent)}
body.tema-centavo nav{background:var(--nav);border-top:1px dashed var(--line)}
body.tema-centavo .post .corpo, body.tema-centavo .heroi, body.tema-centavo .graf, body.tema-centavo .relogio, body.tema-centavo .menu-grupo{border:1px dashed var(--line);box-shadow:0 2px 0 rgba(120,90,50,.08)}
body.tema-centavo .valor, body.tema-centavo .big, body.tema-centavo .med{font-family:var(--serif);letter-spacing:-.02em}
body.tema-centavo .heroi::after{background:radial-gradient(circle,rgba(185,121,31,.18),transparent 70%)}
body.tema-centavo .veu{background:rgba(43,33,24,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.4;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
main{padding:0 0 110px}
.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;background:linear-gradient(var(--ink) 75%,transparent)}
.topo h1{margin:0;font-family:var(--serif);font-size:1.55rem;font-weight:700;letter-spacing:-.01em}
.mini-av{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface2);border:2px solid var(--marca)}
.pos{color:var(--ok)} .neg{color:var(--late)}

/* ---------- Dinheiro de hoje (relógio) ---------- */
.relogio{margin:0 18px 16px;padding:16px;border-radius:22px;background:var(--surface)}
.rel-topo{display:flex;align-items:flex-start;gap:12px}
.rel-topo .txt{flex:1;min-width:0}
.rel-topo small{display:block;color:var(--muted);font-size:.85rem}
.rel-valor{font-family:var(--serif);font-size:1.9rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.rel-barra{position:relative;height:12px;border-radius:7px;background:var(--surface2);overflow:hidden;margin:12px 0 4px}
.rel-barra i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,var(--marca),var(--ok));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rel-barra.aviso i{background:linear-gradient(90deg,var(--mango),#FF8A5B)}
.rel-barra.estourou i{background:var(--late)}
.rel-linha{position:relative;height:30px;margin:6px 2px 0;border-top:1px solid var(--line)}
.rel-linha span{position:absolute;top:4px;font-size:.72rem;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.rel-linha b{position:absolute;top:-5px;width:2px;height:9px;background:var(--text);transform:translateX(-50%)}
.rel-linha b.fim{background:var(--late)}
.rel-frase{margin:6px 0 0;font-size:.95rem}
.rel-info{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.rel-talao{margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-family:var(--serif);font-size:.85rem}
.rel-talao div{display:flex;gap:6px}
.rel-talao div span:nth-child(2){flex:1;border-bottom:1px dotted var(--line);margin-bottom:4px}
.rel-talao .tot{font-weight:700}
.rel-hora{display:flex;gap:8px;align-items:center;margin-top:10px}
.rel-hora input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--ink)}
.carimbo{display:inline-block;padding:3px 8px;border:2px solid currentColor;border-radius:6px;font-family:var(--serif);font-weight:700;font-size:.72rem;letter-spacing:.08em;transform:rotate(-6deg);opacity:.85}
.carimbo.ok{color:var(--ok)} .carimbo.aviso{color:var(--mango)} .carimbo.mal{color:var(--late)}
.centavo{flex:none;width:52px;height:52px}
.fala-centavo{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0;font-size:.86rem;color:var(--muted);font-style:italic}
.fala-centavo svg{flex:none;width:22px;height:22px}
.tempo-trab{margin:4px 0 0;font-size:.82rem;color:var(--muted)}

/* ---------- Gráfico do mês (3 visões) ---------- */
.graf{margin:0 18px 16px;padding:16px 16px 12px;border-radius:22px;background:var(--surface)}
.graf-topo{margin-bottom:12px}
.graf-topo b{display:block;font-size:.95rem;margin-bottom:8px}
.graf-abas{display:flex;gap:4px;background:var(--ink);padding:3px;border-radius:12px}
.graf-abas button{flex:1;padding:7px 4px;border-radius:9px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.graf-abas button.on{background:var(--surface2);color:var(--text)}
.graf svg{display:block;width:100%;height:auto;overflow:visible}
.graf svg text{fill:var(--muted);font-family:var(--sans);font-size:10px}
.graf .eixo{stroke:var(--line);stroke-width:1}
.graf [data-v]{cursor:pointer;transition:opacity .15s}
.graf.foco [data-v]:not(.sel){opacity:.35}
.graf-ler{min-height:20px;margin-top:8px;font-size:.85rem;color:var(--muted);text-align:center}
.graf-ler b{color:var(--text)}
.rosca{display:flex;align-items:center;gap:14px}
.rosca svg{width:132px;flex:none}
.rosca-lista{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.rosca-item{display:grid;grid-template-columns:10px 1fr auto;gap:2px 8px;align-items:center;font-size:.82rem;text-align:left}
.rosca-item i{width:10px;height:10px;border-radius:3px}
.rosca-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rosca-item small{color:var(--muted);font-variant-numeric:tabular-nums}
.rosca-item .barra{grid-column:2 / 4;height:3px;border-radius:2px;background:var(--surface2);overflow:hidden}
.rosca-item .barra u{display:block;height:100%;border-radius:2px}
.graf-leg{display:flex;justify-content:center;gap:16px;font-size:.8rem;color:var(--muted);margin-top:6px}
.graf-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- Herói do mês ---------- */
.heroi{margin:4px 18px 16px;padding:20px 20px 18px;border-radius:26px;background:var(--surface);position:relative;overflow:hidden;isolation:isolate;
  box-shadow:0 14px 40px -22px rgba(47,191,132,.45)}
/* Luz que circula devagar pela borda (uma volta a cada 26 s) com um brilho suave que a acompanha */
@property --ang{syntax:"<angle>";initial-value:45deg;inherits:false}
@property --gx{syntax:"<percentage>";initial-value:100%;inherits:false}
@property --gy{syntax:"<percentage>";initial-value:0%;inherits:false}
.heroi::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from calc(var(--ang) - 40deg),transparent 0deg,rgba(52,211,153,.85) 34deg,rgba(236,255,246,.75) 40deg,rgba(52,211,153,.85) 46deg,transparent 80deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:luzBorda 26s linear infinite}
.heroi::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(240px circle at var(--gx) var(--gy),rgba(52,211,153,.16),transparent 70%);
  animation:luzBrilho 26s linear infinite}
@keyframes luzBorda{to{--ang:405deg}}
@keyframes luzBrilho{0%{--gx:100%;--gy:0%}25%{--gx:100%;--gy:100%}50%{--gx:0%;--gy:100%}75%{--gx:0%;--gy:0%}100%{--gx:100%;--gy:0%}}
.heroi.parado::before,.heroi.parado::after{animation-play-state:paused}
.heroi .mes{color:var(--muted);font-size:.95rem}
.duas{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 4px}
.duas > div:last-child{text-align:right}
.duas small{display:block;color:var(--muted);font-size:.82rem}
.big{font-family:var(--serif);font-size:2.35rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.med{font-family:var(--serif);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.trilho{display:flex;height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:14px 0 8px}
.trilho i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--mango),#FF8A5B);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.fluxo{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface2);margin:14px 0 6px}
.fluxo i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1);width:0}
.fluxo .e{background:var(--ok)} .fluxo .s{background:var(--late);opacity:.85}
.legenda{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.linha-info{margin-top:10px;font-size:.9rem;color:var(--muted)}
.linha-info b{color:var(--text);font-weight:600}

.eq{display:flex;flex-direction:column;gap:1px;margin-top:8px;font-size:.88rem;color:var(--muted)}
.dica-btn{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--surface2);font-size:.9rem;text-align:left;width:100%}

.insight{margin:0 18px 16px;padding:14px 16px;border-radius:18px;border:1px dashed var(--line);color:var(--muted);font-size:.93rem}
.insight strong{color:var(--text);font-weight:600}
.dia{margin:22px 18px 10px;font-size:.85rem;color:var(--muted);font-weight:500}

/* ---------- Posts ---------- */
.post{position:relative;margin:0 12px 12px;border-radius:22px;overflow:hidden;background:var(--late)}
.fundo-apagar{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:26px;font-weight:600;color:#fff}
.post .corpo{position:relative;background:var(--surface);padding:14px 16px 10px;touch-action:pan-y;transition:transform .25s ease,box-shadow .2s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.post .corpo.segurando{transform:scale(.985);box-shadow:inset 0 0 0 2px rgba(52,211,153,.5)}
.post .corpo.editando{touch-action:auto;-webkit-user-select:text;user-select:text;box-shadow:inset 0 0 0 2px var(--marca)}
.ed-topo{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ed-topo .seg{flex:1;margin:0}
.ed-valor{width:100%;padding:6px 0;border:0;border-bottom:1px dashed var(--line);background:transparent;font-family:var(--serif);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.ed-desc,.ed-data{width:100%;margin-top:8px;padding:8px 0;border:0;border-bottom:1px dashed var(--line);background:transparent;font-size:1rem}
.ed-data{color:var(--muted);font-size:.9rem;color-scheme:dark}
.corpo.editando .chave{width:100%;margin:10px 0 0;background:var(--ink)}
.ed-escopo{margin:0 0 10px;padding:10px 12px;border-radius:16px;background:var(--ink)}
.ed-escopo > small{display:block;color:var(--muted);font-size:.8rem;margin-bottom:8px}
.ed-escopo .seg{margin:0;background:var(--surface)}
.ed-escopo .seg button{padding:8px 6px;font-size:.88rem}
.ed-escopo .seg button.on{background:var(--marca);color:var(--marca-tx)}
.ed-escopo .nota-esc{display:block;margin-top:8px;font-size:.82rem;color:var(--muted);line-height:1.4}
.ed-escopo .nota-esc b{color:var(--text);font-weight:600}
.rep-tag{display:inline-block;margin-left:6px;font-size:.72rem;padding:2px 7px;border-radius:9px;background:rgba(52,211,153,.14);color:var(--ok);font-weight:500}
.ed-acoes{display:flex;gap:8px;margin-top:12px}
.ed-acoes button{flex:1;padding:10px 6px;border-radius:14px;background:var(--surface2);font-size:.9rem}
.ed-acoes .ok{background:var(--marca);color:var(--marca-tx);font-weight:700}
.ed-acoes .del{color:var(--late)}
.post.novo .corpo{animation:chegou 1.2s ease}
@keyframes chegou{0%{box-shadow:inset 0 0 0 2px var(--mango)}100%{box-shadow:inset 0 0 0 2px transparent}}
.post header{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;flex:0 0 40px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;background:color-mix(in srgb,var(--c) 22%,transparent)}
.post header .quem{flex:1;min-width:0}
.post header .quem b{display:block;font-size:.95rem;font-weight:600}
.post header .quem small{color:var(--muted);font-size:.8rem}
.tag{font-size:.78rem;padding:5px 10px;border-radius:20px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.post .valor{font-family:var(--serif);font-size:1.9rem;font-weight:700;margin:12px 0 0;font-variant-numeric:tabular-nums}
.post .desc{margin:2px 0 0;font-size:1rem;overflow-wrap:anywhere}
.post footer{display:flex;gap:20px;margin-top:12px;padding-top:8px;border-top:1px solid var(--line)}
.acao{display:flex;align-items:center;gap:6px;padding:6px 2px;color:var(--muted);font-size:.9rem}
.acao svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2}
.acao.curtido{color:var(--heart)}
.acao.curtido svg{fill:var(--heart);animation:pulo .35s ease}
@keyframes pulo{50%{transform:scale(1.35)}}
.ultimo-com{margin:6px 0 2px;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.ultimo-com b{color:var(--text);font-weight:600}
.ultimo-com.digitando .tx::after{content:"";display:inline-block;width:2px;height:1em;margin-left:1px;vertical-align:-2px;background:var(--marca);animation:cursor .7s steps(1) infinite}
@keyframes cursor{50%{opacity:0}}
.ultimo-com.postou{animation:postou .45s ease}
@keyframes postou{0%{transform:translateX(-4px);opacity:.6}100%{transform:none;opacity:1}}
.acao.curtido.ao-ver svg{animation:pulo .5s ease .1s}
.coracao-grande{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;fill:var(--heart);pointer-events:none;animation:estouro .8s ease forwards}
@keyframes estouro{0%{transform:scale(0);opacity:0}25%{transform:scale(1.15);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}
.mais{display:block;margin:10px auto;padding:10px 18px;border-radius:20px;background:var(--surface);color:var(--muted)}
.vazio{margin:26px 24px;text-align:center;color:var(--muted)}
.vazio .grande{font-size:2.6rem;display:block;margin-bottom:8px}

/* ---------- Extrato ---------- */
.meses{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 14px;scrollbar-width:none}
.meses::-webkit-scrollbar{display:none}
.mes-chip{flex:0 0 auto;min-width:62px;padding:8px 12px;border-radius:16px;background:var(--surface);text-align:center;font-size:.9rem}
.mes-chip small{display:block;font-size:.7rem;color:var(--muted)}
.mes-chip.on{background:var(--text);color:var(--ink)}
.mes-chip.on small{color:var(--ink);opacity:.7}
.mes-chip.futuro:not(.on){border:1px dashed var(--line);background:transparent}
.resumo{margin:0 18px 14px;padding:16px;border-radius:22px;background:var(--surface)}
.resumo .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.resumo .tres small{display:block;color:var(--muted);font-size:.78rem}
.resumo .tres b{font-family:var(--serif);font-size:1.05rem;font-variant-numeric:tabular-nums}
.controles{margin:0 18px 8px}
.busca{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.filtros span{font-size:.8rem;color:var(--muted);margin-right:2px}
.row{display:flex;align-items:center;gap:12px;margin:0 12px 8px;padding:12px 14px;border-radius:18px;background:var(--surface);width:calc(100% - 24px);text-align:left}
.row .data{width:34px;text-align:center;line-height:1.1}
.row .data b{display:block;font-size:1.05rem}
.row .data small{font-size:.68rem;color:var(--muted)}
.row .av{width:36px;height:36px;flex-basis:36px;border-radius:12px;font-size:1.1rem}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .info small{color:var(--muted);font-size:.78rem}
.row .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row.prevista{background:transparent;border:1px dashed var(--line)}
.row.prevista .v{opacity:.75}

/* ---------- Listas e botões ---------- */
.secao{margin:0 18px 16px}
.h3{margin:22px 18px 10px;font-family:var(--serif);font-size:1.2rem}
.btn{display:block;width:calc(100% - 36px);margin:14px 18px;padding:15px;border-radius:16px;background:var(--marca);color:var(--marca-tx);font-weight:700;text-align:center}
.btn.sec{background:var(--surface2);color:var(--text);font-weight:500}
.btn.mini{display:inline-block;width:auto;margin:0;padding:10px 14px;font-size:.9rem}
.linha-botoes{display:flex;gap:10px;margin:0 18px 12px}
.linha-botoes .btn{margin:0;width:auto;flex:1}
.nota{margin:0 18px 12px;font-size:.85rem;color:var(--muted)}

.cartao{margin:0 12px 12px;padding:16px;border-radius:22px;background:var(--surface)}
.cartao .top{display:flex;align-items:center;gap:12px}
.cartao .emo{font-size:1.9rem}
.cartao .top div{flex:1;min-width:0}
.cartao .top b{display:block;font-weight:600}
.cartao .top small{color:var(--muted)}
.cartao .pct{font-family:var(--serif);font-weight:700;font-size:1.3rem}
.cartao .trilho i{background:linear-gradient(90deg,var(--marca),var(--ok))}
.cartao.amortizar .trilho i{background:linear-gradient(90deg,var(--mango),var(--ok))}
.cartao .trilho i.tr{background:repeating-linear-gradient(135deg,#8FF0C6 0 6px,#5EDBA8 6px 12px);border-radius:0 6px 6px 0}
.cartao .trilho i:not(.tr){border-radius:6px 0 0 6px}
.leg-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:-2px 0 10px;font-size:.8rem;color:var(--muted)}
.leg-meta i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--marca)}
.leg-meta i.tr{background:#8FF0C6}
.cartao .acoes{display:flex;gap:10px}
.cartao .acoes button{flex:1;padding:10px;border-radius:14px;background:var(--surface2)}
.cartao.feita{box-shadow:inset 0 0 0 2px var(--ok)}
.evitar-btn{display:block;width:100%;margin-top:12px;padding:14px;border-radius:16px;background:var(--ok);color:#06231A;font-weight:700;font-size:1rem}
.tipo-tag{font-size:.72rem;padding:3px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);margin-left:6px;font-weight:500}
.refs{display:flex;flex-wrap:wrap;gap:8px;margin:0 18px 10px}
.ref{padding:10px 13px;border-radius:16px;background:var(--surface);font-size:.9rem}
.ref.dest{box-shadow:inset 0 0 0 1.5px var(--mango)}

.contas-lista .item{display:flex;align-items:center;gap:12px;margin:0 18px 8px;padding:12px 14px;border-radius:16px;background:var(--ink)}
.check{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .25s}
.check svg{width:16px;height:16px;stroke:var(--ink);stroke-width:3;fill:none;opacity:0;transform:scale(.4);transition:all .25s}
.paga .check{background:var(--ok);border-color:var(--ok)}
.paga .check svg{opacity:1;transform:none}
.contas-lista .info{flex:1;min-width:0}
.contas-lista .info b{display:block;font-weight:600}
.contas-lista .info small{color:var(--muted)}
.paga .info b{text-decoration:line-through;color:var(--muted)}
.x{width:32px;height:32px;border-radius:50%;background:var(--surface2);color:var(--muted)}

/* ---------- Perfil ---------- */
.perfil-top{text-align:center;padding:10px 18px 4px}
.menu-grupo{margin:0 18px 8px;border-radius:20px;background:var(--surface);overflow:hidden}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;border-bottom:1px solid var(--line)}
.menu-item:last-child{border-bottom:0}
.mi-ic{position:relative;width:34px;height:34px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-size:1.05rem;flex:none}
/* Ponto amarelo: indica onde tocar (atualização disponível, backup atrasado) */
.com-ponto{position:relative}
.com-ponto::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--mango);border:2px solid var(--ink);animation:pontoPulso 2.4s ease-in-out infinite}
nav button.com-ponto::after{top:6px;right:calc(50% - 18px)}
@keyframes pontoPulso{0%,100%{box-shadow:0 0 0 0 rgba(255,181,71,.55)}50%{box-shadow:0 0 0 6px rgba(255,181,71,0)}}
.mi-tx{flex:1;min-width:0}
.mi-tx b{display:block;font-weight:600;font-size:.95rem}
.mi-tx small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-seta{color:var(--muted);font-size:1.4rem;line-height:1}
.pag-topo{display:flex;align-items:center;gap:6px;padding:4px 10px 12px}
.pag-topo button{width:40px;height:40px;border-radius:12px;font-size:1.8rem;line-height:1;color:var(--text)}
.pag-topo h2{margin:0;font-family:var(--serif);font-size:1.35rem}
.legal{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin:6px 18px 4px}
.legal button{font-size:.82rem;color:var(--muted);text-decoration:underline;padding:6px 2px}
.doc{margin:0 18px 12px;font-size:.9rem;line-height:1.55}
.doc h4{margin:16px 0 4px;font-size:.95rem}
.doc p{margin:0 0 8px;color:var(--text)}
.campo textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--ink);color:var(--text);font:inherit;resize:vertical}
.grande-av{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;padding:4px;background:conic-gradient(var(--mango),var(--heart),var(--violet),var(--mango))}
.grande-av span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--ink);font-family:var(--serif);font-size:2.4rem;font-weight:700}
.perfil-top h2{margin:0;font-family:var(--serif);font-size:1.6rem}
.perfil-top p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.nivel{margin:16px 18px;padding:16px;border-radius:22px;background:var(--surface)}
.nivel .cab{display:flex;justify-content:space-between;align-items:baseline}
.nivel .cab b{font-family:var(--serif);font-size:1.3rem}
.nivel .cab small{color:var(--muted)}
.nivel .trilho i{background:linear-gradient(90deg,var(--heart),var(--mango))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 18px 18px}
.stats div{padding:14px 8px;border-radius:18px;background:var(--surface);text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:1.5rem}
.stats small{color:var(--muted);font-size:.78rem}
.conquistas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 18px}
.conq{padding:14px 6px;border-radius:18px;background:var(--surface);text-align:center}
.conq .i{font-size:1.9rem;display:block}
.conq b{display:block;font-size:.8rem;font-weight:600;margin-top:4px}
.conq small{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.conq.bloq{opacity:.38;filter:grayscale(1)}
.campo{display:block;margin:0 18px 12px}
.campo span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.campo input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.chave{display:flex;align-items:center;justify-content:space-between;gap:12px;width:calc(100% - 36px);margin:0 18px 10px;padding:14px 16px;border-radius:16px;background:var(--surface);text-align:left}
.chave span{flex:1}
.chave small{display:block;color:var(--muted);font-size:.8rem}
.sw{width:46px;height:28px;flex:0 0 46px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.on > .sw{background:var(--ok)}
.on > .sw::after{transform:translateX(18px)}

/* ---------- Navegação ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;justify-content:space-around;height:72px;padding:0 6px;background:rgba(11,18,16,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;color:var(--muted)}
nav button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2}
nav button.ativo{color:var(--text)}
nav .fab{flex:0 0 62px;height:62px;margin-top:-26px;border-radius:22px;background:var(--marca);color:var(--marca-tx);display:grid;place-items:center;box-shadow:0 8px 24px rgba(47,191,132,.38);transition:transform .15s}
nav .fab:active{transform:scale(.92)}
nav .fab svg{width:30px;height:30px;stroke:var(--marca-tx);stroke-width:2.6}

/* ---------- Folha inferior ---------- */
.veu{position:fixed;inset:0;z-index:20;background:rgba(5,4,10,.55);opacity:0;transition:opacity .25s}
.veu.on{opacity:1}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:6px 0 22px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.folha.on{transform:none}
.alca{padding:10px 0 14px;touch-action:none}
.alca i{display:block;width:44px;height:5px;margin:0 auto;border-radius:3px;background:var(--line)}
.folha h3{margin:0 18px 14px;font-family:var(--serif);font-size:1.35rem}
.folha .campo input{background:var(--ink)}
.folha .chave{background:var(--ink)}
.entrada-grande{width:calc(100% - 36px);margin:0 18px 14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--ink);font-family:var(--serif);font-size:1.5rem}
.com-voz{position:relative}
.com-voz .entrada-grande{padding-right:64px}
.mic{position:absolute;right:28px;top:9px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--text)}
.mic svg{width:24px;height:24px;fill:currentColor}
.mic.on{background:var(--late);color:#fff;animation:pulsoMic 1.1s ease-in-out infinite}
@keyframes pulsoMic{0%,100%{box-shadow:0 0 0 0 rgba(255,107,91,.55)}50%{box-shadow:0 0 0 12px rgba(255,107,91,0)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 18px 10px}
.chip{padding:8px 13px;border-radius:20px;background:var(--surface2);font-size:.88rem}
.chip.on{background:var(--text);color:var(--ink)}
.chips.rolar{flex-wrap:nowrap;overflow-x:auto;margin:0 0 10px;padding:0 18px;scrollbar-width:none;overscroll-behavior-x:contain}
.chips.rolar::-webkit-scrollbar{display:none}
.chips.rolar .chip{flex-shrink:0;white-space:nowrap}
.chips.sub-cat{margin-top:-4px}
.campo select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--ink);color:var(--text);font:inherit}
.cores-cat{gap:10px}
.cor-cat{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.cor-cat.on{border-color:var(--text)}
.icones-cat{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:0 18px 6px}
.icones-cat button{aspect-ratio:1;border-radius:12px;background:var(--surface);font-size:1.15rem}
.icones-cat button.on{background:var(--surface2);box-shadow:0 0 0 2px var(--mango) inset}
.arvore-cat{margin:0 18px 16px;padding:8px 10px;border-radius:20px;background:var(--surface)}
.ac-pai,.ac-sub{display:flex;align-items:center;gap:10px;padding:7px 4px}
.ac-pai b{flex:1;text-transform:uppercase;font-size:.82rem;letter-spacing:.02em}
.ac-sub{padding-left:10px;font-size:.9rem}
.ac-sub span:nth-child(3){flex:1}
.ac-seta{color:var(--muted)}
.ac-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb, var(--c) 28%, transparent);font-size:.95rem}
.ac-apagar{padding:4px 6px;opacity:.7}
.chips.sub-cat .chip{padding:6px 11px;font-size:.82rem;background:var(--ink)}
.chips.sub-cat .chip.on{background:var(--text)}
.chip.auto{border:1px dashed var(--muted)} .chip.auto.on{border-color:transparent}
.dica-cat{margin:-4px 18px 10px;font-size:.8rem;color:var(--muted)}
/* ---------- Roda de rolagem (categoria) ---------- */
.roda{position:relative;height:132px;margin:0 18px 10px;border-radius:16px;background:var(--ink);border:1px solid var(--line);overflow:hidden}
.roda::before{content:"";position:absolute;left:8px;right:8px;top:43px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);pointer-events:none}
.roda-lista{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 34%,#000 66%,transparent);mask-image:linear-gradient(transparent,#000 34%,#000 66%,transparent)}
.roda-lista::-webkit-scrollbar{display:none}
.roda-esp{height:44px}
.roda-it{height:44px;display:flex;align-items:center;justify-content:center;gap:6px;scroll-snap-align:center;font-size:1rem;color:var(--muted);transition:color .15s,transform .15s;white-space:nowrap}
.roda-it.on{color:var(--text);font-weight:600;transform:scale(1.07)}
.chip.verde{background:rgba(76,214,160,.16);color:var(--ok)}
.seg{display:flex;margin:0 18px 14px;padding:4px;border-radius:16px;background:var(--ink)}
.seg button{flex:1;padding:10px;border-radius:12px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface2);color:var(--text)}
.seg button.on[data-r="1"]{color:var(--ok)}
.rotulo{margin:6px 18px 8px;font-size:.85rem;color:var(--muted)}
.detalhe-v{margin:0 18px 2px;font-family:var(--serif);font-size:2.4rem;font-weight:700}
.detalhe-d{margin:0 18px 14px;color:var(--muted)}
.coms{margin:0 18px 12px}
.com{display:flex;gap:10px;margin-bottom:12px}
.com .ini{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-size:.85rem}
.com p{margin:0;overflow-wrap:anywhere}
.com small{color:var(--muted);font-size:.75rem}
.enviar{display:flex;gap:8px;margin:0 18px}
.enviar input{flex:1;padding:13px 14px;border-radius:22px;border:1px solid var(--line);background:var(--ink)}
.enviar button{padding:0 18px;border-radius:22px;background:var(--marca);color:var(--marca-tx);font-weight:700}

/* ---------- Avisos ---------- */
.aviso{position:fixed;left:14px;right:14px;bottom:86px;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--text);color:var(--ink);transform:translateY(calc(100% + 140px));opacity:0;visibility:hidden;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s .3s}
.aviso.on{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.aviso span{flex:1}
.aviso button{font-weight:700;color:#6A4DFF}
.trofeu{position:fixed;left:50%;top:18%;z-index:40;width:250px;margin-left:-125px;padding:22px 18px;border-radius:26px;background:var(--surface);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:trofeu 2.8s ease forwards}
.trofeu .i{font-size:3rem;display:block}
.trofeu small{color:var(--mango);font-weight:600}
.trofeu b{display:block;font-family:var(--serif);font-size:1.3rem;margin-top:4px}
@keyframes trofeu{0%{transform:scale(.6);opacity:0}12%{transform:scale(1.05);opacity:1}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.confete{position:fixed;top:-12px;z-index:39;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cair linear forwards}
@keyframes cair{to{transform:translateY(105vh) rotate(720deg)}}

/* ---------- Casal ---------- */
.modos{display:flex;margin:0 18px 12px;padding:4px;border-radius:16px;background:var(--surface)}
.modos button{flex:1;padding:9px;border-radius:12px;color:var(--muted);font-weight:500;font-size:.92rem}
.modos button.on{background:var(--text);color:var(--ink)}
.pessoa{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff;vertical-align:middle}
.pessoa.eu{background:#E5613A} .pessoa.par{background:#6B8E3A}
.nos-tag{display:inline-block;margin-left:6px;font-size:.72rem;padding:2px 7px;border-radius:9px;background:rgba(155,140,255,.18);color:var(--violet);font-weight:500}
.acerto{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface2);font-size:.92rem}
.acerto b{font-weight:600}
.estado-nuvem{margin:0 18px 12px;padding:14px 16px;border-radius:18px;background:var(--surface);font-size:.9rem;color:var(--muted)}
.estado-nuvem b{color:var(--text)}
.estado-nuvem .erro{color:var(--late);margin-top:6px}
.convite{margin:0 18px 12px;padding:14px;border-radius:16px;background:var(--ink);font-family:monospace;font-size:.78rem;word-break:break-all;color:var(--muted)}
textarea.campo-grande{width:calc(100% - 36px);margin:0 18px 12px;min-height:90px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--ink);color:var(--text);font:inherit;font-size:.9rem}
.passos{margin:0 18px 12px;padding-left:20px;color:var(--muted);font-size:.88rem}
.passos li{margin-bottom:6px}
.passos b{color:var(--text)}

/* ---------- Menu e entrada ---------- */
.topo{gap:12px}
.topo h1{flex:1}
.menu-btn{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;background:var(--surface)}
.menu-btn svg{width:22px;height:22px;stroke:var(--text);stroke-width:2;fill:none}
body.entrada .topo, body.entrada nav{display:none}
body.entrada main{padding:48px 0 40px}
.boas-vindas{text-align:center;padding:0 24px 22px}
.boas-vindas .logo{width:74px;height:74px;margin:0 auto 16px;border-radius:24px;background:var(--marca);color:var(--marca-tx);display:grid;place-items:center;font-family:var(--serif);font-size:2.4rem;font-weight:700}
.boas-vindas h1{margin:0;font-family:var(--serif);font-size:2.1rem}
.boas-vindas p{margin:8px auto 0;max-width:300px;color:var(--muted)}
.link{display:block;margin:4px auto;padding:10px;color:var(--violet);font-weight:500}
.link-inline{color:var(--violet);text-decoration:underline;font-size:inherit}
.rodape{text-align:center;margin-top:28px}
.linha-campos{display:flex;gap:10px;margin:0 18px 12px}
.linha-campos .campo{margin:0;flex:1;min-width:0}
.grupo{margin:14px 18px 6px;font-size:.8rem;color:var(--muted);font-weight:500}

.adm-lista .item{align-items:flex-start}
.adm-lista .info small{display:block;white-space:normal;margin-top:2px}
.adm-botoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.adm-botoes button{padding:7px 11px;border-radius:12px;background:var(--surface2);font-size:.82rem}
.adm-botoes .ok{background:var(--marca);color:var(--marca-tx);font-weight:700}
.adm-botoes .del{color:var(--late)}
.codigo-grande{margin:0 18px 12px;padding:18px;border-radius:18px;background:var(--ink);text-align:center;font-family:monospace;font-size:1.6rem;letter-spacing:.08em}
.cfg-json{font-family:monospace;font-size:.8rem;color:var(--muted);white-space:pre-wrap;word-break:break-all;margin-top:4px}
.banner-atu{display:flex;align-items:center;gap:12px;margin:0 18px 14px;padding:12px 14px;border-radius:18px;background:rgba(255,181,71,.12);color:var(--text);font-size:.9rem}
.banner-atu span{flex:1}

/* Modo rápido: só a folha de novo lançamento, por cima de qualquer app */
/* ---------- Tutorial da primeira abertura (não dá para pular) ---------- */
#tut{position:fixed;inset:0;z-index:100;touch-action:none}
#tut.escuro{background:rgba(8,6,14,.82)}
.tut-foco{position:absolute;border-radius:18px;border:2px solid var(--mango);box-shadow:0 0 0 9999px rgba(8,6,14,.82);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#tut.escuro .tut-foco{display:none}
.tut-card{position:absolute;left:16px;right:16px;padding:18px 18px 14px;border-radius:22px;background:var(--surface);box-shadow:0 12px 40px rgba(0,0,0,.55);transition:top .3s,bottom .3s}
.tut-card.cima{top:calc(env(safe-area-inset-top, 0px) + 16px)}
.tut-card.baixo{bottom:calc(env(safe-area-inset-bottom, 0px) + 20px)}
.tut-card.meio{top:50%;transform:translateY(-50%)}
.tut-card small{color:var(--muted);font-size:.8rem}
.tut-card h3{margin:4px 0 6px;font-family:var(--serif);font-size:1.3rem}
.tut-card p{margin:0 0 6px;font-size:.95rem;line-height:1.45}
.tut-card .dica{color:var(--muted);font-size:.87rem}
.tut-pontos{display:flex;gap:5px;margin:12px 0}
.tut-pontos i{width:6px;height:6px;border-radius:3px;background:var(--surface2);transition:width .2s}
.tut-pontos i.on{width:18px;background:var(--mango)}
.tut-botoes{display:flex;gap:10px}
.tut-botoes .btn{margin:0;width:auto;flex:1;padding:13px}
body.rapido{background:transparent}
.mb{margin:0 18px 12px;padding:12px 14px;border-radius:16px;background:var(--ink);display:flex;align-items:center;gap:10px;font-size:.88rem}
.mb div{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.mb small{display:block;color:var(--muted)}
.lendo{margin:18px auto 22px;width:34px;height:34px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--mango);animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
body.rapido .topo, body.rapido main, body.rapido nav{display:none}
body.rapido .veu{background:rgba(5,4,10,.45)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cart-tot{display:flex;gap:10px;margin:4px 0 10px}.cart-tot>div{flex:1;background:var(--surface);border-radius:16px;padding:14px}
.cart-tot small{display:block;color:var(--muted);font-size:.78rem}.cart-tot b{font-size:1.35rem}
.cart{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;color:var(--text);border-radius:16px;padding:12px 14px;margin:8px 0;font:inherit}
.cart .mi-tx{flex:1;display:flex;flex-direction:column}.cart .mi-tx small{color:var(--muted);font-size:.78rem}.cart-v{white-space:nowrap}
.cart-tag{margin:6px 0 0;font-size:.8rem;color:var(--muted)}
svg .lin{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
svg .lin-p{fill:none;stroke-width:2;stroke-dasharray:4 4;opacity:.75}
svg .lin-agora{stroke:var(--text);stroke-width:1;stroke-dasharray:2 3;opacity:.6}
.graf-leg i.trac{background:none;border-top:2px dashed var(--muted);height:0;width:14px;border-radius:0;vertical-align:3px}

.graf-nav{display:flex;align-items:center;gap:10px;margin:2px 0 10px}.graf-nav button{background:var(--surface2);color:var(--text);border:0;border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem}
.graf-nav b{flex:1}.graf-nav small{color:var(--muted)}

<body>

<script src="motor.js"></script>
<script>
"use strict";
const ponte = window.App;
const FATURA = location.hash === "#fatura";
const RAPIDO = location.hash === "#rapido" || FATURA;
const IOS = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.financas);
let S = null, aba = "feed", modo = (() => { try { return localStorage.getItem("fin.modo") || "total"; } catch(e){ return "total"; } })(), limitePosts = 40, folhaAberta = null, ultimoToque = {el:null,t:0};
let extr = {ano:0, mes:0, tipo:"todas", ordem:"data", busca:""};

/* Categorias em dois níveis ("Casa › Luz"), vindas de assets/categorias.json + as criadas pela pessoa */
const SEPC = " › ";
const LEGADO_CAT = {"Mercado":"Alimentação › Supermercado", "Compras":"Gastos Pessoais", "Hábitos":"Gastos Pessoais", "Moradia":"Casa",
  "Lazer":"Lazer - Passeios", "Contas fixas":"Casa", "Salário":"Receitas › Salário", "Reembolso":"Receitas › Outras Receitas",
  "Rendimentos":"Receitas › Outras Receitas", "Extra":"Receitas › Outras Receitas"};
const OUTRAS_REC = "Receitas › Outras Receitas";
let CATMAPA = {};
function montarCats(){
  CATMAPA = {};
  (S.arvore || []).forEach(c => { CATMAPA[c.n] = [c.e, c.cor]; c.subs.forEach(x => CATMAPA[c.n + SEPC + x.n] = [x.e, c.cor]); });
}
const canonCat = c => LEGADO_CAT[c] || c || "";
const catPai = c => canonCat(c).split(SEPC)[0];
const catNome = c => canonCat(c).split(SEPC).pop();
const cat = c => { c = canonCat(c); return CATMAPA[c] || CATMAPA[catPai(c)] || ["🏷️", "#C9C2DA"]; };
const ICON = {
  coracao:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.2 1.7-2 3.1-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  balao:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-4.8A8 8 0 1 1 21 12z"/></svg>',
  ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESES_L = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
let fmt = null;
const num1 = new Intl.NumberFormat("pt-BR",{maximumFractionDigits:1});
const din = v => fmt.format(v || 0);
const sdin = v => (v > 0 ? "+" : v < 0 ? "−" : "") + din(Math.abs(v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const vibrar = () => { try { ponte.vibrar(); } catch(e){} };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Estado e visões (Eu / Nós / Total) ---------- */
const meu = x => x.dono === S.eu.id;
const casalExiste = () => !!S.parceiro;
/** A visão de casal é Premium: sem ele, os dados do parceiro ficam guardados, só não aparecem. */
const temCasal = () => !!S.parceiro && !!S.premium;
function visivel(x){
  if (!temCasal()) return meu(x);
  if (modo === "eu") return meu(x);
  if (modo === "nos") return !!x.sh;
  return true;
}
function carregar(){ S = JSON.parse(ponte.estado()); preparar(); }
function aplicar(texto){ const r = JSON.parse(texto); S = r.estado; preparar(); return r; }
function preparar(){
  montarCats();
  S.gastos.forEach(g => g.c = canonCat(g.c));
  S.contas.forEach(c => { if (c.c) c.c = canonCat(c.c); });
  fmt = new Intl.NumberFormat(S.moeda === "BRL" ? "pt-BR" : "pt-PT", {style:"currency", currency:S.moeda});
  S.todos = S.gastos;
  S.meusLanc = S.todos.filter(meu);
  S.vis = S.todos.filter(visivel);
  // lançamento com data futura é pendente: só conta quando a data chegar
  const agoraMs = Date.now();
  S.fut = S.vis.filter(g => g.q > agoraMs);
  S.desp = S.vis.filter(g => g.t !== "r" && g.q <= agoraMs);
  S.rec = S.vis.filter(g => g.t === "r" && g.q <= agoraMs);
  S.contasVis = S.contas.filter(visivel);
  S.contasMes = S.contasVis.filter(c => c.ocs && c.ocs.length);
  S.metasVis = S.metas.filter(m => temCasal() || meu(m));
  S.trocasVis = (!temCasal() || modo !== "nos") ? S.trocas : [];
  if (!temCasal()) modo = "total";
}
const nomeDe = dono => dono === S.eu.id ? S.eu.nome : (S.parceiro ? S.parceiro.nome : "Parceiro(a)");
const bolinha = dono => '<span class="pessoa '+(dono === S.eu.id ? "eu" : "par")+'">'+esc(nomeDe(dono).charAt(0).toUpperCase())+'</span>';

/* ---------- Datas ---------- */
const inicioMes = (a, m) => new Date(a, m, 1).getTime();
const agora = new Date();
const MES_ATUAL = {ano:agora.getFullYear(), mes:agora.getMonth()};
function noMes(q, a, m){ return q >= inicioMes(a, m) && q < inicioMes(a, m+1); }
function chaveDia(ms){ const d = new Date(ms); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function rotuloDia(ms){
  const h = new Date(); const d = new Date(ms);
  const h0 = new Date(h.getFullYear(),h.getMonth(),h.getDate()).getTime();
  const d0 = new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const dif = Math.round((h0-d0)/86400000);
  if (dif === 0) return "Hoje";
  if (dif === 1) return "Ontem";
  return d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
}
function haQuanto(ms){
  const s = (Date.now()-ms)/1000;
  if (s < -60){ const dias = Math.ceil(-s / 86400); return dias <= 1 ? "amanhã ou hoje mais tarde" : "em "+dias+" dias"; }
  if (s < 60) return "agora";
  if (s < 3600) return "há "+Math.floor(s/60)+" min";
  if (s < 86400) return "há "+Math.floor(s/3600)+" h";
  return new Date(ms).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function prazo(d){
  if (d < 0) return "atrasada";
  if (d === 0) return "hoje";
  if (d === 1) return "amanhã";
  return "em "+d+" dias";
}
const idxMes = s => { if (!s) return null; const p = s.split("-").map(Number); return p[0]*12 + p[1] - 1; };
const mesStr = (a, m) => a + "-" + String(m+1).padStart(2, "0");
/** Parcela da conta no mês (1 = primeira) ou null se não acontece nesse mês. */
function parcelaEm(c, a, m){
  const i0 = idxMes(c.ini);
  if (i0 === null) return c.vezes ? null : 1;
  const i = a*12 + m - i0, p = Math.max(1, c.pm || 1);
  if (i < 0 || i % p) return null;
  const n = i / p;
  return !c.vezes || n < c.vezes ? n + 1 : null;
}
const FREQ = {m:"todo mês", q:"a cada 15 dias", s:"toda semana"};
const PM_TXT = {1:"todo mês", 2:"a cada 2 meses", 3:"a cada 3 meses", 6:"a cada 6 meses", 12:"todo ano"};
const freqTxt = c => (!c.freq || c.freq === "m") ? (PM_TXT[c.pm || 1] || "a cada "+c.pm+" meses") : FREQ[c.freq];
/** Datas em que a conta vence no mês (a = ano, m = mês 0-11). */
function ocorrencias(c, a, m){
  const fim = new Date(a, m+1, 0);
  if (!c.freq || c.freq === "m"){
    const n = parcelaEm(c, a, m);
    return n ? [{d:new Date(a, m, Math.min(c.dia, fim.getDate())), n, chave:mesStr(a, m)}] : [];
  }
  const passo = c.freq === "q" ? 14 : 7;
  const [y, mo, dd] = (c.d0 || "").split("-").map(Number);
  if (!y) return [];
  const ini = new Date(y, mo-1, dd), dia = 86400000;
  let k = Math.max(0, Math.ceil(Math.round((new Date(a, m, 1) - ini) / dia) / passo));
  const lista = [];
  for (;;){
    if (c.vezes && k >= c.vezes) break;
    const d = new Date(y, mo-1, dd + k*passo);
    if (d > fim) break;
    lista.push({d, n:k+1, chave:isoData(d.getTime())});
    k++;
  }
  return lista;
}
/** Quantas vezes a conta ainda vence depois do mês atual (só contas com fim). */
function restantesDepois(c){
  if (!c.vezes) return 0;
  const fimMes = new Date(MES_ATUAL.ano, MES_ATUAL.mes + 1, 0);
  if (!c.freq || c.freq === "m"){
    const i0 = idxMes(c.ini); if (i0 === null) return 0;
    const p = Math.max(1, c.pm || 1), cur = MES_ATUAL.ano*12 + MES_ATUAL.mes;
    const ate = cur < i0 ? 0 : Math.min(c.vezes, Math.floor((cur - i0) / p) + 1);
    return Math.max(0, c.vezes - ate);
  }
  const [y, mo, dd] = (c.d0 || "").split("-").map(Number); if (!y) return 0;
  const passo = c.freq === "q" ? 14 : 7;
  const dias = Math.round((fimMes - new Date(y, mo-1, dd)) / 86400000);
  const jaPassaram = dias < 0 ? 0 : Math.floor(dias / passo) + 1;
  return Math.max(0, c.vezes - jaPassaram);
}
function descConta(c){
  const p = c.ini ? c.ini.split("-").map(Number) : [0, 0];
  if (c.vezes === 1) return "única, "+c.dia+" de "+MESES_L[p[1]-1]+(p[0] !== MES_ATUAL.ano ? " de "+p[0] : "");
  const f = freqTxt(c);
  if (c.vezes > 1){
    const oc = (c.ocs || []).find(o => !o.paga) || (c.ocs || [])[0];
    if (oc) return f+", "+oc.n+" de "+c.vezes;
    return restantesDepois(c) > 0 ? f+", "+c.vezes+"× a partir de "+MESES[p[1]-1]+"/"+String(p[0]).slice(2) : "encerrada ("+c.vezes+"×)";
  }
  return f+(c.freq === "m" || !c.freq ? ", dia "+c.dia : "")+(c.var ? " · valor varia" : "");
}

const isoData = ms => { const d = new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

/* ---------- Equivalência (referências escolhidas pela pessoa) ---------- */
function refsDestaque(excluir){ return S.refs.filter(r => r.dest && r.v > 0 && r.id !== excluir).slice(0, 2); }
function equivalencia(v, excluir){
  const refs = refsDestaque(excluir);
  if (!refs.length || !(v > 0)) return "";
  return '<div class="eq">' + refs.map(r => "<span>"+esc(r.e)+" "+num1.format(v/r.v)+"× "+esc(r.n)+"</span>").join("") + "</div>";
}
function equivTexto(v, excluir){
  const r = refsDestaque(excluir)[0];
  return r ? num1.format(v/r.v)+"× "+r.e+" "+r.n : "";
}

/* ---------- Números do mês (na visão escolhida) ---------- */
/* Dinheiro que já tem destino: aportes em planos/metas (inclui trocas e entradas destinadas) e reservas. Sai do “livre”. */
function aportesVis(){
  return (S.aportes || []).filter(a => {
    const m = S.metasVis.find(x => x.id === a.meta); if (!m) return false;
    return modo === "total" || (modo === "eu" ? a.dono === S.eu.id : !!m.sh);
  });
}
function guardadoMes(a, m){ return aportesVis().filter(x => noMes(x.q, a, m)).reduce((s, x) => s + x.v, 0); }
function separadoMes(a, m){ return guardadoMes(a, m) + S.rec.filter(g => noMes(g.q, a, m)).reduce((s, g) => s + (g.rv || 0), 0); }
function numerosMes(){
  const {ano, mes} = MES_ATUAL;
  const desp = S.desp.filter(g => noMes(g.q, ano, mes));
  const saiu = desp.reduce((a,g) => a+g.v, 0);
  const entrou = S.rec.filter(g => noMes(g.q, ano, mes)).reduce((a,g) => a+g.v, 0);
  const variavel = desp.filter(g => !g.cf).reduce((a,g) => a+g.v, 0);
  const restante = variavel / S.hoje * (S.diasNoMes - S.hoje);
  const pend = S.contasMes.filter(c => !c.paga);
  const abertas = c => (c.ocs || []).filter(o => !o.paga).length;
  const compMes = S.contasMes.filter(c => !c.e).reduce((a,c) => a + abertas(c)*c.v, 0);
  // dívidas com fim (parcelas e datas únicas): o que falta depois deste mês
  const agoraIdx = ano*12 + mes;
  const compFuturo = S.contasVis.filter(c => !c.e && c.vezes > 0).reduce((a,c) => a + restantesDepois(c) * c.v, 0);
  const comprometido = compMes + compFuturo;
  const aReceber = S.contasMes.filter(c => c.e).reduce((a,c) => a + (c.ocs || []).filter(o => !o.paga).length*c.v, 0);
  const sep = separadoMes(ano, mes);   // guardado em planos (aportes e trocas) e reservado nas entradas
  const livre = entrou - saiu - sep;
  const ant = new Date(ano, mes-1, 1);
  const limiteAnt = new Date(ant.getFullYear(), ant.getMonth(), Math.min(S.hoje, new Date(ano, mes, 0).getDate()) + 1).getTime();
  const saiuAnt = S.desp.filter(g => g.q >= ant.getTime() && g.q < limiteAnt).reduce((a,g) => a+g.v, 0);
  const temAnt = S.vis.some(g => g.q < inicioMes(ano, mes));
  const trocasMes = S.trocasVis.filter(t => noMes(t.q, ano, mes));
  // acerto do casal: despesas compartilhadas divididas ao meio
  const nos = S.todos.filter(g => g.sh && g.t !== "r" && noMes(g.q, ano, mes));
  const pagoEu = nos.filter(meu).reduce((a,g) => a+g.v, 0);
  const pagoPar = nos.filter(g => !meu(g)).reduce((a,g) => a+g.v, 0);
  return {saiu, entrou, livre, sep, comprometido, compMes, compFuturo, aReceber, restante, sobra: livre + aReceber - compMes - restante,
    saiuAnt, temAnt, nomeAnt: MESES_L[ant.getMonth()], trocasMes, trocado: trocasMes.reduce((a,t) => a+t.v, 0),
    pagoEu, pagoPar, acerto: (pagoEu - pagoPar) / 2};
}

/* ---------- Conquistas, nível e sequência (só o que é meu) ---------- */
function sequencia(){
  const dias = new Set(S.meusLanc.map(g => chaveDia(g.q)).concat(S.trocas.map(t => chaveDia(t.q))));
  const d = new Date();
  if (!dias.has(chaveDia(d.getTime()))) d.setDate(d.getDate()-1);
  let n = 0;
  while (dias.has(chaveDia(d.getTime()))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const meusComentarios = () => S.todos.reduce((a,g) => a + g.cm.filter(c => c.meu).length, 0);
const CONQUISTAS = [
  {id:"primeiro", i:"🌱", n:"Primeiro passo", d:"Registrou o primeiro gasto", ok:() => S.meusLanc.some(g => g.t !== "r")},
  {id:"dez", i:"🔟", n:"Pegando o ritmo", d:"10 lançamentos", ok:() => S.meusLanc.length >= 10},
  {id:"cinquenta", i:"📒", n:"Contador oficial", d:"50 lançamentos", ok:() => S.meusLanc.length >= 50},
  {id:"seq3", i:"🔥", n:"Três dias seguidos", d:"Registrou 3 dias em sequência", ok:() => sequencia() >= 3},
  {id:"seq7", i:"🏅", n:"Semana completa", d:"7 dias em sequência", ok:() => sequencia() >= 7},
  {id:"entrada", i:"💶", n:"Dinheiro entrando", d:"Registrou uma entrada", ok:() => S.meusLanc.some(g => g.t === "r")},
  {id:"emdia", i:"✅", n:"Em dia", d:"Pagou uma conta fixa", ok:() => S.meusLanc.some(g => g.cf)},
  {id:"troca1", i:"🔁", n:"Primeira troca", d:"Evitou um gasto", ok:() => S.trocas.length >= 1},
  {id:"troca10", i:"🧭", n:"Novo hábito", d:"10 trocas registradas", ok:() => S.trocas.length >= 10},
  {id:"sonho", i:"✨", n:"Com destino", d:"Criou uma meta ou imprevisto", ok:() => S.metas.some(meu)},
  {id:"meio", i:"🌓", n:"Meio caminho", d:"Um destino chegou a 50%", ok:() => S.metas.some(m => m.atual >= m.alvo/2)},
  {id:"missao", i:"🏆", n:"Missão cumprida", d:"Concluiu ou quitou um destino", ok:() => S.metas.some(m => m.atual >= m.alvo)},
  {id:"ref", i:"⚖️", n:"Minha régua", d:"Criou uma referência própria", ok:() => S.refs.length >= 2},
  {id:"papo", i:"💬", n:"Conversa", d:"Fez o primeiro comentário", ok:() => meusComentarios() >= 1},
  {id:"casal", i:"💞", n:"Dupla", d:"Entrou em casal no app", ok:() => casalExiste()}
];
function nivel(){
  const desbloq = CONQUISTAS.filter(c => c.ok()).length;
  const trocado = S.trocas.reduce((a,t) => a + t.v, 0);
  const xp = Math.round(S.meusLanc.length*10 + meusComentarios()*5 + desbloq*25 + S.trocas.length*15 + trocado);
  const n = Math.floor(Math.sqrt(xp/40)) + 1;
  const base = 40*(n-1)*(n-1), prox = 40*n*n;
  return {xp, n, base, prox, frac:(xp-base)/(prox-base)};
}
let filaTrofeus = [], mostrandoTrofeu = false;
function verificarConquistas(){
  const vistas = new Set(S.conquistasVistas);
  CONQUISTAS.forEach(c => {
    if (!vistas.has(c.id) && c.ok()){ ponte.marcarConquista(c.id); S.conquistasVistas.push(c.id); filaTrofeus.push(c); }
  });
  proximoTrofeu();
}
function proximoTrofeu(){
  if (mostrandoTrofeu || !filaTrofeus.length || RAPIDO || tutorialAtivo) return;
  mostrandoTrofeu = true;
  const c = filaTrofeus.shift();
  const el = document.createElement("div");
  el.className = "trofeu";
  el.innerHTML = '<span class="i">'+c.i+'</span><small>Conquista desbloqueada</small><b>'+esc(c.n)+'</b>';
  document.body.appendChild(el);
  confete(); vibrar();
  setTimeout(() => { el.remove(); mostrandoTrofeu = false; proximoTrofeu(); }, 2800);
}
function confete(qtd){
  const cores = ["#FFB547","#FF5E7E","#9B8CFF","#4CD6A0","#5DB7FF"];
  for (let i = 0; i < (qtd || 36); i++){
    const p = document.createElement("i");
    p.className = "confete";
    p.style.left = Math.random()*100 + "vw";
    p.style.background = cores[i % cores.length];
    p.style.animationDuration = (1.6 + Math.random()*1.4) + "s";
    p.style.animationDelay = (Math.random()*.4) + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3600);
  }
}

/* ---------- Avisos com desfazer ---------- */
let avisoTimer = null;
function aviso(texto, rotuloAcao, acao){
  if (RAPIDO){ ponte.avisar(texto); return; }
  // cada aviso é um elemento novo, removido por completo depois de 2 s
  $$(".aviso").forEach(e => e.remove());
  clearTimeout(avisoTimer);
  const el = document.createElement("div");
  el.className = "aviso";
  el.innerHTML = "<span>"+esc(texto)+"</span>" + (rotuloAcao ? "<button>"+esc(rotuloAcao)+"</button>" : "");
  document.body.appendChild(el);
  const fechar = () => { el.classList.remove("on"); setTimeout(() => el.remove(), 350); };
  if (rotuloAcao) el.querySelector("button").onclick = e => { e.stopPropagation(); acao(); fechar(); };
  el.onclick = fechar;               // tocar no aviso também fecha
  void el.offsetHeight;              // garante a animação de entrada
  el.classList.add("on");
  avisoTimer = setTimeout(fechar, 2000);
}

/* ---------- Gestos: deslizar para apagar, toque e toque duplo ---------- */
function gestos(corpo, {aoApagar, aoToqueDuplo, aoToque, aoSegurar}){
  let x0 = 0, y0 = 0, dx = 0, arrastando = false, decidido = false, ativo = false, timer = null, tSegurar = null, tMarca = null, segurou = false;
  const soltar = () => { clearTimeout(tSegurar); clearTimeout(tMarca); corpo.classList.remove("segurando"); };
  if (aoSegurar) corpo.addEventListener("contextmenu", e => { if (!corpo.classList.contains("editando")) e.preventDefault(); });
  corpo.addEventListener("pointerdown", e => {
    if (corpo.classList.contains("editando")) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; arrastando = false; decidido = false; ativo = true; segurou = false;
    if (aoSegurar && !e.target.closest("button")){
      tMarca = setTimeout(() => { corpo.classList.add("segurando"); }, 180);
      tSegurar = setTimeout(() => { soltar(); if (!ativo || decidido) return; segurou = true; ativo = false; vibrar(); aoSegurar(e); }, 480);
    }
  });
  corpo.addEventListener("pointermove", e => {
    if (!ativo) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!decidido && (Math.abs(mx) > 10 || Math.abs(my) > 10)){
      soltar();
      decidido = true; arrastando = Math.abs(mx) > Math.abs(my) && mx < 0 && !!aoApagar;
      if (arrastando) corpo.style.transition = "none";
    }
    if (arrastando){ dx = Math.min(0, mx); corpo.style.transform = "translateX("+dx+"px)"; }
  });
  const fim = e => {
    soltar();
    if (!ativo || segurou) return; ativo = false;
    corpo.style.transition = "";
    if (arrastando){
      if (dx < -110){ corpo.style.transform = "translateX(-110%)"; vibrar(); setTimeout(aoApagar, 200); }
      else corpo.style.transform = "";
      return;
    }
    if (decidido || e.type === "pointercancel") return;
    if (e.target.closest("button")) return;
    const t = Date.now();
    if (aoToqueDuplo && ultimoToque.el === corpo && t - ultimoToque.t < 300){
      clearTimeout(timer); ultimoToque = {el:null,t:0}; aoToqueDuplo(e);
    } else {
      ultimoToque = {el:corpo,t};
      if (aoToque) timer = setTimeout(() => { if (ultimoToque.el === corpo && ultimoToque.t === t) aoToque(e); }, aoToqueDuplo ? 300 : 0);
    }
  };
  corpo.addEventListener("pointerup", fim);
  corpo.addEventListener("pointercancel", fim);
}

/* ---------- Folha inferior ---------- */
function abrirFolha(html, montar){
  fecharFolha(true);
  const veu = document.createElement("div"); veu.className = "veu";
  const folha = document.createElement("section"); folha.className = "folha";
  folha.setAttribute("role","dialog");
  folha.innerHTML = '<div class="alca"><i></i></div>' + html;
  document.body.append(veu, folha);
  requestAnimationFrame(() => { veu.classList.add("on"); folha.classList.add("on"); });
  veu.onclick = () => fecharFolha();
  const alca = $(".alca", folha); let y0 = 0, dy = 0, puxando = false;
  alca.addEventListener("pointerdown", e => { y0 = e.clientY; puxando = true; folha.style.transition = "none"; alca.setPointerCapture(e.pointerId); });
  alca.addEventListener("pointermove", e => { if (!puxando) return; dy = Math.max(0, e.clientY - y0); folha.style.transform = "translateY("+dy+"px)"; });
  alca.addEventListener("pointerup", () => { puxando = false; folha.style.transition = ""; if (dy > 90) fecharFolha(); else folha.style.transform = ""; dy = 0; });
  folhaAberta = {veu, folha};
  if (montar) montar(folha);
  return folha;
}
function fecharFolha(imediato){
  if (!folhaAberta) return;
  const {veu, folha} = folhaAberta; folhaAberta = null;
  if (imediato){ veu.remove(); folha.remove(); return; }
  if (RAPIDO){ veu.classList.remove("on"); folha.classList.remove("on"); setTimeout(() => ponte.fechar(), 220); return; }
  veu.classList.remove("on"); folha.style.transform = ""; folha.classList.remove("on");
  setTimeout(() => { veu.remove(); folha.remove(); }, 300);
}

  if (a.etapa === "instalando" || a.etapa === "confirmar") return '<div class="banner-atu"><span>Instalando a versão '+esc(a.versao)+'…</span></div>';

  return '<div class="banner-atu"><span>Nova versão <b>'+esc(a.versao)+'</b> disponível.</span><button class="btn mini" data-atualizar>Atualizar</button></div>';

/* ================= Gráfico do mês: Categorias · Dia a dia · Mês a mês ================= */
let grafVista = (() => { try { return localStorage.getItem("fin.graf") || "cat"; } catch(e){ return "cat"; } })();
const GRAF_ABAS = [["cat","Categorias"],["dia","Dia a dia"],["mes","Mês a mês"],["lin","📈 Linha"]];
const COR_RESTO = "#5A5470";
function saidasDoMes(a, m){
  const fut = inicioMes(a, m) > inicioMes(MES_ATUAL.ano, MES_ATUAL.mes);
  return fut ? doMesExtrato().filter(x => x.t !== "r") : S.desp.filter(g => noMes(g.q, a, m));
}
const compacto = v => v >= 1000 ? (Math.round(v/100)/10).toString().replace(".", ",") + " mil" : String(Math.round(v));
function passoEixo(max){ const b = Math.pow(10, Math.floor(Math.log10(max || 1))); const n = max / b; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * b; }

let grafCat = null;   // categoria principal aberta no gráfico (null = visão geral)
const clarear = (hex, k) => { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return hex; const n = parseInt(m[1], 16);
  const f = c => Math.round(c + (255 - c) * k); return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(x => x.toString(16).padStart(2, "0")).join(""); };
function graficoCategorias(){
  // por categoria principal; ao tocar, abre as subcategorias dela (com voltar)
  const itens = saidasDoMes(extr.ano, extr.mes), soma = {}, porSub = {};
  itens.forEach(g => {
    const p = catPai(g.c), sub = canonCat(g.c).includes(SEPC) ? catNome(g.c) : "Geral";
    soma[p] = (soma[p] || 0) + g.v;
    const o = (porSub[p] = porSub[p] || {})[sub] = (porSub[p][sub] || {v: 0, n: 0, max: null});
    o.v += g.v; o.n++; if (!o.max || g.v > o.max.v) o.max = {d: g.d, v: g.v};
  });
  if (grafCat && !soma[grafCat]) grafCat = null;
  let lista = Object.entries(soma).sort((a,b) => b[1] - a[1]);
  let total = lista.reduce((a,x) => a + x[1], 0);
  if (!total) return {svg:'<p class="nota" style="margin:18px 0;text-align:center">Sem saídas neste mês.</p>', ler:""};
  const drill = grafCat, base = drill ? cat(drill)[1] : null;
  let cor, rotulo, dicaDados, topo = "";
  if (drill){
    lista = Object.entries(porSub[drill]).map(([n, o]) => [n, o.v]).sort((a,b) => b[1] - a[1]);
    total = soma[drill];
    if (lista.length > 6){ const resto = lista.slice(5).reduce((a,x) => a + x[1], 0); lista = lista.slice(0, 5).concat([["Resto", resto]]); }
    cor = (c, i) => c === "Resto" ? COR_RESTO : clarear(base, Math.min(i * 0.16, 0.7));
    rotulo = c => esc(c);
    dicaDados = (c, v) => { const o = porSub[drill][c]; return '<b>'+esc(c)+'</b> em '+esc(drill)+': '+din(v)+' ('+Math.round(v/total*100)+'%)'
      + (o ? ' · '+o.n+' lançamento'+(o.n > 1 ? "s" : "")+' · maior: '+esc(o.max.d)+' '+din(o.max.v) : ''); };
    topo = '<div class="graf-nav"><button data-volta aria-label="Voltar">‹ Voltar</button><b>'+cat(drill)[0]+' '+esc(drill)+'</b><small>'+Math.round(total / Object.values(soma).reduce((a,x) => a + x, 0) * 100)+'% do mês</small></div>';
  } else {
    // no máximo 6 fatias: as 5 maiores + "Resto"
    if (lista.length > 6){ const resto = lista.slice(5).reduce((a,x) => a + x[1], 0); lista = lista.slice(0, 5).concat([["Resto", resto]]); }
    cor = c => c === "Resto" ? COR_RESTO : cat(c)[1];
    rotulo = c => (c === "Resto" ? "" : cat(c)[0]+" ")+esc(c);
    dicaDados = (c, v) => { const subs = Object.entries(porSub[c] || {}).sort((a,b) => b[1].v - a[1].v);
      return '<b>'+rotulo(c)+'</b>: '+din(v)+' ('+Math.round(v/total*100)+'%)'+(c !== "Resto" && (subs.length > 1 || (subs[0] && subs[0][0] !== "Geral")) ? '<br>'+subs.slice(0, 4).map(([n, o]) => esc(n)+' '+din(o.v)).join(' · ')+' · <u>toque para abrir</u>' : ''); };
  }
  const podeAbrir = c => !drill && c !== "Resto" && (Object.keys(porSub[c] || {}).length > 1 || Object.keys(porSub[c] || {})[0] !== "Geral");
  const R = 56, L = 18, C = 66, circ = 2 * Math.PI * R, fol = lista.length > 1 ? 2 : 0;
  let ac = 0, arcos = "";
  lista.forEach(([c, v], i) => {
    const tam = v / total * circ;
    arcos += '<circle data-v="'+i+'"'+(podeAbrir(c) ? ' data-abrircat="'+esc(c)+'"' : '')+' cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" stroke="'+cor(c, i)+'" stroke-width="'+L+'"'
      + ' stroke-dasharray="'+Math.max(tam - fol, 0.5).toFixed(2)+' '+(circ - Math.max(tam - fol, 0.5)).toFixed(2)+'" stroke-dashoffset="'+(-ac).toFixed(2)+'"'
      + ' transform="rotate(-90 '+C+' '+C+')"><title>'+esc(c)+': '+din(v)+'</title></circle>';
    ac += tam;
  });
  const svg = topo + '<div class="rosca"><svg viewBox="0 0 132 132" role="img" aria-label="Saídas por categoria">'+arcos
    + '<text x="'+C+'" y="'+(C-2)+'" text-anchor="middle" style="fill:var(--text);font-size:15px;font-weight:700">'+esc(din(total).replace(/,00(?=\s|$)/, ""))+'</text>'
    + '<text x="'+C+'" y="'+(C+14)+'" text-anchor="middle">'+(drill ? "em "+esc(drill) : "saiu")+'</text></svg>'
    + '<div class="rosca-lista">'+lista.map(([c, v], i) => '<button class="rosca-item" data-v="'+i+'"'+(podeAbrir(c) ? ' data-abrircat="'+esc(c)+'"' : '')+'><i style="background:'+cor(c, i)+'"></i>'
      + '<span>'+rotulo(c)+'</span><small>'+Math.round(v/total*100)+'%'+(podeAbrir(c) ? ' ›' : '')+'</small>'
      + '<div class="barra"><u style="width:'+(v/lista[0][1]*100).toFixed(1)+'%;background:'+cor(c, i)+'"></u></div></button>').join("")+'</div></div>';
  return {svg, dados: lista.map(([c, v]) => dicaDados(c, v)),
    ler: drill ? 'Maior em '+esc(drill)+': <b>'+esc(lista[0][0])+'</b> · '+din(lista[0][1]) : 'Maior: <b>'+esc(lista[0][0])+'</b> · '+din(lista[0][1])+' · toque numa categoria para ver por dentro'};
}

function graficoDias(){
  const {ano, mes} = extr, n = new Date(ano, mes+1, 0).getDate();
  const eAtual = ano === MES_ATUAL.ano && mes === MES_ATUAL.mes;
  const ult = eAtual ? S.hoje : n;
  const dias = Array.from({length: n}, () => ({v: 0, q: 0}));
  saidasDoMes(ano, mes).forEach(g => { const d = new Date(g.q).getDate() - 1; if (dias[d]){ dias[d].v += g.v; dias[d].q++; } });
  const max = Math.max(...dias.map(d => d.v));
  if (!max) return {svg:'<p class="nota" style="margin:18px 0;text-align:center">Sem saídas neste mês.</p>', ler:""};
  const W = 320, H = 150, x0 = 30, y0 = 126, alt = 112, passo = passoEixo(max / 2), topo = Math.ceil(max / passo) * passo;
  const bw = (W - x0) / n, larg = Math.min(Math.max(bw - 2, 2), 24), y = v => y0 - v / topo * alt;
  const media = dias.slice(0, ult).reduce((a,d) => a + d.v, 0) / ult;
  let h = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Saídas por dia">';
  for (let t = 0; t <= topo + 0.001; t += passo) h += '<line class="eixo" x1="'+x0+'" x2="'+W+'" y1="'+y(t)+'" y2="'+y(t)+'" style="opacity:'+(t ? .5 : 1)+'"/><text x="'+(x0-6)+'" y="'+(y(t)+3)+'" text-anchor="end">'+compacto(t)+'</text>';
  dias.forEach((d, i) => {
    const cx = x0 + bw * i + (bw - larg) / 2;
    if (d.v > 0){
      const top = y(d.v), hh = y0 - top, r = Math.min(4, larg / 2, hh);
      const hoje = eAtual && i + 1 === S.hoje;
      h += '<path data-v="'+i+'" fill="var(--mango)" style="opacity:'+(hoje || !eAtual ? 1 : .8)+'" d="M'+cx+' '+y0+'V'+(top+r)+'Q'+cx+' '+top+' '+(cx+r)+' '+top+'H'+(cx+larg-r)+'Q'+(cx+larg)+' '+top+' '+(cx+larg)+' '+(top+r)+'V'+y0+'Z"><title>Dia '+(i+1)+': '+din(d.v)+'</title></path>';
    }
    // área de toque maior que a barra
    h += '<rect data-v="'+i+'" x="'+(x0 + bw * i)+'" y="'+(y0 - alt)+'" width="'+bw+'" height="'+(alt + 14)+'" fill="transparent"/>';
    if (i === 0 || ((i + 1) % 7 === 1 && n - (i + 1) >= 3) || i === n - 1) h += '<text x="'+(cx + larg/2)+'" y="'+(y0+13)+'" text-anchor="middle">'+(i+1)+'</text>';
  });
  h += '<line x1="'+x0+'" x2="'+W+'" y1="'+y(media)+'" y2="'+y(media)+'" stroke="var(--text)" stroke-width="1" style="opacity:.45"/>'
    + '<text x="'+(x0+4)+'" y="'+(y(media)-4)+'" style="fill:var(--text)">média '+compacto(media)+'</text></svg>';
  const maior = dias.reduce((b, d, i) => d.v > dias[b].v ? i : b, 0);
  return {svg: h, dados: dias.map((d, i) => '<b>Dia '+(i+1)+'</b>: '+(d.v ? din(d.v)+' em '+d.q+' lançamento'+(d.q > 1 ? "s" : "") : "nada")),
    ler: 'Média de <b>'+din(media)+'</b> por dia · maior no dia '+(maior+1)+' ('+din(dias[maior].v)+')'};
}

function graficoMeses(){
  const meses = [];
  for (let i = 5; i >= 0; i--){
    const d = new Date(extr.ano, extr.mes - i, 1), a = d.getFullYear(), m = d.getMonth();
    const ent = S.rec.filter(g => noMes(g.q, a, m)).reduce((s,g) => s + g.v, 0);
    const sai = saidasDoMes(a, m).reduce((s,g) => s + g.v, 0);
    meses.push({a, m, ent, sai});
  }
  const max = Math.max(...meses.map(x => Math.max(x.ent, x.sai)));
  if (!max) return {svg:'<p class="nota" style="margin:18px 0;text-align:center">Ainda sem movimentos nestes meses.</p>', ler:""};
  const W = 320, H = 150, x0 = 30, y0 = 126, alt = 112, passo = passoEixo(max / 2), topo = Math.ceil(max / passo) * passo;
  const bw = (W - x0) / 6, larg = Math.min((bw - 14) / 2, 20), y = v => y0 - v / topo * alt;
  const barra = (x, v, cor) => { if (!v) return ""; const top = y(v), r = Math.min(4, larg/2, y0 - top);
    return '<path fill="'+cor+'" d="M'+x+' '+y0+'V'+(top+r)+'Q'+x+' '+top+' '+(x+r)+' '+top+'H'+(x+larg-r)+'Q'+(x+larg)+' '+top+' '+(x+larg)+' '+(top+r)+'V'+y0+'Z"/>'; };
  let h = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Entradas e saídas por mês">';
  for (let t = 0; t <= topo + 0.001; t += passo) h += '<line class="eixo" x1="'+x0+'" x2="'+W+'" y1="'+y(t)+'" y2="'+y(t)+'" style="opacity:'+(t ? .5 : 1)+'"/><text x="'+(x0-6)+'" y="'+(y(t)+3)+'" text-anchor="end">'+compacto(t)+'</text>';
  meses.forEach((x, i) => {
    const cx = x0 + bw * i + (bw - (larg * 2 + 2)) / 2;
    h += '<g data-v="'+i+'">'+barra(cx, x.ent, "var(--ok)") + barra(cx + larg + 2, x.sai, "var(--late)")
      + '<rect x="'+(x0 + bw*i)+'" y="'+(y0-alt)+'" width="'+bw+'" height="'+(alt+14)+'" fill="transparent"/><title>'+cap(MESES[x.m])+': entrou '+din(x.ent)+', saiu '+din(x.sai)+'</title></g>'
      + '<text x="'+(x0 + bw*i + bw/2)+'" y="'+(y0+13)+'" text-anchor="middle"'+(i === 5 ? ' style="fill:var(--text)"' : '')+'>'+cap(MESES[x.m])+'</text>';
  });
  h += '</svg><div class="graf-leg"><span><i style="background:var(--ok)"></i>Entrou</span><span><i style="background:var(--late)"></i>Saiu</span></div>';
  const u = meses[5];
  return {svg: h, dados: meses.map(x => '<b>'+cap(MESES_L[x.m])+'</b>: entrou '+din(x.ent)+' · saiu '+din(x.sai)+' · saldo <b class="'+(x.ent - x.sai < 0 ? "neg" : "pos")+'">'+sdin(x.ent - x.sai)+'</b>'),
    ler: cap(MESES_L[u.m])+': saldo <b class="'+(u.ent - u.sai < 0 ? "neg" : "pos")+'">'+sdin(u.ent - u.sai)+'</b> · toque num mês'};
}

let grafAtual = null;
function corpoGrafico(){
  grafAtual = grafVista === "dia" ? graficoDias() : grafVista === "mes" ? graficoMeses() : grafVista === "lin" ? graficoLinha() : graficoCategorias();
  return grafAtual.svg + '<div class="graf-ler" id="grafLer">'+(grafAtual.ler || "")+'</div>';
}
function grafico(){
  return '<section class="graf" id="graf"><div class="graf-topo"><b>'+(grafVista === "lin" ? "Ganhei × Comprometi" : "Para onde vai")+'</b><div class="graf-abas">'
    + GRAF_ABAS.map(([k,n]) => '<button data-graf="'+k+'" class="'+(grafVista === k ? "on" : "")+'">'+n+'</button>').join("")
    + '</div></div><div id="grafCorpo">'+corpoGrafico()+'</div></section>';
}
let selGraf = null;
function ligarToques(g){
  $$("[data-v]", g).forEach(el => el.onclick = e => {
    e.stopPropagation();
    if (movidoGraf){ movidoGraf = false; return; }
    if (el.dataset.abrircat){ grafCat = el.dataset.abrircat; selGraf = null; redesenharGrafico(g, "frente"); vibrar(); return; }
    const v = el.dataset.v;
    if (selGraf === v){ selGraf = null; g.classList.remove("foco"); $$("[data-v]", g).forEach(x => x.classList.remove("sel")); $("#grafLer", g).innerHTML = grafAtual.ler || ""; return; }
    selGraf = v; g.classList.add("foco");
    $$("[data-v]", g).forEach(x => x.classList.toggle("sel", x.dataset.v === v));
    $("#grafLer", g).innerHTML = (grafAtual.dados || [])[+v] || "";
  });
}
function redesenharGrafico(g, anim){
  const c = $("#grafCorpo", g);
  g.classList.remove("foco"); selGraf = null;
  c.innerHTML = corpoGrafico();
  if (anim){ c.classList.remove("entra-frente", "entra-tras"); void c.offsetWidth; c.classList.add(anim === "frente" ? "entra-frente" : "entra-tras"); }
  $(".graf-topo b", g).textContent = grafVista === "lin" ? "Ganhei × Comprometi" : "Para onde vai";
  ligarGrafico();
}
function ligarGrafico(){
  const g = $("#graf"); if (!g) return;
  $$("[data-graf]", g).forEach(b => b.onclick = () => {
    grafVista = b.dataset.graf; try { localStorage.setItem("fin.graf", grafVista); } catch(e){}
    $$("[data-graf]", g).forEach(x => x.classList.toggle("on", x === b));
    vibrar(); redesenharGrafico(g);
  });
  const vb = $("[data-volta]", g);
  if (vb) vb.onclick = () => { grafCat = null; redesenharGrafico(g, "tras"); vibrar(); };
  // deslizar para a direita volta; para a esquerda abre a maior categoria
  const corpo = $("#grafCorpo", g);
  if (grafVista === "cat" && corpo && !corpo.dataset.desliza){
    corpo.dataset.desliza = "1"; let x0 = null, y0 = null;
    corpo.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
    corpo.addEventListener("touchend", e => {
      if (x0 == null || grafVista !== "cat") return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) < 60 || Math.abs(dy) > 40) return;
      if (dx > 0 && grafCat){ grafCat = null; redesenharGrafico(g, "tras"); vibrar(); }
      else if (dx < 0 && !grafCat){ const p = $("[data-abrircat]", g); if (p){ grafCat = p.dataset.abrircat; redesenharGrafico(g, "frente"); vibrar(); } }
    }, {passive: true});
  }
  selGraf = null;
  ligarToques(g);
  if (grafVista === "lin"){ ligarBotoesZoom(g); ligarGestosLinha(g); }
}

/* ================= Contas, cartões e carteiras ================= */
const TIPOS_CART = {b:["🏦","Conta bancária"], c:["💳","Cartão"], w:["👛","Carteira ou dinheiro"]};
const EMOJIS_CART = ["🏦","💳","👛","💶","🪙","🏧","📱","🐷"];
const carteirasVis = () => (S.carteiras || []).filter(c => meu(c) || (temCasal() && c.sh));
const minhasCarteiras = () => (S.carteiras || []).filter(meu);
const carteiraDe = id => (S.carteiras || []).find(c => c.id === id);
function saldoCarteira(c){
  const agora = Date.now();
  return (c.si || 0) + S.todos.filter(g => g.ca === c.id && g.q <= agora).reduce((a,g) => a + (g.t === "r" ? g.v : -g.v), 0);

function chipsCarteira(atual, attr){

function pagCarteiras(){

  if (temCasal()) h += '<p class="nota">O total do casal soma as suas contas e só o que '+esc(S.parceiro.nome)+' deixou visível. Cada conta pode ser só sua ou do casal.</p>';

function folhaCarteira(id){
  const c = id ? carteiraDe(id) : null;
  let e = c ? c.e : "🏦", t = c ? c.t : "b", sh = c ? !!c.sh : false;
  abrirFolha('<h3>'+(c ? "Editar" : "Nova")+' conta, cartão ou carteira</h3>'
    + '<label class="campo"><span>Nome</span><input id="cN" maxlength="30" placeholder="Ex.: Millennium, Nubank, Dinheiro" value="'+esc(c ? c.n : "")+'"></label>'

    + '<label class="campo"><span>Saldo inicial (opcional)</span><input id="cS" inputmode="decimal" placeholder="0" value="'+(c && c.si ? String(c.si).replace(".", ",") : "")+'"></label>'
    + (temCasal() ? '<div id="cSh"></div>' : '')
    + '<button class="btn" id="cSalvar">Salvar</button>' + (c ? '<button class="btn sec" id="cApagar">Apagar esta conta</button>' : ''), f => {
    const montar = () => {
      $("#cT", f).innerHTML = Object.entries(TIPOS_CART).map(([k,[i,n]]) => '<button class="chip'+(t === k ? " on" : "")+'" data-t="'+k+'">'+i+' '+n+'</button>').join("");
      $("#cE", f).innerHTML = EMOJIS_CART.map(x => '<button class="chip'+(x === e ? " on" : "")+'" data-e="'+x+'" style="font-size:1.25rem">'+x+'</button>').join("");
      $$("#cT .chip", f).forEach(b => b.onclick = () => { t = b.dataset.t; if (Object.values(TIPOS_CART).some(x => x[0] === e)) e = TIPOS_CART[t][0]; montar(); });
