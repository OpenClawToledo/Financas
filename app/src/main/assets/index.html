/* ================= Gráfico de linha: quanto ganhei × quanto comprometi (em tempo real) ================= */
let zoomLin = {a: 0, b: 1};   // janela visível do mês (fração de 0 a 1)
function graficoLinha(){
  const {ano, mes} = extr;
  const ini = inicioMes(ano, mes), fim = inicioMes(ano, mes + 1), agora = Date.now(), mesMs = fim - ini;
  const atual = agora >= ini && agora < fim, corte = atual ? agora : (agora >= fim ? fim : ini);
  const real = S.vis.filter(g => g.q >= ini && g.q < fim && g.q <= corte);
  const ev = (lista, tipoR) => lista.filter(g => (g.t === "r") === tipoR).map(g => ({q: g.q, v: g.v})).sort((a,b) => a.q - b.q);
  const gan = ev(real, true), sai = ev(real, false);
  const pend = projetadas(ano, mes).concat(S.fut.filter(g => noMes(g.q, ano, mes)));
  const pe = tipoR => pend.filter(x => (x.t === "r") === tipoR).map(x => ({q: Math.min(Math.max(x.q, corte), fim - 1), v: x.v})).sort((a,b) => a.q - b.q);
  const pg = pe(true), ps = pe(false);
  const soma = l => l.reduce((a,e) => a + e.v, 0);
  const G = soma(gan), C = soma(sai), aReceber = soma(pg), aPagar = soma(ps);
  const topoV = Math.max(G + aReceber, C + aPagar);
  if (!topoV) return {svg:L('<p class="nota" style="margin:18px 0;text-align:center">Sem movimentos neste mês ainda.</p>'), ler:""};
  const zoomado = zoomLin.b - zoomLin.a < 0.999;
  const qa = ini + zoomLin.a * mesMs, qb = ini + zoomLin.b * mesMs;
  const cumAt = (l, t) => soma(l.filter(e => e.q <= t));
  const Gt = t => cumAt(gan, t) + (t > corte ? cumAt(pg, t) : 0), Ct = t => cumAt(sai, t) + (t > corte ? cumAt(ps, t) : 0);
  // no zoom a escala vertical acompanha o trecho visível
  let vmin = zoomado ? Math.min(Gt(qa), Ct(qa)) : 0, vmax = zoomado ? Math.max(Gt(qb), Ct(qb)) : topoV;
  if (vmax - vmin < 1){ vmax = vmin + 1; }
  const passo = passoEixo((vmax - vmin) / 2.5), base = Math.floor(vmin / passo) * passo, topo = Math.ceil(vmax / passo) * passo + (zoomado ? 0 : 0);
  const W = 320, H = 168, x0 = 30, xf = 312, y0 = 140, alt = 118;
  const X = q => x0 + (q - qa) / (qb - qa) * (xf - x0), Y = v => y0 - (v - base) / ((topo - base) || 1) * alt;
  const pontos = (evs, b0, ti, tf) => { let c = b0; const p = [[ti, c]]; evs.forEach(e => { c += e.v; p.push([e.q, c]); }); p.push([tf, c]); return p; };
  const caminho = p => p.map((q, i) => (i ? "L" : "M") + X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1)).join("");
  const pG = pontos(gan, 0, ini, corte), pC = pontos(sai, 0, ini, corte);
  const pGp = pontos(pg, G, corte, fim), pCp = pontos(ps, C, corte, fim);
  let h = '<defs><clipPath id="clipLin"><rect x="'+x0+'" y="'+(y0-alt-10)+'" width="'+(xf-x0)+'" height="'+(alt+12)+'"/></clipPath></defs>';
  for (let t = base; t <= topo + 0.001; t += passo) h += '<line class="eixo" x1="'+x0+'" x2="'+xf+'" y1="'+Y(t)+'" y2="'+Y(t)+'" style="opacity:'+(t > base ? .5 : 1)+'"/><text x="'+(x0-6)+'" y="'+(Y(t)+3)+'" text-anchor="end">'+compacto(t)+'</text>';
  // datas no eixo: dias (ou horas quando o zoom é grande)
  const n = new Date(ano, mes + 1, 0).getDate(), spanDias = (qb - qa) / 864e5;
  if (spanDias <= 2.2){
    const passoH = spanDias <= 0.6 ? 3 : 6;
    for (let t = Math.ceil(qa / 36e5 / passoH) * passoH * 36e5; t <= qb; t += passoH * 36e5){
      const d = new Date(t); h += '<text x="'+X(t)+'" y="'+(y0+14)+'" text-anchor="middle">'+(d.getHours() === 0 ? d.getDate() + "/" + (d.getMonth() + 1) : d.getHours() + "h")+'</text>';
    }
  } else {
    const k = spanDias > 20 ? 7 : spanDias > 10 ? 3 : spanDias > 5 ? 2 : 1;
    for (let d = 1; d <= n; d++){
      const t = new Date(ano, mes, d, 12).getTime();
      if (t < qa || t > qb) continue;
      if (zoomado ? (d - 1) % k === 0 : [1, 8, 15, 22, n].includes(d)) h += '<text x="'+X(t)+'" y="'+(y0+14)+'" text-anchor="middle">'+d+'</text>';
    }
  }
  h += '<g clip-path="url(#clipLin)"><path d="'+caminho(pG)+'L'+X(corte)+' '+Y(base)+'L'+X(ini)+' '+Y(base)+'Z" fill="var(--ok)" opacity=".10"/>'
    + '<path class="lin-p" d="'+caminho(pGp)+'" stroke="var(--ok)"/><path class="lin-p" d="'+caminho(pCp)+'" stroke="var(--late)"/>'
    + '<path class="lin" d="'+caminho(pG)+'" stroke="var(--ok)"/><path class="lin" d="'+caminho(pC)+'" stroke="var(--late)"/>';
  if (atual) h += L('<line class="lin-agora" x1="')+X(agora)+'" x2="'+X(agora)+'" y1="'+(y0-alt-4)+'" y2="'+y0+'"/>';
  h += '<circle cx="'+X(corte)+'" cy="'+Y(G)+'" r="3.5" fill="var(--ok)"/><circle cx="'+X(corte)+'" cy="'+Y(C)+'" r="3.5" fill="var(--late)"/>';
  // pontos de cada lançamento quando há zoom
  if (zoomado){
    gan.forEach((e, i) => { if (e.q >= qa && e.q <= qb) h += '<circle cx="'+X(e.q)+'" cy="'+Y(cumAt(gan, e.q))+'" r="2.4" fill="var(--ok)"/>'; });
    sai.forEach(e => { if (e.q >= qa && e.q <= qb) h += '<circle cx="'+X(e.q)+'" cy="'+Y(cumAt(sai, e.q))+'" r="2.4" fill="var(--late)"/>'; });
  }
  h += '</g>';
  if (atual && agora >= qa && agora <= qb) h += '<text x="'+X(agora)+'" y="'+(y0-alt-7)+L('" text-anchor="middle" style="fill:var(--text)">agora</text>');
  // toque por dia
  const dados = [];
  for (let d = 1; d <= n; d++){
    const t0 = new Date(ano, mes, d).getTime(), t1 = Math.min(new Date(ano, mes, d, 23, 59, 59).getTime(), fim - 1), prev = t1 > corte;
    const g = Gt(t1), c = Ct(t1);
    dados.push(L('<b>Dia ')+d+'</b>'+(prev ? ' (previsto)' : '')+': ganhei '+din(g)+' · comprometi '+din(c)+' · <b class="'+(g - c < 0 ? "neg" : "pos")+'">'+sdin(g - c)+'</b>');
    const xa = Math.max(X(t0), x0), xb = Math.min(X(t1 + 1), xf);
    if (xb - xa > 1) h += '<rect data-v="'+(d-1)+'" x="'+xa+'" y="'+(y0-alt-4)+'" width="'+(xb-xa)+'" height="'+(alt+4)+'" fill="transparent"/>';
  }
  const perto = (a, b) => Math.abs(zoomLin.a - a) < .004 && Math.abs(zoomLin.b - b) < .004;
  const zb = (k, t, on) => '<button data-z="'+k+'" class="'+(on ? "on" : "")+'">'+t+'</button>';
  const comp = C + aPagar, tt = tempoTrabalho(comp), sep = separadoMes(ano, mes);
  const ler = L('Ganhei <b class="pos">')+din(G)+'</b>'+(aReceber ? ' <small>(+'+din(aReceber)+' a receber)</small>' : '')
    + L(' · Comprometi <b class="neg">')+din(comp)+L('</b> <small>(saiu ')+din(C)+(aPagar ? ' + '+din(aPagar)+' a pagar' : '')+')</small>'
    + L('<br>Sobra <b class="')+(G + aReceber - comp < 0 ? "neg" : "pos")+'">'+sdin(G + aReceber - comp)+'</b>'
    + (tt ? ' · comprometeu <b>'+tt+L('</b> do seu trabalho') : '') + (sep ? L(' · separado em metas/reserva: ')+din(sep) : '');
  const leg = L('<div class="graf-leg"><span><i style="background:var(--ok)"></i>Ganhei</span><span><i style="background:var(--late)"></i>Comprometi</span><span><i class="trac"></i>A receber / a pagar</span></div>')
    + '<div class="graf-zoom">'+zb("-", "−", false)+zb("+", "+", false)+zb("mes", L("Mês"), !zoomado)+zb("sem", L("7 dias"), false)+zb("hoje", L("Hoje"), false)+'<small>'+(zoomado ? L("arraste para andar") : L("pinça para aproximar"))+'</small></div>';
  return {svg: '<svg id="svgLin" viewBox="0 0 '+W+' '+H+L('" role="img" aria-label="Ganhei e comprometi ao longo do mês">')+h+'</svg>'+leg, dados, ler};
}

// ----- zoom: pinça, arrastar e botões -----
const ZOOM_MIN = 0.02;
function ajustarZoom(a, b){
  let span = Math.min(1, Math.max(ZOOM_MIN, b - a));
  a = Math.min(Math.max(0, a), 1 - span);
  zoomLin = {a, b: a + span};
}
function refazerLinha(){
  const g = $("#graf"), svg = $("#svgLin", g); if (!svg) return;
  grafAtual = graficoLinha();
  const t = document.createElement("div"); t.innerHTML = grafAtual.svg;
  const novo = $("#svgLin", t); if (!novo) return;
  svg.innerHTML = novo.innerHTML;
  $$(".graf-zoom", g).forEach(z => z.replaceWith($(".graf-zoom", t)));
  ligarToques(g); ligarBotoesZoom(g);
}
function zoomPara(fator, centroFrac){
  const span = zoomLin.b - zoomLin.a, c = centroFrac == null ? (zoomLin.a + zoomLin.b) / 2 : centroFrac;
  const ns = Math.min(1, Math.max(ZOOM_MIN, span * fator)), rel = (c - zoomLin.a) / span;
  ajustarZoom(c - rel * ns, c - rel * ns + ns);
}
function ligarBotoesZoom(g){
  const {ano, mes} = extr, n = new Date(ano, mes + 1, 0).getDate(), dia = 1 / n;
  const ini = inicioMes(ano, mes), fim = inicioMes(ano, mes + 1), agora = Date.now();
  const fr = agora >= ini && agora < fim ? (agora - ini) / (fim - ini) : 0;
  $$("[data-z]", g).forEach(b => b.onclick = e => {
    e.stopPropagation(); const k = b.dataset.z;
    const agoraFr = (zoomLin.a <= fr && fr <= zoomLin.b) ? fr : null;
    if (k === "+") zoomPara(0.5, agoraFr);
    else if (k === "-") zoomPara(2, agoraFr);
    else if (k === "mes") ajustarZoom(0, 1);
    else if (k === "sem") ajustarZoom(fr - 3.5 * dia, fr + 3.5 * dia);
    else if (k === "hoje"){ const i0 = Math.floor(fr * n) * dia; ajustarZoom(i0, i0 + dia); }
    vibrar(); refazerLinha();
  });
}
let movidoGraf = false;
function ligarGestosLinha(g){
  const svg = $("#svgLin", g); if (!svg || svg.dataset.gestos) return;
  svg.dataset.gestos = "1"; svg.style.touchAction = "none";
  const pts = new Map(); let ref = null;
  const larg = () => svg.getBoundingClientRect().width * (282 / 320);
  const dist = () => { const [p, q] = [...pts.values()]; return Math.hypot(p.x - q.x, p.y - q.y); };
  const cf = () => { const [p, q] = [...pts.values()]; const r = svg.getBoundingClientRect(); return Math.min(1, Math.max(0, ((p.x + q.x) / 2 - r.left - r.width * 30 / 320) / larg())); };
  svg.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY}); movidoGraf = false;
    ref = pts.size === 2 ? {d: dist(), z: {...zoomLin}, c: cf()} : {x: e.clientX, z: {...zoomLin}};
  });
  svg.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size >= 2 && ref && ref.d){
      movidoGraf = true;
      const span0 = ref.z.b - ref.z.a, ns = Math.min(1, Math.max(ZOOM_MIN, span0 * ref.d / Math.max(dist(), 1)));
      const abs = ref.z.a + ref.c * span0; ajustarZoom(abs - ref.c * ns, abs - ref.c * ns + ns); refazerLinha();
    } else if (pts.size === 1 && ref && ref.x != null){
      const dx = e.clientX - ref.x;
      if (Math.abs(dx) > 6) movidoGraf = true;
      if (movidoGraf && ref.z.b - ref.z.a < 0.999){
        const span = ref.z.b - ref.z.a; ajustarZoom(ref.z.a - dx / larg() * span, ref.z.a - dx / larg() * span + span); refazerLinha();
      }
    }
  });
  const fim = e => { pts.delete(e.pointerId); ref = pts.size === 1 ? {x: [...pts.values()][0].x, z: {...zoomLin}} : null; };
  svg.addEventListener("pointerup", fim); svg.addEventListener("pointercancel", fim);
}

function tickGrafico(){
  if (grafVista !== "lin" || aba !== "feed") return;
  const g = $("#graf"), c = $("#grafCorpo"); if (!g || !c || g.classList.contains("foco")) return;
  refazerLinha();
}
setInterval(tickGrafico, 20000);

/* ================= Dinheiro de hoje: quanto posso gastar e quanto tempo dura ================= */
const DIA_INI = 7, DIA_FIM = 23;   // horas acordado
let tema = lerPrefTema();
function lerPrefTema(){ try { const t = localStorage.getItem("fin.tema") || "escuro"; return t === "centavo" ? "nota" : t; } catch(e){ return "escuro"; } }
let fundoTema = (() => { try { const f = localStorage.getItem("fin.fundoTema") || "verde"; return {papel:"verde", kraft:"ouro"}[f] || f; } catch(e){ return "verde"; } })();
function aplicarTema(){
  const b = document.body;
  b.classList.toggle("tema-nota", tema === "nota");
  b.classList.toggle("fundo-azul", fundoTema === "azul");
  b.classList.toggle("fundo-ouro", fundoTema === "ouro");
  b.classList.toggle("fundo-noite", fundoTema === "noite");
}
const valorHora = () => { const r = (S.refs || []).find(x => /hora/i.test(x.n) && x.v > 0); return r ? r.v : 0; };
function tempoTrabalho(v){
  const vh = valorHora(); if (!vh || !v) return "";
  const min = Math.round(v / vh * 60);
  if (min < 1) return "menos de 1 min";
  if (min < 60) return min+" min";
  const h = Math.floor(min / 60), m = min % 60;
  return h+"h"+(m ? String(m).padStart(2, "0") : "");
}

function numerosHoje(){
  const n = numerosMes();
  const ag = new Date(), ini = new Date(ag.getFullYear(), ag.getMonth(), ag.getDate()).getTime();
  const hoje = S.desp.filter(g => g.q >= ini && g.q <= Date.now() && !g.cf);
  const gasto = hoje.reduce((a, g) => a + g.v, 0);
  const temEntradas = n.entrou > 0 || S.contasMes.some(c => c.e);
  const diasRest = S.diasNoMes - S.hoje + 1;
  // o que sobra do mês depois das contas ainda por pagar, repartido pelos dias que faltam (hoje incluído)
  const disponivel = n.livre + n.aReceber - n.compMes + gasto;
  const orc = temEntradas ? Math.max(0, disponivel / diasRest) : 0;
  const hAgora = ag.getHours() + ag.getMinutes() / 60;
  const horasPassadas = Math.max(0.5, Math.min(DIA_FIM, hAgora) - DIA_INI);

  const resta = orc - gasto;

  if (ritmo > 0 && resta > 0) fim = Math.min(24, Math.max(hAgora, DIA_INI) + resta / ritmo);

  hoje.forEach(g => porCat[catPai(g.c)] = (porCat[catPai(g.c)] || 0) + g.v);
  return {temEntradas, orc, gasto, resta, ritmo, fim, hAgora, diasRest, porCat, qtd: hoje.length};
}

    h += '<div class="cartao'+(amort ? " amortizar" : "")+(f >= 1 ? " feita" : "")+'" data-meta="'+m.id+'"><div class="top"><span class="emo">'+esc(m.e)+'</span>'
      + '<div><b>'+esc(m.n)+'<span class="tipo-tag">'+(amort ? L("Amortizar") : L("Juntar"))+'</span>'+(m.sh ? L('<span class="nos-tag">Nós</span>') : '')+'</b><small>'+(amort ? L("Pago ") : "")+din(m.atual)+DE+din(m.alvo)+'</small></div><span class="pct">'+Math.round(f*100)+'%</span></div>'
      + '<div class="trilho"><i data-f="'+fReal+'"></i><i class="tr" data-f="'+fTr+'"></i></div>'
      + (viaTrocas > 0 ? '<div class="leg-meta"><span><i></i>'+(amort ? L("Pago") : L("Guardado"))+' '+din(m.atual - viaTrocas)+L('</span><span><i class="tr"></i>Trocas ')+din(viaTrocas)+'</span></div>' : '')
      + '<p class="nota" style="margin:0 0 12px">'+(f >= 1 ? (amort ? L("Quitado.") : L("Meta concluída.")) : L("Faltam ")+din(falta)+(amort ? L(" para quitar") : "")+(equivTexto(falta) ? L(", ou ")+esc(equivTexto(falta)) : "")+".")+'</p>'
      + '<div class="acoes"><button data-guardar>'+(amort ? L("Pagar parte") : L("Guardar"))+'</button>'+(meu(m) ? L('<button data-apagar-meta>Excluir</button>') : '')+'</div></div>';
  });
  h += L('<button class="btn" data-nova-meta>Novo destino</button>');

  h += L('<h3 class="h3">Minhas referências</h3><p class="nota">É com elas que o app traduz valores. As marcadas com contorno aparecem nos cartões (até 2).</p><div class="refs">');
  S.refs.forEach(r => { h += '<button class="ref'+(r.dest ? " dest" : "")+'" data-editar-ref="'+r.id+'">'+esc(r.e)+' '+esc(r.n)+' · '+din(r.v)+'</button>'; });
  h += L('<button class="ref" data-nova-ref="">+ Nova</button></div>');
  return h;
}

/* Linha "prevista" (vem de uma conta que se repete): tocar abre a conta, segurar edita a conta.
   Não tem Editar/Duplicar/Comentários/Apagar: não é um lançamento, é a conta. */
function ligarPrevista(b){
  if (b.dataset.ligada) return; b.dataset.ligada = "1";
  let t = null, segurou = false, x0 = 0, y0 = 0;
  const parar = () => { clearTimeout(t); t = null; b.classList.remove("segurando"); };
  b.addEventListener("contextmenu", e => e.preventDefault());
  b.addEventListener("pointerdown", e => {
    segurou = false; x0 = e.clientX; y0 = e.clientY;
    t = setTimeout(() => { t = null; segurou = true; vibrar(); folhaEditarConta(b.dataset.conta); }, 480);
  });
  b.addEventListener("pointermove", e => { if (t && (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10)) parar(); });
  b.addEventListener("pointerup", parar);
  b.addEventListener("pointercancel", parar);
  b.onclick = e => { if (segurou){ e.preventDefault(); segurou = false; return; } folhaConta(b.dataset.conta); };
}
function ligarLista(){
  $$("[data-abrir]").forEach(b => b.onclick = () => folhaDetalhe(b.dataset.abrir));
  $$("#listaExtrato [data-conta]").forEach(ligarPrevista);

function contar(el, alvo){
  const t0 = performance.now(), dur = 900;
  const passo = t => { const k = Math.min(1, (t-t0)/dur); const e = 1 - Math.pow(1-k, 3); el.textContent = din(alvo*e); if (k < 1) requestAnimationFrame(passo); };
  requestAnimationFrame(passo);
}

  const svg = d.firstChild; corpo.appendChild(svg); vibrar();
  setTimeout(() => svg.remove(), 850);
}

/* ================= Segurar o cartão: tudo vira editável ali mesmo ================= */
function editarNoCartao(el, id){
  const g = achar(id); if (!g || !meu(g)) return;
  if ($(".corpo.editando")){ render(false); el = $('.post[data-id="'+id+'"]'); if (!el) return; }
  const corpo = $(".corpo", el);
  let receita = g.t === "r", escolhida = g.c, sh = !!g.sh;
  let v = String(g.v).replace(".", ","), d = g.d, dt = isoData(g.q);
  // lançamento de uma conta que se repete: escolher se a mudança vale só aqui ou também daqui para frente
  const conta = contaDaSerie(g);
  const podeSerie = conta && meu(conta);
  let escopo = "este";
  corpo.style.transform = ""; corpo.classList.add("editando");
  const notaEscopo = () => {
    if (!conta) return "";
    if (escopo === "este") return L("Muda só este lançamento. <b>A conta e as próximas datas continuam iguais.</b>");
    const mensal = !conta.freq || conta.freq === "m";
    const vs = String(v).trim(), nv = parseFloat(vs.includes(",") ? vs.replace(/\./g, "").replace(",", ".") : vs), mud = [];
    if (nv > 0 && Math.abs(nv - conta.v) >= 0.005) mud.push("valor <b>"+din(nv)+"</b>");
    const nome = serieNome(d);
    if (nome && nome !== conta.n) mud.push("nome <b>"+esc(nome)+"</b>");
    if (escolhida !== (conta.c || "")) mud.push("categoria <b>"+esc(catNome(escolhida))+"</b>");
    const dia = dt ? +dt.split("-")[2] : 0;
    const mudaDia = dia && dia !== new Date(g.q).getDate();
    if (mudaDia && mensal) mud.push(L("todo dia <b>")+dia+"</b>");
    return (mud.length ? L("Daqui para frente: ")+mud.join(", ")+"." : L("Nada muda nas próximas ainda."))
      + (mudaDia && !mensal ? L(" A data das próximas não muda (conta ")+(conta.freq === "q" ? L("quinzenal") : L("semanal"))+L("); só a deste.") : "")
      + L(" <b>Os lançamentos anteriores ficam como estão.</b>");
  };
  const atualizarNota = () => { const n = $(".nota-esc", corpo); if (n) n.innerHTML = notaEscopo(); };
  const desenhar = () => {
    const [emoji, cor] = cat(escolhida);
    corpo.innerHTML = '<div class="ed-topo"><span class="av" style="--c:'+cor+'">'+emoji+'</span>'
      + '<div class="seg"><button data-r="0" class="'+(receita ? "" : "on")+L('">Saída</button><button data-r="1" class="')+(receita ? "on" : "")+L('">Entrada</button></div>')
      + '<button class="tag" style="--c:'+cor+'" data-ed-cat>'+esc(catNome(escolhida))+'</button></div>'
      + (conta ? L('<div class="ed-escopo"><small>🔁 Faz parte de “')+esc(conta.n)+'” · '+esc(descConta(conta))+'</small>'
        + (podeSerie ? '<div class="seg"><button data-esc="este" class="'+(escopo === "este" ? "on" : "")+L('">Só este</button><button data-esc="prox" class="')+(escopo === "prox" ? "on" : "")+L('">Este e os próximos</button></div>') : '')
        + '<span class="nota-esc">'+(podeSerie ? notaEscopo() : L("Só quem criou a conta pode mudar as próximas; aqui muda só este lançamento."))+'</span></div>' : '')
      + '<input class="ed-valor'+(receita ? " pos" : "")+L('" id="edV" inputmode="decimal" aria-label="Valor" value="')+esc(v)+'">'
      + L('<input class="ed-desc" id="edD" aria-label="Descrição" value="')+esc(d)+'" enterkeyhint="done">'
      + L('<input class="ed-data" id="edDt" type="date" aria-label="Data" value="')+dt+'">'
      + chaveNos(sh)
      + L('<div class="ed-acoes"><button data-ed="cancelar">Cancelar</button><button data-ed="dup">Duplicar</button><button class="del" data-ed="apagar">Apagar</button></div>')
      + L('<div class="ed-acoes"><button class="ok" data-ed="salvar">Salvar</button></div>');
    $("#edV", corpo).oninput = e => { v = e.target.value; atualizarNota(); };
    $("#edD", corpo).oninput = e => { d = e.target.value; atualizarNota(); };
    $$("[data-esc]", corpo).forEach(b => b.onclick = () => { escopo = b.dataset.esc; vibrar(); desenhar(); });
    $("#edD", corpo).onkeydown = e => { if (e.key === "Enter") salvar(); };
    $("#edDt", corpo).oninput = e => { dt = e.target.value; atualizarNota(); };
    $$("[data-r]", corpo).forEach(b => b.onclick = () => {
      receita = b.dataset.r === "1";
      const lista = receita ? S.categoriasReceita : S.categorias;
      if (!lista.includes(escolhida)) escolhida = receita ? OUTRAS_REC : K("Outros");
      desenhar();
    });
    $("[data-ed-cat]", corpo).onclick = () => {
      let tmp = escolhida;
      abrirFolha(L('<h3>Categoria</h3><div id="rCat"></div><button class="btn" id="rOk">Confirmar</button>'), f => {
        roda($("#rCat", f), itensCategoria(receita, false), escolhida, x => { tmp = x; });
        $("#rOk", f).onclick = () => { escolhida = tmp; fecharFolha(); desenhar(); };
      });
    };
    const sw = $("#swNos", corpo); if (sw) sw.onclick = () => { sh = !sh; desenhar(); };
    $('[data-ed="cancelar"]', corpo).onclick = () => render(false);
    $('[data-ed="dup"]', corpo).onclick = () => { aplicar(ponte.duplicarGasto(id)); vibrar(); render(false); aviso(L("Duplicado com a data de hoje")); verificarConquistas(); };
    $('[data-ed="apagar"]', corpo).onclick = () => { render(false); apagarGasto(id); };
    $('[data-ed="salvar"]', corpo).onclick = salvar;
  };
  const salvar = () => {
    const [a, m, dd] = (dt || "").split("-").map(Number);
    const orig = new Date(g.q);
    const nq = a ? new Date(a, m-1, dd, orig.getHours(), orig.getMinutes(), orig.getSeconds(), orig.getMilliseconds()).getTime() : g.q;
    if (!aplicar(ponte.editarGasto(id, String(nq), v, d, escolhida, receita, sh)).ok){ aviso(L("Confira o valor e a descrição")); return; }
    if (podeSerie && escopo === "prox"){
      const mensal = !conta.freq || conta.freq === "m";
      const r = aplicar(ponte.editarConta(conta.id, serieNome(d) || conta.n, v, escolhida, mensal && a ? dd : 0));
      vibrar(); render(false); aviso(r.ok ? L("Salvo neste e nos próximos") : L("Salvo só neste; confira os dados da conta")); return;
    }
    vibrar(); render(false); aviso(L("Alterações salvas"));
  };
  desenhar();
}

/* Conta que se repete de onde veio o lançamento (null se é avulso ou de data única) */
function contaDaSerie(g){
  if (!g.cf) return null;
  const c = S.contas.find(x => x.id === g.cf);
  return c && c.vezes !== 1 ? c : null;
}
/* "Internet (3/12)" → "Internet": o número da parcela é do lançamento, não da conta */
const serieNome = d => String(d || "").replace(/\s*\(\d+\/\d+\)\s*$/, "").trim();

/* ================= Curtidas e comentários animados ao rolar ================= */
const COM_VISTOS = (() => { try { return new Set(JSON.parse(localStorage.getItem("fin.comVistos") || "[]")); } catch(e){ return new Set(); } })();
function marcarVisto(k){
  COM_VISTOS.add(k);
  try { localStorage.setItem("fin.comVistos", JSON.stringify([...COM_VISTOS].slice(-400))); } catch(e){}
}
let obsFeed = null;
function animarAoRolar(){
  if (obsFeed){ obsFeed.disconnect(); obsFeed = null; }
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  obsFeed = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    obsFeed.unobserve(e.target);
    const cur = $(".acao.curtido", e.target);
    if (cur){ cur.classList.remove("ao-ver"); void cur.offsetWidth; cur.classList.add("ao-ver"); }
    const p = $(".ultimo-com[data-com]", e.target);
    if (p && p.dataset.pendente != null) digitar(p);
  }), {threshold: .6});
  $$(".post[data-id]").forEach(el => {
    const p = $(".ultimo-com[data-com]", el);
    if (p && !COM_VISTOS.has(p.dataset.com)){
      // comentário novo: fica em branco e é digitado letra a letra quando o cartão aparecer
      const tx = $(".tx", p);
      p.style.minHeight = p.offsetHeight + "px";
      p.dataset.pendente = tx.textContent; tx.textContent = ""; p.classList.add("digitando");
    }
    obsFeed.observe(el);
  });
}
function digitar(p){
  const tx = $(".tx", p), letras = [...p.dataset.pendente];
  delete p.dataset.pendente;
  marcarVisto(p.dataset.com);
  const passo = Math.max(18, Math.min(55, 1400 / Math.max(letras.length, 1)));
  let i = 0;
  const t = setInterval(() => {
    if (!p.isConnected){ clearInterval(t); return; }
    tx.textContent = letras.slice(0, ++i).join("");
    if (i >= letras.length){ clearInterval(t); p.classList.remove("digitando"); p.classList.add("postou"); p.style.minHeight = ""; }
  }, passo);
}

/* Backup: sugere uma cópia se nunca foi feita (com dados) ou se passou de 30 dias */
function backupAtrasado(){
  let ms = 0; try { ms = +localStorage.getItem("fin.backupMs") || 0; } catch(e){}
  if (!ms) return (S.meusLanc || []).length >= 10;
  return Date.now() - ms > 30 * 864e5;
}

function evitei(id){
  const r = aplicar(ponte.evitei(id));
  if (!r.ok) return;
  vibrar();
  if (RAPIDO){ ponte.avisar(r.msg); fecharFolha(); return; }
  confete(18);
  const ref = S.refs.find(x => x.id === id);

/* Roda de rolagem: itens [{v, t}]; aoMudar(v) quando o item do centro muda. */
function roda(el, itens, marcada, aoMudar){
  const H = 44;
  el.classList.add("roda");
  el.innerHTML = '<div class="roda-lista"><div class="roda-esp"></div>'
    + itens.map((it, i) => '<div class="roda-it" data-i="'+i+'">'+it.t+'</div>').join("") + '<div class="roda-esp"></div></div>';
  const Lr = el.firstChild, els = $$(".roda-it", el);
  let atual = Math.max(0, itens.findIndex(it => it.v === marcada));
  const marcar = i => els.forEach((d, k) => d.classList.toggle("on", k === i));
  const posicionar = () => { Lr.scrollTop = atual * H; };
  marcar(atual); posicionar(); requestAnimationFrame(posicionar);
  Lr.onscroll = () => {
    const i = Math.min(itens.length - 1, Math.max(0, Math.round(Lr.scrollTop / H)));
    if (i === atual) return;
    atual = i; marcar(i); vibrar(); aoMudar(itens[i].v);
  };
  els.forEach(d => d.onclick = () => Lr.scrollTo({top: +d.dataset.i * H, behavior: "smooth"}));
  return { texto: (i, t) => { if (els[i]) els[i].innerHTML = t; } };
}

/** Duas filas de chips: categoria principal e, por baixo, as subcategorias dela. */
function chipsCat(receita, escolhida, comAuto){
  const chip = (v, t, on, extra) => '<button class="chip'+(extra || "")+(on ? " on" : "")+'" data-c="'+esc(v)+'">'+t+'</button>';
  const arv = S.arvore || [];
  const auto = comAuto ? chip("", L("✨ Automática"), !escolhida, " auto") : "";
  if (receita){
    const rec = arv.find(c => c.receita) || {n:K("Receitas"), subs:[]};
    return {pais: auto + rec.subs.map(x => chip(rec.n + SEPC + x.n, x.e+" "+esc(x.n), escolhida === rec.n + SEPC + x.n)).join(""), subs: ""};
  }
  const pai = escolhida ? catPai(escolhida) : "";
  const p = arv.find(c => c.n === pai && !c.receita);
  return {
    pais: auto + arv.filter(c => !c.receita).map(c => chip(c.n, c.e+" "+esc(c.n), pai === c.n)).join(""),
    subs: p && p.subs.length ? chip(p.n, L("Geral"), escolhida === p.n) + p.subs.map(x => chip(p.n + SEPC + x.n, x.e+" "+esc(x.n), escolhida === p.n + SEPC + x.n)).join("") : ""
  };
}

/* ---------- Voz: números por extenso junto da moeda ("cinco euros e cinquenta") ---------- */
const NUM_PAL = {zero:0,um:1,uma:1,dois:2,duas:2,"três":3,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,
  catorze:14,quatorze:14,quinze:15,dezasseis:16,dezesseis:16,dezassete:17,dezessete:17,dezoito:18,dezanove:19,dezenove:19,vinte:20,trinta:30,
  quarenta:40,cinquenta:50,"cinqüenta":50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,
  quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900,mil:1000};
const MOEDA_PAL = /^(€|euros?|reais|real|cêntimos?|centimos?|centavos?)$/i;
function falaParaTexto(t){
  let s = String(t || "").trim(), mais = /^mais\s+/i.test(s);
  if (mais) s = s.replace(/^mais\s+/i, "");
  const pal = s.split(/\s+/), saida = [];
  for (let i = 0; i < pal.length; ){
    // junta uma sequência de números por extenso ("vinte e cinco")
    let j = i, total = 0, atual = 0, achou = false;
    while (j < pal.length){
      const w = pal[j].toLowerCase();
      if (NUM_PAL[w] !== undefined){ achou = true; if (w === "mil"){ total += (atual || 1) * 1000; atual = 0; } else atual += NUM_PAL[w]; j++; }
      else if (achou && w === "e" && j + 1 < pal.length && NUM_PAL[pal[j+1].toLowerCase()] !== undefined) j++;
      else break;
    }
    const depoisMoeda = j < pal.length && MOEDA_PAL.test(pal[j]);
    const antesMoeda = saida.length >= 2 && saida[saida.length-1].toLowerCase() === "e" && MOEDA_PAL.test(saida[saida.length-2]);
    if (achou && (depoisMoeda || antesMoeda)){ saida.push(String(total + atual)); i = j; }
    else { saida.push(pal[i]); i++; }
  }
  return (mais ? "+" : "") + saida.join(" ");
}

function folhaFatura(f){
  const hoje = isoData(Date.now());
  const chaveNome = n => semAcento(n).split(/\s+/)[0];
  const existente = f.emissor !== "Fatura" ? S.contasVis.find(c => !c.e && chaveNome(c.n) === chaveNome(f.emissor)) : null;
  let usarExistente = !!existente;
  let nome = f.emissor === "Fatura" ? "" : f.emissor;
  let valor = f.valor ? f.valor.toFixed(2).replace(".", ",") : "";
  let data = f.dataLimite || f.dataEmissao || hoje;
  let pm = S.premium ? f.pm : 0, sugestao = f.pm;
  let prestacoes = f.totalParcelas > 0;
  let variavel = !!f.variavel;
  let paga = !!f.debitoDireto && data <= hoje;
  let cat = canonCat(f.categoria) || K("Outros");
  let sh = modo === "nos";
  const PMS = [[0,L("Só esta")],[1,L("Todo mês")],[2,L("2 em 2 meses")],[3,L("3 em 3 meses")],[6,L("6 em 6 meses")],[12,L("Todo ano")]];
  abrirFolha(L('<h3>📄 Fatura')+(f.emissor !== "Fatura" ? ' '+esc(f.emissor) : '')+'</h3><div id="fCorpo"></div>', fo => {
    const montar = () => {
      let h = '';
      const info = [f.periodoIni ? L('Período ')+dataCurta(f.periodoIni)+' a '+dataCurta(f.periodoFim) : '', f.dataEmissao ? 'emitida '+dataCurta(f.dataEmissao) : '',
        f.debitoDireto ? L('débito direto') : '', f.qr ? L('valor conferido no código QR') : ''].filter(Boolean).join(' · ');
      if (info) h += '<p class="nota">'+esc(info)+'</p>';
      if (existente) h += '<div class="chips">'
        + '<button class="chip'+(usarExistente ? " on" : "")+L('" data-ex="1">Registar em “')+esc(existente.n)+'”</button>'
        + '<button class="chip'+(usarExistente ? "" : " on")+L('" data-ex="0">Criar conta nova</button></div>');
      if (!usarExistente) h += L('<label class="campo"><span>Nome</span><input id="fNome" value="')+esc(nome)+L('" placeholder="Ex.: Luz, Internet, Seguro do carro"></label>');
      h += '<div class="linha-campos" style="display:flex;gap:10px;margin:0 18px 12px">'
        + L('<label class="campo"><span>Valor</span><input id="fValor" inputmode="decimal" value="')+esc(valor)+'" placeholder="0,00"></label>'
        + '<label class="campo"><span>'+(f.debitoDireto ? L("Data do débito") : L("Data limite"))+'</span><input id="fData" type="date" value="'+data+'"></label></div>';
      if (f.entidade || f.referencia) h += '<div class="mb"><div><small>Multibanco</small>'+(f.entidade ? L('Entidade <b>')+esc(f.entidade)+'</b> · ' : '')+'Ref. <b>'+esc(f.referencia)+'</b></div>'
        + L('<button class="btn mini sec" id="fCopiar">Copiar ref.</button></div>');
      if (!usarExistente){
        h += L('<div class="rotulo">Repete?</div><div class="chips rolar">')+PMS.map(([k,n]) => '<button class="chip'+(pm === k ? " on" : "")+'" data-pm="'+k+'">'+n+(k && !S.premium ? " 🔒" : "")+'</button>').join("")+'</div>';
        if (!S.premium && sugestao) h += L('<p class="nota">Parece repetir ')+esc(PM_TXT[sugestao] || "")+L('. Com o Premium vira uma conta que se repete sozinha.</p>');
        if (pm && f.totalParcelas) h += chave("fPrest", L("Prestação ")+f.parcela+DE+f.totalParcelas, L("Criar as ")+(f.totalParcelas - f.parcela + 1)+L(" que faltam (incluindo esta) e terminar na última"), prestacoes);
        if (pm && !(prestacoes && f.totalParcelas)) h += chave("fVar", "O valor muda de fatura para fatura", L("Luz, água, gás: o valor desta fica como estimativa das próximas"), variavel);
      }
      h += chave("fPaga", L("Já está paga"), data < hoje && !f.debitoDireto ? L("A data já passou: marque se já pagou") : (f.debitoDireto ? L("Débito direto: é paga sozinha na data") : ""), paga);
      if (!usarExistente){
        h += L('<div class="rotulo">Categoria</div><div class="chips rolar" id="fCats"></div><div class="chips rolar sub-cat" id="fSubs"></div>');
        h += chaveNos(sh);
      }
      h += '<button class="btn" id="fSalvar">'+(usarExistente ? L('Registar em ')+esc(existente.n) : pm ? L('Criar conta') : L('Adicionar fatura'))+'</button>'
        + L('<button class="btn sec" id="fCancelar">Cancelar</button>');
      $("#fCorpo", fo).innerHTML = h;
      // mostra a opção escolhida nas filas que deslizam
      $$(".chips.rolar", fo).forEach(fila => { const on = $(".chip.on", fila); if (on) fila.scrollLeft = on.offsetLeft - fila.offsetLeft - 18; });
      const guardar = () => { const n = $("#fNome", fo); if (n) nome = n.value; valor = $("#fValor", fo).value; data = $("#fData", fo).value || data; };
      $$("[data-ex]", fo).forEach(b => b.onclick = () => { guardar(); usarExistente = b.dataset.ex === "1"; montar(); });
      $$("[data-pm]", fo).forEach(b => b.onclick = () => {
        const k = +b.dataset.pm;
        if (k && !S.premium){ folhaPremium(L("Contas que se repetem (mensais, a cada 2, 3 ou 6 meses, anuais e prestações) são um recurso Premium.")); return; }
        guardar(); pm = k; montar();
      });
      if ($("#fCats", fo)) ligarChipsCat(fo, "fCats", "fSubs", () => false, () => cat, v => { cat = v; }, false);
      const tg = (id, f2) => { const e = $("#"+id, fo); if (e) e.onclick = () => { guardar(); f2(); montar(); }; };
      tg("fPrest", () => prestacoes = !prestacoes);
      tg("fVar", () => variavel = !variavel);
      tg("fPaga", () => paga = !paga);
      tg("swNos", () => sh = !sh);
      const fd = $("#fData", fo); if (fd) fd.onchange = () => { guardar(); montar(); };
      const cp = $("#fCopiar", fo); if (cp) cp.onclick = () => { aplicar(ponte.copiar(f.referencia.replace(/\s/g, ""))); aviso(L("Referência copiada")); vibrar(); };
      $("#fCancelar", fo).onclick = () => fecharFolha();
      $("#fSalvar", fo).onclick = () => {
        guardar();
        const pedido = usarExistente ? {contaId: existente.id, valor, data, paga}
          : {nome: nome.trim() || f.emissor, valor, data, pm, vezes: pm && prestacoes && f.totalParcelas ? f.totalParcelas : 0,
             parcela: pm && prestacoes && f.totalParcelas ? f.parcela : 0, variavel: variavel && !(prestacoes && f.totalParcelas), paga, cat, sh};
        const r = aplicar(ponte.adicionarFatura(JSON.stringify(pedido)));
        if (!r.ok){ aviso(r.msg || L("Confira o valor e a data")); return; }
        vibrar();
        if (RAPIDO){ ponte.avisar(r.msg); fecharFolha(); return; }
        fecharFolha(); render(false); aviso(r.msg);
      };
    };
    montar();
  });
}
const cat_ = c => cat(c)[0]+" "+esc(c);

/* ---------- Detalhe: editar, duplicar, apagar ---------- */
function folhaDetalhe(id){
  const g = achar(id); if (!g) return;
  const r = g.t === "r", dono = meu(g);
  const d = new Date(g.q);
  abrirFolha('<div class="detalhe-v'+(r ? " pos" : "")+'">'+(r ? "+" : "")+din(g.v)+'</div>'
    + '<p class="detalhe-d">'+esc(g.d)+'<br>'+cat(g.c)[0]+' '+esc(g.c)+' · '+d.toLocaleDateString(LOC,{day:"numeric",month:"long",year:"numeric"})+', '+d.toLocaleTimeString(LOC,{hour:"2-digit",minute:"2-digit"})
    + (temCasal() ? '<br>'+bolinha(g.dono)+L(' Lançado por ')+esc(nomeDe(g.dono))+(g.sh ? L(' · compartilhado (Nós)') : ' · pessoal') : '')+'</p>'
    + (r ? '' : '<div style="margin:-6px 0 12px">'+equivalencia(g.v).replace('class="eq"','class="eq" style="margin:0 18px"')+'</div>')
    + (g.ca && carteiraDe(g.ca) ? '<p class="detalhe-d">'+esc(carteiraDe(g.ca).e)+' '+esc(carteiraDe(g.ca).n)+'</p>' : '')
    + (r && g.dv && g.dm ? '<p class="detalhe-d">🎯 '+din(g.dv)+' '+destinoTexto(g.dm)+'</p>' : '')
    + (r && g.rv ? '<p class="detalhe-d">🔒 '+din(g.rv)+' reservado</p>' : '')
    + '<p class="nota" style="text-align:center">'+(dono ? L("Segure o cartão para editar, duplicar ou apagar.") : L("Toque duas vezes no cartão para curtir."))+'</p>', () => {});
}
function folhaEditar(id){
  const g = achar(id); if (!g || !meu(g)) return;
  let receita = g.t === "r", escolhida = g.c, sh = !!g.sh, caE = g.ca || "";
  abrirFolha(L('<h3>Editar</h3><div class="seg"><button data-r="0">Saída</button><button data-r="1">Entrada</button></div>')
    + L('<label class="campo"><span>Valor</span><input id="eV" inputmode="decimal" value="')+String(g.v).replace(".", ",")+'"></label>'
    + L('<label class="campo"><span>Descrição</span><input id="eD" value="')+esc(g.d)+'"></label>'
    + L('<label class="campo"><span>Data</span><input id="eDt" type="date" value="')+isoData(g.q)+'"></label>'
    + L('<div class="rotulo">Categoria</div><div id="eC"></div><div id="eCart"></div><div id="nosBox"></div><button class="btn" id="eSalvar">Salvar alterações</button>'), f => {
    let rodaDe = null;
    const montar = () => {
      $$(".seg button", f).forEach(b => b.classList.toggle("on", (b.dataset.r === "1") === receita));
      if (rodaDe !== receita){ rodaDe = receita; roda($("#eC", f), itensCategoria(receita, false), escolhida, v => { escolhida = v; }); }
      $("#nosBox", f).innerHTML = chaveNos(sh);
      const sw = $("#swNos", f); if (sw) sw.onclick = () => { sh = !sh; montar(); };
      const ec = $("#eCart", f); ec.innerHTML = chipsCarteira(caE, "data-cae", receita, true);
      const nc = $("[data-nova-cart]", ec); if (nc) nc.onclick = () => folhaCarteira("", novoId => { if (novoId) aplicar(ponte.mudarCarteira(id, novoId)); folhaEditar(id); });
      $$("[data-cae]", ec).forEach(b => b.onclick = () => { caE = b.dataset.cae; montar(); });
    };
    $$(".seg button", f).forEach(b => b.onclick = () => {
      receita = b.dataset.r === "1";
      const lista = receita ? S.categoriasReceita : S.categorias;
      if (!lista.includes(escolhida)) escolhida = receita ? OUTRAS_REC : K("Outros");
      montar();
    });
    montar();
    $("#eSalvar", f).onclick = () => {
      const [a, m, d] = $("#eDt", f).value.split("-").map(Number);
      const orig = new Date(g.q);
      const nq = a ? new Date(a, m-1, d, orig.getHours(), orig.getMinutes(), orig.getSeconds(), orig.getMilliseconds()).getTime() : g.q;
      if ((g.ca || "") !== caE) aplicar(ponte.mudarCarteira(id, caE));
      if (!aplicar(ponte.editarGasto(id, String(nq), $("#eV", f).value, $("#eD", f).value, escolhida, receita, sh)).ok){ aviso(L("Confira o valor e a descrição")); return; }
      vibrar(); fecharFolha(); render(false); aviso(L("Alterações salvas"));
    };
  });
}
function folhaComentarios(id){
  const lista = () => {
    const g = achar(id);
    return g && g.cm.length
      ? g.cm.map(c => '<div class="com"><span class="ini">'+esc((c.a||"?").charAt(0).toUpperCase())+'</span><div><p><b>'+esc(c.a)+'</b> '+esc(c.t)+'</p><small>'+haQuanto(c.q)+'</small></div></div>').join("")
      : '<p class="nota" style="margin:0 0 12px">'+(g && g.sh && temCasal() ? L("Comente com ")+esc(S.parceiro.nome)+L(": foi planejado? Valeu a pena?") : L("Anote o contexto: foi planejado? Valeu a pena?"))+'</p>';
  };
  const g = achar(id);
  abrirFolha('<h3>'+din(g.v)+' · '+esc(g.d)+'</h3><div class="coms" id="coms">'+lista()+'</div>'
    + L('<div class="enviar"><input id="txtCom" placeholder="Escreva um comentário" enterkeyhint="send"><button id="envCom">Enviar</button></div>'), f => {
    const inp = $("#txtCom", f);
    const enviar = () => {
      if (!inp.value.trim()) return;
      aplicar(ponte.comentar(id, inp.value)); inp.value = "";
      const gc = achar(id); if (gc) marcarVisto(id+":"+gc.cm.length);
      $("#coms", f).innerHTML = lista(); vibrar(); verificarConquistas();
    };
    $("#envCom", f).onclick = enviar;
    inp.onkeydown = e => { if (e.key === "Enter") enviar(); };
  });
}
function folhaCategoria(id){
  const g = achar(id);
  let escolhida = g.c;
  abrirFolha(L('<h3>Categoria</h3><div id="rCat"></div><button class="btn" id="rOk">Confirmar</button>'), f => {
    roda($("#rCat", f), itensCategoria(g.t === "r", false), g.c, v => { escolhida = v; });
    $("#rOk", f).onclick = () => { if (escolhida !== g.c) aplicar(ponte.mudarCategoria(id, escolhida)); vibrar(); fecharFolha(); render(false); };
  });
}

/* ---------- Contas e entradas fixas ---------- */
function textoPaga(c){
  if (!c.paga) return prazo(c.diasAte);
  const verbo = c.e ? L("recebida") : L("paga");
  return temCasal() && c.pagaPor ? verbo + " por " + nomeDe(c.pagaPor) : verbo;
}
function folhaConta(id){
  const c = S.contas.find(x => x.id === id); if (!c) return;
  const ocs = c.ocs || [];
  const verbo = c.e ? [L("Marcar como recebida"), L("Desmarcar recebimento")] : [L("Marcar como paga"), L("Desmarcar pagamento")];
  let corpo = "";
  if (ocs.length > 1){
    corpo = L('<div class="rotulo">Neste mês</div><div class="contas-lista">') + ocs.map(o =>
      '<div class="item'+(o.paga ? L(" paga") : "")+'"><button class="check" data-oc="'+o.chave+L('" aria-label="Alternar">')+ICON.ok+'</button>'
      + L('<div class="info"><b>Dia ')+o.dia+(c.vezes ? ' · '+o.n+DE+c.vezes : '')+'</b><small>'+(o.paga ? (c.e ? L("recebida") : L("paga"))+(temCasal() && o.pagaPor ? " por "+esc(nomeDe(o.pagaPor)) : "") : prazo(o.dia - S.hoje))+'</small></div></div>').join("") + '</div>';
  } else if (ocs.length === 1){
    const o = ocs[0];
    const bloqueada = o.paga && o.pagaPor && o.pagaPor !== S.eu.id;
    corpo = (!o.paga && c.var ? L('<label class="campo"><span>Valor real deste mês</span><input id="valReal" inputmode="decimal" value="')+String(c.v).replace(".", ",")+'"></label>' : '')
      + (bloqueada ? L('<p class="nota">Só ')+esc(nomeDe(o.pagaPor))+L(' pode desmarcar.</p>') : '<button class="btn" id="sim" data-chave="'+o.chave+'">'+verbo[o.paga ? 1 : 0]+'</button>');
  }
  abrirFolha('<h3>'+esc(c.n)+(c.sh ? L('<span class="nos-tag">Nós</span>') : '')+'</h3><div class="detalhe-v'+(c.e ? " pos" : "")+'">'+(c.var ? "≈ " : "")+(c.e ? "+" : "")+din(c.v)+'</div>'
    + '<p class="detalhe-d">'+(c.e ? L("Entrada") : L("Conta"))+': '+esc(descConta(c))+'.'+(ocs.length ? '' : L('<br>Não acontece neste mês.'))+'</p>'
    + corpo + (meu(c) ? L('<div class="linha-botoes" style="margin:12px 0 0"><button class="btn sec" id="editarConta">Editar</button><button class="btn sec" id="excluirConta" style="color:var(--late)">Excluir</button></div>') : ''), f => {
    const ed = $("#editarConta", f); if (ed) ed.onclick = () => folhaEditarConta(id);
    const pagar = (chave, valor) => {
      const r = aplicar(ponte.alternarPaga(c.id, valor || "", chave));
      if (!r.ok){ aviso(r.msg); return false; }
      vibrar(); verificarConquistas(); return true;
    };
    const b = $("#sim", f);
    if (b) b.onclick = () => { const vr = $("#valReal", f); const era = ocs[0].paga; if (pagar(b.dataset.chave, vr ? vr.value : "")){ fecharFolha(); render(false); if (!era) confete(18); } };
    $$("[data-oc]", f).forEach(bt => bt.onclick = () => { if (pagar(bt.dataset.oc, "")){ render(false); folhaConta(id); } });
    const ex = $("#excluirConta", f);
    if (ex) ex.onclick = () => confirmar(L("Excluir “")+esc(c.n)+"”?", L("As próximas deixam de aparecer. O que já foi pago continua no extrato."), L("Excluir"), () => { aplicar(ponte.apagar(c.id)); render(false); });
  });
}

/* ---------- Editar a conta inteira: nome, valor, categoria e como se paga ---------- */
const TIPOS_CONTA = [["u",1,L("Data única")],["m",1,L("Todo mês")],["m",2,L("2 em 2 meses")],["m",3,L("3 em 3 meses")],["m",6,L("6 em 6 meses")],["m",12,L("Todo ano")],["q",1,L("A cada 15 dias")],["s",1,L("Toda semana")]];
function folhaEditarConta(id){
  const c = S.contas.find(x => x.id === id); if (!c) return;
  if (!meu(c)){ aviso(L("Só quem criou a conta pode editar")); return; }
  const receita = !!c.e;
  const tipoDe = x => x.vezes === 1 ? "u" : (x.freq === "q" || x.freq === "s") ? x.freq : "m";
  const tipo0 = tipoDe(c), pm0 = tipo0 === "m" ? Math.max(1, c.pm || 1) : 1;
  const ini0 = (() => {
    if ((c.freq === "q" || c.freq === "s") && c.d0) return c.d0;
    const [a, m] = (c.ini || mesStr(MES_ATUAL.ano, MES_ATUAL.mes)).split("-").map(Number);
    return a+"-"+String(m).padStart(2,"0")+"-"+String(Math.min(c.dia || 1, new Date(a, m, 0).getDate())).padStart(2,"0");
  })();
  let tipo = tipo0, pm = pm0, data = ini0, comFim = c.vezes > 1, vezes = c.vezes > 1 ? c.vezes : 3, variavel = !!c.var;
  let nome = c.n, valor = String(c.v).replace(".", ",");
  let escolhida = c.c || (receita ? (/sal[aá]rio|ordenado|vencimento/i.test(c.n) ? K("Receitas › Salário") : OUTRAS_REC) : K("Casa"));
  const mudouForma = () => tipo !== tipo0 || pm !== pm0;
  // próxima vez que ainda não foi paga (a partir de hoje): é daí que a nova forma recomeça
  const proxima = () => {
    const hj = new Date(); hj.setHours(0,0,0,0);
    const pagas = new Set((c.ocs || []).filter(o => o.paga).map(o => o.chave));
    for (let k = 0; k < 36; k++){
      const a = MES_ATUAL.ano + Math.floor((MES_ATUAL.mes + k) / 12), m = (MES_ATUAL.mes + k) % 12;
      const o = ocorrencias(c, a, m).find(o => !pagas.has(o.chave) && o.d >= hj);
      if (o) return o;
    }
    return null;
  };
  const trocarForma = (t, p) => {
    const antes = mudouForma();
    tipo = t; pm = p;
    if (!mudouForma()){ data = ini0; vezes = c.vezes > 1 ? c.vezes : vezes; comFim = c.vezes > 1; return; }
    if (!antes){
      const o = proxima();
      data = o ? isoData(o.d.getTime()) : isoData(Date.now());
      if (c.vezes > 1 && o) vezes = Math.max(1, c.vezes - o.n + 1);
    }
  };
  abrirFolha(L('<h3>Editar ')+(receita ? "entrada" : "conta")+'</h3>'
    + L('<label class="campo"><span>Nome</span><input id="ecN" value="')+esc(nome)+'"></label>'
    + L('<label class="campo"><span>Valor')+(c.var ? " (estimativa)" : "")+'</span><input id="ecV" inputmode="decimal" value="'+esc(valor)+'"></label>'
    + L('<div class="rotulo">Categoria</div><div class="chips rolar" id="ecCat"></div><div class="chips rolar sub-cat" id="ecSub"></div>')
    + L('<div class="rotulo">Como se paga</div><div class="chips" id="ecTipo"></div><div id="ecBox"></div>')
    + L('<button class="btn" id="ecSalvar">Salvar</button>'), f => {
    $("#ecN", f).oninput = e => { nome = e.target.value; };
    $("#ecV", f).oninput = e => { valor = e.target.value; nota(); };
    ligarChipsCat(f, "ecCat", "ecSub", () => receita, () => escolhida, v => { escolhida = v; }, false);
    const nota = () => {
      const n = $("#ecNota", f); if (!n) return;
      const [a, m, d] = data.split("-").map(Number);
      const quando = dtxt(d,m-1,a !== MES_ATUAL.ano ? a : 0);
      const v = parseFloat(String(valor).replace(/\./g, "").replace(",", ".")) || 0;
      let t = tipo === "u" ? L("Acontece uma vez, em ")+quando+"."
        : (comFim ? vezes+L(" vezes a partir de ")+quando+(v ? " · "+din(v*vezes)+L(" no total") : "")+"." : L("Repete a partir de ")+quando+L(" até você excluir."));
      if (mudouForma()) t += L(" O que já foi ")+(receita ? L("recebido") : L("pago"))+" continua no extrato.";
      n.textContent = t;
    };
    const montar = () => {
      $("#ecTipo", f).innerHTML = TIPOS_CONTA.map(([t, p, n]) => '<button class="chip'+(tipo === t && (t !== "m" || pm === p) ? " on" : "")+'" data-t="'+t+'" data-p="'+p+'">'+n+(t !== "u" && !S.premium ? " 🔒" : "")+'</button>').join("");
      $$("#ecTipo .chip", f).forEach(bt => bt.onclick = () => {
        if (bt.dataset.t !== "u" && !S.premium){ folhaPremium(L("Repetir contas (mensal, a cada 15 dias, semanal e parceladas) é um recurso Premium.")); return; }
        trocarForma(bt.dataset.t, +bt.dataset.p); vibrar(); montar();
      });
      let h = '<label class="campo"><span>'+(tipo === "u" ? L("Data") : mudouForma() ? L("Recomeça em") : L("Primeira vez"))+'</span><input id="ecData" type="date" value="'+data+'"></label>';
      if (tipo !== "u"){
        h += '<div class="chips"><button class="chip'+(comFim ? "" : " on")+L('" data-fim="0">Sem fim</button><button class="chip')+(comFim ? " on" : "")+L('" data-fim="1">Número de vezes (parcelas)</button></div>');
        h += comFim ? L('<label class="campo"><span>Quantas vezes')+(mudouForma() ? " a partir dessa data" : "")+'</span><input id="ecVezes" inputmode="numeric" value="'+vezes+'"></label>'
                    : chave("ecVar", "O valor muda a cada vez", L("Ex.: luz, água. O valor escrito vira a estimativa"), variavel);
      }
      h += '<p class="nota" id="ecNota"></p>';
      $("#ecBox", f).innerHTML = h;
      $("#ecData", f).onchange = e => { data = e.target.value || data; nota(); };
      $$("[data-fim]", f).forEach(bt => bt.onclick = () => { comFim = bt.dataset.fim === "1"; montar(); });
      const ve = $("#ecVezes", f); if (ve) ve.oninput = () => { vezes = Math.min(600, Math.max(2, parseInt(ve.value) || 2)); nota(); };
      const va = $("#ecVar", f); if (va) va.onclick = () => { variavel = !variavel; va.classList.toggle("on", variavel); };
      nota();
    };
    montar();
    $("#ecSalvar", f).onclick = () => {
      const unica = tipo === "u";
      const r = aplicar(ponte.redefinirConta(c.id, nome, valor, escolhida, data, unica ? "m" : tipo, unica ? 1 : pm,
        unica ? 1 : (comFim ? vezes : 0), !unica && !comFim && variavel));
      if (!r.ok){ aviso(r.msg || L("Confira o nome e o valor")); return; }
      vibrar(); fecharFolha(); render(false); aviso((receita ? L("Entrada") : L("Conta"))+" atualizada");
    };
  });
}

/* ---------- Premium ---------- */
function alternarPremium(ativo){
  aplicar(ponte.definirPremium(ativo));
  if (!ativo) modo = "total";
  preparar(); vibrar(); render(false);
  aviso(ativo ? L("Premium ativado") : L("Premium desativado. Seus dados continuam guardados."));
}
function folhaPremium(motivo){
  abrirFolha('<h3>Premium</h3>'+(motivo ? '<p class="nota">'+esc(motivo)+'</p>' : '')
    + '<div class="contas-lista">'
    + L('<div class="item"><span style="font-size:1.5rem">🔁</span><div class="info"><b>Contas que se repetem</b><small>Todo mês, a cada 15 dias ou toda semana, com ou sem fim (parceladas)</small></div></div>')
    + L('<div class="item"><span style="font-size:1.5rem">💞</span><div class="info"><b>Visão de casal</b><small>Eu, Nós e Total, partilhar lançamentos e acerto de contas</small></div></div>')
    + L('</div><p class="nota" style="margin-top:12px">Por enquanto é grátis: basta ativar. Se desativar, nada é apagado; tudo volta quando ativar de novo.</p>')
    + L('<button class="btn" id="ativarPremium">Ativar Premium</button>'), f => {
    const at = $("#ativarPremium", f);
    if (PRO().servidor){
      at.textContent = PRO().pendente ? L("Pedido já enviado") : L("Pedir Premium");
      at.disabled = !!PRO().pendente;
      $$(".nota", f).forEach(n => { if (/grátis/.test(n.textContent)) n.textContent = L("O Premium é por assinatura: envie o pedido e ele liga sozinho quando for aprovado. Se terminar, nada é apagado."); });
      at.insertAdjacentHTML("afterend", L('<button class="btn sec" id="fpCodigo">Tenho um código</button>'));
      at.onclick = () => folhaPedirPro();
      $("#fpCodigo", f).onclick = folhaCodigo;
    } else at.onclick = () => { fecharFolha(); alternarPremium(true); };
  });
}

/* ---------- Premium por pedido (servidor) ---------- */
function chamarPro(pedido, funcao, args, botao, cb){
  pedir(pedido, () => ponte.pro(pedido, funcao, JSON.stringify(args || {})), botao, r => {
    let dados = null; try { dados = r.dados ? JSON.parse(r.dados) : null; } catch(e){}
    cb(r, dados);
  });
}
function folhaPedirPro(){
  let dias = 30;
  abrirFolha(L('<h3>Pedir Premium</h3><p class="nota">Escolha por quanto tempo e, se quiser, deixe uma mensagem (por exemplo, como vai pagar).</p>')
    + '<div class="chips" id="ppDias"></div>'
    + '<label class="campo"><textarea id="ppMsg" rows="3" maxlength="500" placeholder="Mensagem (opcional)"></textarea></label>'
    + L('<button class="btn" id="ppEnviar">Enviar pedido</button>'), f => {
    const chips = () => { $("#ppDias", f).innerHTML = [[30,L("1 mês")],[90,L("3 meses")],[365,L("1 ano")]].map(([d,n]) => '<button class="chip'+(d === dias ? " on" : "")+'" data-d="'+d+'">'+n+'</button>').join("");
      $$("[data-d]", f).forEach(b => b.onclick = () => { dias = +b.dataset.d; chips(); }); };
    chips();
    $("#ppEnviar", f).onclick = () => chamarPro("pedirPro", "pedir_pro", {p_mensagem: $("#ppMsg", f).value.trim() || null, p_dias: dias}, $("#ppEnviar", f), r => {
      if (!r.ok){ aviso(r.msg); return; }
      vibrar(); fecharFolha(); render(false); aviso(L("Pedido enviado"));
    });
  });
}
function folhaCodigo(){
  abrirFolha(L('<h3>Código de ativação</h3><label class="campo"><span>Código</span><input id="cdCod" placeholder="A1B2-C3D4-E5F6" autocapitalize="characters" autocomplete="off"></label>')
    + L('<button class="btn" id="cdOk">Ativar</button>'), f => {
    $("#cdOk", f).onclick = () => chamarPro("resgatar", "resgatar_codigo", {p_codigo: $("#cdCod", f).value}, $("#cdOk", f), (r, exp) => {
      if (!r.ok){ aviso(r.msg); return; }
      vibrar(); confete(24); fecharFolha(); render(false); aviso(L("Premium ativo até ")+dataLonga(Date.parse(exp)));
    });
  });
}

/* ---------- Painel admin (só aparece e só funciona para o admin: o servidor confere) ---------- */
let adm = {aba:"pedidos"};
const ADM_ABAS = [["pedidos",L("Pedidos")],["usuarios",L("Usuários")],["codigos",L("Códigos")],["config",L("Config")]];
function pagAdmin(){
  let h = '<div class="modos">'+ADM_ABAS.map(([k,n]) => '<button class="'+(adm.aba === k ? "on" : "")+'" data-adm="'+k+'">'+n+'</button>').join("")+'</div>';
  const dados = adm[adm.aba];
  if (adm.aba === "codigos") return h + L('<p class="nota">Gere um código para mandar por WhatsApp. A pessoa ativa em Perfil → Plano → Tenho um código. Cada código vale uma vez e expira em 30 dias se não for usado.</p>')
    + '<div class="chips">'+[[30,L("1 mês")],[90,L("3 meses")],[365,L("1 ano")]].map(([d,n]) => '<button class="chip" data-gerar="'+d+L('">Gerar · ')+n+'</button>').join("")+'</div>';
  if (dados === undefined) return h + '<div class="lendo"></div>';
  if (dados && dados.erro) return h + '<div class="estado-nuvem"><span class="erro">'+esc(dados.erro)+L('</span></div><button class="btn sec" id="admRecarregar">Tentar de novo</button>');
  const lista = dados || [];
  if (adm.aba === "pedidos"){
    if (!lista.length) h += L('<p class="nota">Nenhum pedido pendente.</p>');
    h += '<div class="contas-lista adm-lista">'+lista.map(p => '<div class="item"><div class="info"><b>'+esc(p.nome || p.email || L("Sem nome"))+'</b>'
      + '<small>'+esc(p.email || "")+' · pediu '+(p.dias_pedidos || "?")+L(' dias · ')+haQuanto(Date.parse(p.criado_em))+'</small>'
      + (p.mensagem ? '<small>“'+esc(p.mensagem)+'”</small>' : '')
      + (p.pro_expira_em && Date.parse(p.pro_expira_em) > Date.now() ? L('<small class="pos">Premium até ')+dataLonga(Date.parse(p.pro_expira_em))+'</small>' : '')
      + '<div class="adm-botoes">'+[30,90,365].map(d => '<button class="'+(d === p.dias_pedidos ? "ok" : "")+'" data-aprovar="'+p.pedido_id+L('" data-dias="')+d+'">+'+d+L(' dias</button>')).join("")
      + '<button class="del" data-recusar="'+p.pedido_id+L('">Recusar</button></div></div></div>')).join("")+'</div>';
  } else if (adm.aba === "usuarios"){
    h += '<p class="nota">'+lista.length+' conta'+(lista.length === 1 ? "" : "s")+' · '+lista.filter(u => u.pro_ativo).length+L(' com Premium</p>');
    h += '<div class="contas-lista adm-lista">'+lista.map(u => '<div class="item"><div class="info"><b>'+esc(u.nome || u.email || L("Sem nome"))+'</b>'
      + '<small>'+esc(u.email || "")+'</small>'
      + '<small class="'+(u.pro_ativo ? "pos" : "")+'">'+(u.pro_ativo ? L("Premium até ")+dataLonga(Date.parse(u.pro_expira_em)) : L("Base"))+'</small>'
      + '<div class="adm-botoes"><button data-conceder="'+u.user_id+L('" data-dias="30">+30 dias</button><button data-conceder="')+u.user_id+L('" data-dias="365">+1 ano</button>')
      + (u.pro_ativo ? '<button class="del" data-revogar="'+u.user_id+L('">Encerrar</button>') : '')+'</div></div></div>').join("")+'</div>';
  } else if (adm.aba === "config"){
    h += L('<p class="nota">Todos os apps leem estas configurações; só você pode alterar. Toque para editar.</p>');
    h += '<div class="contas-lista adm-lista">'+lista.map(c => '<div class="item" data-cfg="'+esc(c.chave)+'"><div class="info"><b>'+esc(c.chave)+'</b>'
      + (c.descricao ? '<small>'+esc(c.descricao)+'</small>' : '')+'<div class="cfg-json">'+esc(JSON.stringify(c.valor))+'</div></div></div>').join("")+'</div>';
  }
  return h + L('<button class="btn sec" id="admRecarregar">Atualizar</button>');
}
function carregarAdm(){
  const aba = adm.aba;
  if (aba === "codigos" || adm[aba] !== undefined || adm.carregando) return;
  adm.carregando = true;
  const fim = (r, dados) => { adm.carregando = false; adm[aba] = r.ok ? (Array.isArray(dados) ? dados : []) : {erro: r.msg || L("Não foi possível carregar")}; if (folhaAberta || aba !== adm.aba) return; render(false); };
  if (aba === "config") pedir("admCfg", () => ponte.lerConfig("admCfg"), null, r => { let d = null; try { d = JSON.parse(r.dados); } catch(e){} fim(r, d); });
  else chamarPro("adm_"+aba, aba === "pedidos" ? "admin_listar_pedidos" : "admin_listar_usuarios", aba === "pedidos" ? {p_status:"pendente"} : {}, null, fim);
}
function ligarAdmin(){
  if (perfilPag !== "admin") return;
  $$("[data-adm]").forEach(b => b.onclick = () => { adm.aba = b.dataset.adm; render(false); });
  const rc = $("#admRecarregar"); if (rc) rc.onclick = () => { delete adm[adm.aba]; render(false); };
  const refazer = (...abas) => { abas.forEach(a => delete adm[a]); render(false); };
  $$("[data-aprovar]").forEach(b => b.onclick = () => chamarPro("admAprovar", "aprovar_pedido", {p_pedido_id: +b.dataset.aprovar, p_dias: +b.dataset.dias}, b, r => {
    if (!r.ok){ aviso(r.msg); return; } vibrar(); aviso(L("Aprovado: +")+b.dataset.dias+L(" dias")); refazer("pedidos", "usuarios");
  }));
  $$("[data-recusar]").forEach(b => b.onclick = () => confirmar(L("Recusar pedido?"), L("A pessoa continua no plano Base."), L("Recusar"), () =>
    chamarPro("admRecusar", "recusar_pedido", {p_pedido_id: +b.dataset.recusar, p_resposta: null}, null, r => { aviso(r.ok ? L("Pedido recusado") : r.msg); refazer("pedidos"); })));
  $$("[data-conceder]").forEach(b => b.onclick = () => chamarPro("admConceder", "admin_conceder_dias", {p_user: b.dataset.conceder, p_dias: +b.dataset.dias}, b, r => {
    if (!r.ok){ aviso(r.msg); return; } vibrar(); aviso("+"+b.dataset.dias+L(" dias concedidos")); refazer("usuarios");
  }));
  $$("[data-revogar]").forEach(b => b.onclick = () => confirmar(L("Encerrar o Premium?"), L("Termina agora. Os dados da pessoa não são apagados."), L("Encerrar"), () =>
    chamarPro("admRevogar", "admin_revogar_pro", {p_user: b.dataset.revogar}, null, r => { aviso(r.ok ? L("Premium encerrado") : r.msg); refazer("usuarios"); })));
  $$("[data-gerar]").forEach(b => b.onclick = () => {
    const obs = "";
    chamarPro("admGerar", "admin_gerar_codigo", {p_dias: +b.dataset.gerar, p_observacao: obs || null}, b, (r, cod) => {
      if (!r.ok || !cod){ aviso(r.msg || L("Não foi possível gerar")); return; }
      vibrar();
      abrirFolha(L('<h3>Código de ')+b.dataset.gerar+L(' dias</h3><div class="codigo-grande">')+esc(cod)+'</div>'
        + L('<p class="nota">Anote ou envie agora: por segurança, este código não aparece de novo.</p>')
        + L('<div class="linha-botoes"><button class="btn" id="cgCopiar">Copiar</button></div>'), f => {
        $("#cgCopiar", f).onclick = () => { aviso(aplicar(ponte.copiar(L("Código do Finanças Premium: ")+cod)).msg); };
      });
    });
  });
  $$("[data-cfg]").forEach(el => el.onclick = () => {
    const c = (adm.config || []).find(x => x.chave === el.dataset.cfg); if (!c) return;
    abrirFolha('<h3>'+esc(c.chave)+'</h3>'+(c.descricao ? '<p class="nota">'+esc(c.descricao)+'</p>' : '')
      + '<textarea class="campo-grande" id="cfgV" rows="8" spellcheck="false" style="font-family:monospace">'+esc(JSON.stringify(c.valor, null, 2))+'</textarea>'
      + L('<button class="btn" id="cfgOk">Salvar</button>'), f => {
      $("#cfgOk", f).onclick = () => {
        let v; try { v = JSON.parse($("#cfgV", f).value); } catch(e){ aviso(L("Formato inválido: confira vírgulas e aspas")); return; }
        pedir("admCfgSalvar", () => ponte.salvarConfig("admCfgSalvar", c.chave, JSON.stringify(v)), $("#cfgOk", f), r => {
          aviso(r.msg); if (r.ok){ c.valor = v; fecharFolha(); render(false); }
        });
      };
    });
  });
  carregarAdm();
}

/* ---------- Referências (e o que evitar) ---------- */
function folhaReferencia(id, evitarInicial){
  const r = id != null ? S.refs.find(x => x.id === id) : null;
  const emojis = ["☕","🚬","🍺","🥤","🍫","🍔","🛵","🎰","⏱","⛽","🧺","📚","🎬","💊"];
  let e = r ? r.e : (evitarInicial ? "🚬" : "☕"), dest = r ? r.dest : !evitarInicial, ev = r ? r.evitar : !!evitarInicial, meta = r ? r.m : "";
  abrirFolha('<h3>'+(r ? L("Editar referência") : evitarInicial ? L("Algo a evitar") : L("Nova referência"))+'</h3>'
    + '<div class="chips" id="rE"></div>'
    + L('<label class="campo"><span>Nome</span><input id="rN" value="')+(r ? esc(r.n) : "")+'" placeholder="'+(evitarInicial ? L("Maço de cigarro") : L("Café da manhã (pão, fruta, sumo)"))+'"></label>'
    + L('<label class="campo"><span>Quanto custa</span><input id="rV" inputmode="decimal" value="')+(r ? String(r.v).replace(".", ",") : "")+'" placeholder="'+(evitarInicial ? "6" : "3,50")+'"></label>'
    + '<div id="rChaves"></div><div id="rDest"></div>'
    + L('<button class="btn" id="rSalvar">Salvar</button>') + (r ? L('<button class="btn sec" id="rDel" style="color:var(--late)">Excluir referência</button>') : ''), f => {
    const montar = () => {
      $("#rE", f).innerHTML = emojis.map(x => '<button class="chip'+(x === e ? " on" : "")+'" data-e="'+x+'" style="font-size:1.25rem">'+x+'</button>').join("");
      $$("#rE .chip", f).forEach(b => b.onclick = () => { e = b.dataset.e; montar(); });
      $("#rChaves", f).innerHTML = chave("cDest", L("Mostrar nos cartões"), L("Traduz valores nesta referência (até 2)"), dest) + chave("cEv", L("Quero evitar isto"), L("Ganha o botão “Evitei” no app, na notificação e no popup"), ev);
      $("#cDest", f).onclick = () => { dest = !dest; montar(); };
      $("#cEv", f).onclick = () => { ev = !ev; montar(); };
      $("#rDest", f).innerHTML = ev ? L('<div class="rotulo">Para onde vai o valor evitado</div><div class="chips">')
        + '<button class="chip'+(!meta ? " on" : "")+L('" data-m="">Só contar</button>')
        + S.metasVis.map(m => '<button class="chip'+(meta === m.id ? " on" : "")+'" data-m="'+m.id+'">'+esc(m.e)+' '+esc(m.n)+'</button>').join("")
        + '</div>' + (S.metasVis.length ? '' : L('<p class="nota">Crie um destino (curso, imprevisto…) na aba Trocas para mandar o dinheiro para lá.</p>')) : '';
      $$("#rDest .chip", f).forEach(b => b.onclick = () => { meta = b.dataset.m; montar(); });
    };
    montar();
    $("#rSalvar", f).onclick = () => {
      if (!aplicar(ponte.salvarReferencia(r ? r.id : "", $("#rN", f).value, e, $("#rV", f).value, dest, ev, meta)).ok){ aviso(L("Dê um nome e um valor")); return; }
      vibrar(); fecharFolha(); render(false); verificarConquistas();
    };
    const del = $("#rDel", f); if (del) del.onclick = () => { aplicar(ponte.apagar(r.id)); fecharFolha(); render(false); };
  });
}

/* ---------- Destinos ---------- */
function folhaNovaMeta(){
  let tipo = "j", e = "🎓", sh = modo === "nos";
  const emojis = {j:["🎓","📚","🏖️","✈️","💻","🛟","🏠","🎯"], a:["🔧","🚗","🦷","🏥","💳","📱","🧾","🎯"]};
  abrirFolha(L('<h3>Novo destino</h3><div class="seg"><button data-t="j">Juntar</button><button data-t="a">Amortizar</button></div>')
    + '<p class="nota" id="mExp"></p><div class="chips" id="mE"></div>'
    + L('<label class="campo"><span>Nome</span><input id="mN"></label>')
    + '<label class="campo"><span id="mRot"></span><input id="mA" inputmode="decimal"></label>'
    + L('<div id="nosBox"></div><button class="btn" id="salvarMeta">Criar destino</button>'), f => {
    const montar = () => {
      $$(".seg button", f).forEach(b => b.classList.toggle("on", b.dataset.t === tipo));
      $("#mExp", f).textContent = tipo === "j" ? L("Juntar: o valor sobe até a meta. Ex.: curso de inglês, viagem, reserva.") : L("Amortizar: um imprevisto ou dívida que você vai pagando aos poucos. Ex.: conserto do carro, dentista.");
      $("#mRot", f).textContent = tipo === "j" ? L("Quanto quer juntar") : L("Valor total do imprevisto");
      $("#mN", f).placeholder = tipo === "j" ? L("Curso de inglês") : L("Conserto do carro");
      $("#mA", f).placeholder = tipo === "j" ? "600" : "450";
      if (!emojis[tipo].includes(e)) e = emojis[tipo][0];
      $("#mE", f).innerHTML = emojis[tipo].map(x => '<button class="chip'+(x === e ? " on" : "")+'" data-e="'+x+'" style="font-size:1.25rem">'+x+'</button>').join("");
      $$("#mE .chip", f).forEach(b => b.onclick = () => { e = b.dataset.e; montar(); });
      $("#nosBox", f).innerHTML = chaveNos(sh);
      const sw = $("#swNos", f); if (sw) sw.onclick = () => { sh = !sh; montar(); };
    };
    $$(".seg button", f).forEach(b => b.onclick = () => { tipo = b.dataset.t; montar(); });
    montar();
    $("#salvarMeta", f).onclick = () => {
      if (!aplicar(ponte.adicionarMeta($("#mN", f).value, $("#mA", f).value, e, tipo, sh)).ok){ aviso(L("Dê um nome e um valor")); return; }
      vibrar(); fecharFolha(); render(true); verificarConquistas();
    };
  });
}
function folhaGuardar(id){
  const m = S.metas.find(x => x.id === id);
  const amort = m.tipo === "a";
  abrirFolha('<h3>'+esc(m.e)+' '+esc(m.n)+'</h3><p class="nota">'+(amort ? L("Pago") : L("Guardado"))+L(' até agora: ')+din(m.atual)+DE+din(m.alvo)+L('. Use um valor negativo para corrigir.')
    + (m.sh && temCasal() ? L(' Destino do casal: ')+esc(S.parceiro.nome)+L(' vê este valor.') : '')+'</p>'
    + '<input class="entrada-grande" id="gV" inputmode="decimal" placeholder="50">'
    + '<div class="chips">'+[10,25,50,100].map(v => '<button class="chip" data-v="'+v+'">+ '+din(v)+'</button>').join("")+'</div>'
    + '<button class="btn" id="salvarAporte">'+(amort ? L("Registrar pagamento") : L("Guardar"))+'</button>', f => {
    const inp = $("#gV", f);
    $$("[data-v]", f).forEach(b => b.onclick = () => { inp.value = b.dataset.v; });
    $("#salvarAporte", f).onclick = () => {
      const antes = m.atual >= m.alvo;
      if (!aplicar(ponte.aportarMeta(id, inp.value)).ok){ aviso(L("Digite um valor")); return; }
      const depois = S.metas.find(x => x.id === id);
      vibrar(); fecharFolha(); render(true);
      if (!antes && depois && depois.atual >= depois.alvo) confete();
      verificarConquistas();
    };
  });
}

/* ================= Início ================= */
$$("nav [data-aba]").forEach(b => b.onclick = () => ir(b.dataset.aba));
$("#fab").onclick = () => { vibrar(); folhaNovo(false); };
$("#miniAv").onclick = () => ir("perfil");
/** Abre o lançamento vindo de fora (atalho, toque traseiro, financas://novo). */
window.abrirNovo = function(){
  if (RAPIDO || !S || !S.nuvem.logado) return false;
  if (folhaAberta) fecharFolha(true);
  folhaNovo(false);
  return true;
};

try { if (typeof ponte.definirIdioma === "function") ponte.definirIdioma(LANG); } catch(e){}
carregar();
extr.ano = MES_ATUAL.ano; extr.mes = MES_ATUAL.mes;
if (RAPIDO){
  document.body.classList.add("rapido");
  if (FATURA) folhaLendo(); else folhaNovo(false);
} else {
  render(true);
  setTimeout(verificarConquistas, 900);
}
</script>
