<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Finanças</title>
<style>
:root{
  --ink:#15131F; --surface:#201D2C; --surface2:#2A2639; --line:#353047;
  --text:#F3EEF8; --muted:#A59FB8; --mango:#FFB547; --heart:#FF5E7E; --violet:#9B8CFF; --ok:#4CD6A0; --late:#FF6B5B;
  --serif:"Noto Serif","Roboto Serif",Georgia,serif;
  --sans:Roboto,"Google Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.4;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
main{padding:0 0 110px}
.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;background:linear-gradient(var(--ink) 75%,transparent)}
.topo h1{margin:0;font-family:var(--serif);font-size:1.55rem;font-weight:700;letter-spacing:-.01em}
.mini-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface2);border:2px solid var(--mango)}
.pos{color:var(--ok)} .neg{color:var(--late)}

/* ---------- Herói do mês ---------- */
.heroi{margin:4px 18px 16px;padding:20px 20px 18px;border-radius:26px;background:var(--surface);position:relative;overflow:hidden}
.heroi::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,181,71,.2),transparent 70%);pointer-events:none}
.heroi .mes{color:var(--muted);font-size:.95rem}
.duas{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 4px}
.duas > div:last-child{text-align:right}
.duas small{display:block;color:var(--muted);font-size:.82rem}
.big{font-family:var(--serif);font-size:2.35rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.med{font-family:var(--serif);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.trilho{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:14px 0 8px}
.trilho i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--mango),#FF8A5B);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.fluxo{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface2);margin:14px 0 6px}
.fluxo i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1);width:0}
.fluxo .e{background:var(--ok)} .fluxo .s{background:var(--late);opacity:.85}
.legenda{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.linha-info{margin-top:10px;font-size:.9rem;color:var(--muted)}
.linha-info b{color:var(--text);font-weight:600}

.eq{display:flex;flex-direction:column;gap:1px;margin-top:8px;font-size:.88rem;color:var(--muted)}
.dica-btn{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--surface2);font-size:.9rem;text-align:left;width:100%}

/* ---------- Stories de contas ---------- */
.stories{display:flex;gap:14px;overflow-x:auto;padding:2px 18px 16px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;width:70px;text-align:center}
.story .anel{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;padding:3px;background:var(--violet)}
.story.perto .anel{background:conic-gradient(var(--mango),#FF8A5B,var(--mango))}
.story.atrasada .anel{background:var(--late)}
.story.entrada .anel{background:var(--ok)}
.story.paga .anel{background:var(--line)}
.story .bola{width:100%;height:100%;border-radius:50%;background:var(--surface);border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:1.3rem}
.story.paga .bola{opacity:.5}
.story small{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story b{display:block;font-size:.78rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.insight{margin:0 18px 16px;padding:14px 16px;border-radius:18px;border:1px dashed var(--line);color:var(--muted);font-size:.93rem}
.insight strong{color:var(--text);font-weight:600}
.dia{margin:22px 18px 10px;font-size:.85rem;color:var(--muted);font-weight:500}

/* ---------- Posts ---------- */
.post{position:relative;margin:0 12px 12px;border-radius:22px;overflow:hidden;background:var(--late)}
.fundo-apagar{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:26px;font-weight:600;color:#fff}
.post .corpo{position:relative;background:var(--surface);padding:14px 16px 10px;touch-action:pan-y;transition:transform .25s ease}
.post.novo .corpo{animation:chegou 1.2s ease}
@keyframes chegou{0%{box-shadow:inset 0 0 0 2px var(--mango)}100%{box-shadow:inset 0 0 0 2px transparent}}
.post header{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;flex:0 0 40px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;background:color-mix(in srgb,var(--c) 22%,transparent)}
.post header .quem{flex:1;min-width:0}
.post header .quem b{display:block;font-size:.95rem;font-weight:600}
.post header .quem small{color:var(--muted);font-size:.8rem}
.tag{font-size:.78rem;padding:5px 10px;border-radius:20px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.post .valor{font-family:var(--serif);font-size:1.9rem;font-weight:700;margin:12px 0 0;font-variant-numeric:tabular-nums}
.post .desc{margin:2px 0 0;font-size:1rem;overflow-wrap:anywhere}
.post footer{display:flex;gap:20px;margin-top:12px;padding-top:8px;border-top:1px solid var(--line)}
.post.troca .corpo{background:linear-gradient(135deg,rgba(76,214,160,.14),transparent 60%),var(--surface)}
.post.troca .destino{margin:4px 0 0;font-size:.95rem}
.acao{display:flex;align-items:center;gap:6px;padding:6px 2px;color:var(--muted);font-size:.9rem}
.acao svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2}
.acao.curtido{color:var(--heart)}
.acao.curtido svg{fill:var(--heart);animation:pulo .35s ease}
@keyframes pulo{50%{transform:scale(1.35)}}
.ultimo-com{margin:6px 0 2px;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.ultimo-com b{color:var(--text);font-weight:600}
.coracao-grande{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;fill:var(--heart);pointer-events:none;animation:estouro .8s ease forwards}
@keyframes estouro{0%{transform:scale(0);opacity:0}25%{transform:scale(1.15);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}
.mais{display:block;margin:10px auto;padding:10px 18px;border-radius:20px;background:var(--surface);color:var(--muted)}
.vazio{margin:26px 24px;text-align:center;color:var(--muted)}
.vazio .grande{font-size:2.6rem;display:block;margin-bottom:8px}

/* ---------- Extrato ---------- */
.meses{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 14px;scrollbar-width:none}
.meses::-webkit-scrollbar{display:none}
.mes-chip{flex:0 0 auto;min-width:62px;padding:8px 12px;border-radius:16px;background:var(--surface);text-align:center;font-size:.9rem}
.mes-chip small{display:block;font-size:.7rem;color:var(--muted)}
.mes-chip.on{background:var(--text);color:var(--ink)}
.mes-chip.on small{color:var(--ink);opacity:.7}
.mes-chip.futuro:not(.on){border:1px dashed var(--line);background:transparent}
.resumo{margin:0 18px 14px;padding:16px;border-radius:22px;background:var(--surface)}
.resumo .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.resumo .tres small{display:block;color:var(--muted);font-size:.78rem}
.resumo .tres b{font-family:var(--serif);font-size:1.05rem;font-variant-numeric:tabular-nums}
.controles{margin:0 18px 8px}
.busca{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.filtros span{font-size:.8rem;color:var(--muted);margin-right:2px}
.row{display:flex;align-items:center;gap:12px;margin:0 12px 8px;padding:12px 14px;border-radius:18px;background:var(--surface);width:calc(100% - 24px);text-align:left}
.row .data{width:34px;text-align:center;line-height:1.1}
.row .data b{display:block;font-size:1.05rem}
.row .data small{font-size:.68rem;color:var(--muted)}
.row .av{width:36px;height:36px;flex-basis:36px;border-radius:12px;font-size:1.1rem}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .info small{color:var(--muted);font-size:.78rem}
.row .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row.prevista{background:transparent;border:1px dashed var(--line)}
.row.prevista .v{opacity:.75}

/* ---------- Listas e botões ---------- */
.secao{margin:0 18px 16px}
.h3{margin:22px 18px 10px;font-family:var(--serif);font-size:1.2rem}
.btn{display:block;width:calc(100% - 36px);margin:14px 18px;padding:15px;border-radius:16px;background:var(--mango);color:#231A05;font-weight:700;text-align:center}
.btn.sec{background:var(--surface2);color:var(--text);font-weight:500}
.btn.mini{display:inline-block;width:auto;margin:0;padding:10px 14px;font-size:.9rem}
.linha-botoes{display:flex;gap:10px;margin:0 18px 12px}
.linha-botoes .btn{margin:0;width:auto;flex:1}
.nota{margin:0 18px 12px;font-size:.85rem;color:var(--muted)}

.cartao{margin:0 12px 12px;padding:16px;border-radius:22px;background:var(--surface)}
.cartao .top{display:flex;align-items:center;gap:12px}
.cartao .emo{font-size:1.9rem}
.cartao .top div{flex:1;min-width:0}
.cartao .top b{display:block;font-weight:600}
.cartao .top small{color:var(--muted)}
.cartao .pct{font-family:var(--serif);font-weight:700;font-size:1.3rem}
.cartao .trilho i{background:linear-gradient(90deg,var(--violet),var(--ok))}
.cartao.amortizar .trilho i{background:linear-gradient(90deg,var(--mango),var(--ok))}
.cartao .acoes{display:flex;gap:10px}
.cartao .acoes button{flex:1;padding:10px;border-radius:14px;background:var(--surface2)}
.cartao.feita{box-shadow:inset 0 0 0 2px var(--ok)}
.evitar-btn{display:block;width:100%;margin-top:12px;padding:14px;border-radius:16px;background:var(--ok);color:#06231A;font-weight:700;font-size:1rem}
.tipo-tag{font-size:.72rem;padding:3px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);margin-left:6px;font-weight:500}
.refs{display:flex;flex-wrap:wrap;gap:8px;margin:0 18px 10px}
.ref{padding:10px 13px;border-radius:16px;background:var(--surface);font-size:.9rem}
.ref.dest{box-shadow:inset 0 0 0 1.5px var(--mango)}

.contas-lista .item{display:flex;align-items:center;gap:12px;margin:0 18px 8px;padding:12px 14px;border-radius:16px;background:var(--ink)}
.check{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .25s}
.check svg{width:16px;height:16px;stroke:#15131F;stroke-width:3;fill:none;opacity:0;transform:scale(.4);transition:all .25s}
.paga .check{background:var(--ok);border-color:var(--ok)}
.paga .check svg{opacity:1;transform:none}
.contas-lista .info{flex:1;min-width:0}
.contas-lista .info b{display:block;font-weight:600}
.contas-lista .info small{color:var(--muted)}
.paga .info b{text-decoration:line-through;color:var(--muted)}
.x{width:32px;height:32px;border-radius:50%;background:var(--surface2);color:var(--muted)}

/* ---------- Perfil ---------- */
.perfil-top{text-align:center;padding:10px 18px 4px}
.grande-av{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;padding:4px;background:conic-gradient(var(--mango),var(--heart),var(--violet),var(--mango))}
.grande-av span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--ink);font-family:var(--serif);font-size:2.4rem;font-weight:700}
.perfil-top h2{margin:0;font-family:var(--serif);font-size:1.6rem}
.perfil-top p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.nivel{margin:16px 18px;padding:16px;border-radius:22px;background:var(--surface)}
.nivel .cab{display:flex;justify-content:space-between;align-items:baseline}
.nivel .cab b{font-family:var(--serif);font-size:1.3rem}
.nivel .cab small{color:var(--muted)}
.nivel .trilho i{background:linear-gradient(90deg,var(--heart),var(--mango))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 18px 18px}
.stats div{padding:14px 8px;border-radius:18px;background:var(--surface);text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:1.5rem}
.stats small{color:var(--muted);font-size:.78rem}
.conquistas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 18px}
.conq{padding:14px 6px;border-radius:18px;background:var(--surface);text-align:center}
.conq .i{font-size:1.9rem;display:block}
.conq b{display:block;font-size:.8rem;font-weight:600;margin-top:4px}
.conq small{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.conq.bloq{opacity:.38;filter:grayscale(1)}
.campo{display:block;margin:0 18px 12px}
.campo span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.campo input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.chave{display:flex;align-items:center;justify-content:space-between;gap:12px;width:calc(100% - 36px);margin:0 18px 10px;padding:14px 16px;border-radius:16px;background:var(--surface);text-align:left}
.chave span{flex:1}
.chave small{display:block;color:var(--muted);font-size:.8rem}
.sw{width:46px;height:28px;flex:0 0 46px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.on > .sw{background:var(--ok)}
.on > .sw::after{transform:translateX(18px)}

/* ---------- Navegação ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;justify-content:space-around;height:72px;padding:0 6px;background:rgba(21,19,31,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;color:var(--muted)}
nav button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2}
nav button.ativo{color:var(--text)}
nav .fab{flex:0 0 62px;height:62px;margin-top:-26px;border-radius:22px;background:var(--mango);color:#231A05;display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,181,71,.35);transition:transform .15s}
nav .fab:active{transform:scale(.92)}
nav .fab svg{width:30px;height:30px;stroke:#231A05;stroke-width:2.6}

/* ---------- Folha inferior ---------- */
.veu{position:fixed;inset:0;z-index:20;background:rgba(5,4,10,.55);opacity:0;transition:opacity .25s}
.veu.on{opacity:1}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:6px 0 22px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.folha.on{transform:none}
.alca{padding:10px 0 14px;touch-action:none}
.alca i{display:block;width:44px;height:5px;margin:0 auto;border-radius:3px;background:var(--line)}
.folha h3{margin:0 18px 14px;font-family:var(--serif);font-size:1.35rem}
.folha .campo input{background:var(--ink)}
.folha .chave{background:var(--ink)}
.entrada-grande{width:calc(100% - 36px);margin:0 18px 14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--ink);font-family:var(--serif);font-size:1.5rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 18px 10px}
.chip{padding:8px 13px;border-radius:20px;background:var(--surface2);font-size:.88rem}
.chip.on{background:var(--text);color:var(--ink)}
.chip.verde{background:rgba(76,214,160,.16);color:var(--ok)}
.seg{display:flex;margin:0 18px 14px;padding:4px;border-radius:16px;background:var(--ink)}
.seg button{flex:1;padding:10px;border-radius:12px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface2);color:var(--text)}
.seg button.on[data-r="1"]{color:var(--ok)}
.rotulo{margin:6px 18px 8px;font-size:.85rem;color:var(--muted)}
.detalhe-v{margin:0 18px 2px;font-family:var(--serif);font-size:2.4rem;font-weight:700}
.detalhe-d{margin:0 18px 14px;color:var(--muted)}
.coms{margin:0 18px 12px}
.com{display:flex;gap:10px;margin-bottom:12px}
.com .ini{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-size:.85rem}
.com p{margin:0;overflow-wrap:anywhere}
.com small{color:var(--muted);font-size:.75rem}
.enviar{display:flex;gap:8px;margin:0 18px}
.enviar input{flex:1;padding:13px 14px;border-radius:22px;border:1px solid var(--line);background:var(--ink)}
.enviar button{padding:0 18px;border-radius:22px;background:var(--mango);color:#231A05;font-weight:700}

/* ---------- Avisos ---------- */
.aviso{position:fixed;left:14px;right:14px;bottom:86px;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--text);color:var(--ink);transform:translateY(calc(100% + 140px));opacity:0;visibility:hidden;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s .3s}
.aviso.on{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.aviso span{flex:1}
.aviso button{font-weight:700;color:#6A4DFF}
.trofeu{position:fixed;left:50%;top:18%;z-index:40;width:250px;margin-left:-125px;padding:22px 18px;border-radius:26px;background:var(--surface);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:trofeu 2.8s ease forwards}
.trofeu .i{font-size:3rem;display:block}
.trofeu small{color:var(--mango);font-weight:600}
.trofeu b{display:block;font-family:var(--serif);font-size:1.3rem;margin-top:4px}
@keyframes trofeu{0%{transform:scale(.6);opacity:0}12%{transform:scale(1.05);opacity:1}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.confete{position:fixed;top:-12px;z-index:39;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cair linear forwards}
@keyframes cair{to{transform:translateY(105vh) rotate(720deg)}}

/* ---------- Casal ---------- */
.modos{display:flex;margin:0 18px 12px;padding:4px;border-radius:16px;background:var(--surface)}
.modos button{flex:1;padding:9px;border-radius:12px;color:var(--muted);font-weight:500;font-size:.92rem}
.modos button.on{background:var(--text);color:var(--ink)}
.pessoa{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff;vertical-align:middle}
.pessoa.eu{background:#E5613A} .pessoa.par{background:#6B8E3A}
.nos-tag{display:inline-block;margin-left:6px;font-size:.72rem;padding:2px 7px;border-radius:9px;background:rgba(155,140,255,.18);color:var(--violet);font-weight:500}
.acerto{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface2);font-size:.92rem}
.acerto b{font-weight:600}
.estado-nuvem{margin:0 18px 12px;padding:14px 16px;border-radius:18px;background:var(--surface);font-size:.9rem;color:var(--muted)}
.estado-nuvem b{color:var(--text)}
.estado-nuvem .erro{color:var(--late);margin-top:6px}
.convite{margin:0 18px 12px;padding:14px;border-radius:16px;background:var(--ink);font-family:monospace;font-size:.78rem;word-break:break-all;color:var(--muted)}
textarea.campo-grande{width:calc(100% - 36px);margin:0 18px 12px;min-height:90px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--ink);color:var(--text);font:inherit;font-size:.9rem}
.passos{margin:0 18px 12px;padding-left:20px;color:var(--muted);font-size:.88rem}
.passos li{margin-bottom:6px}
.passos b{color:var(--text)}

/* ---------- Menu e entrada ---------- */

<body>
<header class="topo"><h1 id="titulo">Finanças</h1><button class="mini-av" id="miniAv" aria-label="Abrir perfil">E</button></header>
<main id="tela"></main>

<script>
"use strict";
const ponte = window.App;
const RAPIDO = location.hash === "#rapido";
let S = null, aba = "feed", modo = "total", limitePosts = 40, folhaAberta = null, ultimoToque = {el:null,t:0};
let extr = {ano:0, mes:0, tipo:"todas", ordem:"data", busca:""};

const CATS = {
  "Mercado":["🛒","#4CD6A0"], "Alimentação":["🍽️","#FFB547"], "Transporte":["🚗","#5DB7FF"],
  "Moradia":["🏠","#B38CFF"], "Saúde":["💊","#FF6B5B"], "Lazer":["🎉","#FF5E9E"],
  "Compras":["🛍️","#3DD9D6"], "Educação":["📚","#F2D45C"], "Hábitos":["🔁","#FF9F6B"],
  "Contas fixas":["📄","#A59FB8"], "Outros":["✨","#C9C2DA"],
  "Salário":["💼","#4CD6A0"], "Reembolso":["↩️","#4CD6A0"], "Rendimentos":["📈","#4CD6A0"], "Extra":["💶","#4CD6A0"]
};
const cat = c => CATS[c] || CATS["Outros"];
const ICON = {
  coracao:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.2 1.7-2 3.1-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  balao:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-4.8A8 8 0 1 1 21 12z"/></svg>',
  ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESES_L = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
let fmt = null;
const num1 = new Intl.NumberFormat("pt-BR",{maximumFractionDigits:1});
const din = v => fmt.format(v || 0);
const sdin = v => (v > 0 ? "+" : v < 0 ? "−" : "") + din(Math.abs(v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const vibrar = () => { try { ponte.vibrar(); } catch(e){} };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Estado e visões (Eu / Nós / Total) ---------- */
const meu = x => x.dono === S.eu.id;
const casalExiste = () => !!S.parceiro;
/** A visão de casal é Premium: sem ele, os dados do parceiro ficam guardados, só não aparecem. */
const temCasal = () => !!S.parceiro && !!S.premium;
function visivel(x){
  if (!temCasal()) return meu(x);
  if (modo === "eu") return meu(x);
  if (modo === "nos") return !!x.sh;
  return true;
}
function carregar(){ S = JSON.parse(ponte.estado()); preparar(); }
function aplicar(texto){ const r = JSON.parse(texto); S = r.estado; preparar(); return r; }
function preparar(){
  fmt = new Intl.NumberFormat(S.moeda === "BRL" ? "pt-BR" : "pt-PT", {style:"currency", currency:S.moeda});
  S.todos = S.gastos;
  S.meusLanc = S.todos.filter(meu);
  S.vis = S.todos.filter(visivel);
  S.desp = S.vis.filter(g => g.t !== "r");
  S.rec = S.vis.filter(g => g.t === "r");
  S.contasVis = S.contas.filter(visivel);
  S.contasMes = S.contasVis.filter(c => c.ocs && c.ocs.length);
  S.metasVis = S.metas.filter(m => temCasal() || meu(m));
  S.trocasVis = (!temCasal() || modo !== "nos") ? S.trocas : [];
  if (!temCasal()) modo = "total";
}
const nomeDe = dono => dono === S.eu.id ? S.eu.nome : (S.parceiro ? S.parceiro.nome : "Parceiro(a)");
const bolinha = dono => '<span class="pessoa '+(dono === S.eu.id ? "eu" : "par")+'">'+esc(nomeDe(dono).charAt(0).toUpperCase())+'</span>';

/* ---------- Datas ---------- */
const inicioMes = (a, m) => new Date(a, m, 1).getTime();
const agora = new Date();
const MES_ATUAL = {ano:agora.getFullYear(), mes:agora.getMonth()};
function noMes(q, a, m){ return q >= inicioMes(a, m) && q < inicioMes(a, m+1); }
function chaveDia(ms){ const d = new Date(ms); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function rotuloDia(ms){
  const h = new Date(); const d = new Date(ms);
  const h0 = new Date(h.getFullYear(),h.getMonth(),h.getDate()).getTime();
  const d0 = new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const dif = Math.round((h0-d0)/86400000);
  if (dif === 0) return "Hoje";
  if (dif === 1) return "Ontem";
  return d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
}
function haQuanto(ms){
  const s = (Date.now()-ms)/1000;
  if (s < 60) return "agora";
  if (s < 3600) return "há "+Math.floor(s/60)+" min";
  if (s < 86400) return "há "+Math.floor(s/3600)+" h";
  return new Date(ms).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function prazo(d){
  if (d < 0) return "atrasada";
  if (d === 0) return "hoje";
  if (d === 1) return "amanhã";
  return "em "+d+" dias";
}
const idxMes = s => { if (!s) return null; const p = s.split("-").map(Number); return p[0]*12 + p[1] - 1; };
const mesStr = (a, m) => a + "-" + String(m+1).padStart(2, "0");
/** Parcela da conta no mês (1 = primeira) ou null se não acontece nesse mês. */
function parcelaEm(c, a, m){
  const i0 = idxMes(c.ini);
  if (i0 === null) return c.vezes ? null : 1;
  const i = a*12 + m - i0;
  return i >= 0 && (!c.vezes || i < c.vezes) ? i + 1 : null;
}
const FREQ = {m:"todo mês", q:"a cada 15 dias", s:"toda semana"};
/** Datas em que a conta vence no mês (a = ano, m = mês 0-11). */
function ocorrencias(c, a, m){
  const fim = new Date(a, m+1, 0);
  if (!c.freq || c.freq === "m"){
    const n = parcelaEm(c, a, m);
    return n ? [{d:new Date(a, m, Math.min(c.dia, fim.getDate())), n, chave:mesStr(a, m)}] : [];
  }
  const passo = c.freq === "q" ? 14 : 7;
  const [y, mo, dd] = (c.d0 || "").split("-").map(Number);
  if (!y) return [];
  const ini = new Date(y, mo-1, dd), dia = 86400000;
  let k = Math.max(0, Math.ceil(Math.round((new Date(a, m, 1) - ini) / dia) / passo));
  const lista = [];
  for (;;){
    if (c.vezes && k >= c.vezes) break;
    const d = new Date(y, mo-1, dd + k*passo);
    if (d > fim) break;
    lista.push({d, n:k+1, chave:isoData(d.getTime())});
    k++;
  }
  return lista;
}
/** Quantas vezes a conta ainda vence depois do mês atual (só contas com fim). */
function restantesDepois(c){
  if (!c.vezes) return 0;
  const fimMes = new Date(MES_ATUAL.ano, MES_ATUAL.mes + 1, 0);
  if (!c.freq || c.freq === "m"){
    const i0 = idxMes(c.ini); if (i0 === null) return 0;
    return Math.max(0, (i0 + c.vezes - 1) - Math.max(i0, MES_ATUAL.ano*12 + MES_ATUAL.mes + 1) + 1);
  }
  const [y, mo, dd] = (c.d0 || "").split("-").map(Number); if (!y) return 0;
  const passo = c.freq === "q" ? 14 : 7;
  const dias = Math.round((fimMes - new Date(y, mo-1, dd)) / 86400000);
  const jaPassaram = dias < 0 ? 0 : Math.floor(dias / passo) + 1;
  return Math.max(0, c.vezes - jaPassaram);
}
function descConta(c){
  const p = c.ini ? c.ini.split("-").map(Number) : [0, 0];
  if (c.vezes === 1) return "única, "+c.dia+" de "+MESES_L[p[1]-1]+(p[0] !== MES_ATUAL.ano ? " de "+p[0] : "");
  const f = FREQ[c.freq || "m"];
  if (c.vezes > 1){
    const oc = (c.ocs || []).find(o => !o.paga) || (c.ocs || [])[0];
    if (oc) return f+", "+oc.n+" de "+c.vezes;
    return restantesDepois(c) > 0 ? f+", "+c.vezes+"× a partir de "+MESES[p[1]-1]+"/"+String(p[0]).slice(2) : "encerrada ("+c.vezes+"×)";
  }
  return f+(c.freq === "m" || !c.freq ? ", dia "+c.dia : "")+(c.var ? " · valor varia" : "");
}

const isoData = ms => { const d = new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

/* ---------- Equivalência (referências escolhidas pela pessoa) ---------- */
function refsDestaque(excluir){ return S.refs.filter(r => r.dest && r.v > 0 && r.id !== excluir).slice(0, 2); }
function equivalencia(v, excluir){
  const refs = refsDestaque(excluir);
  if (!refs.length || !(v > 0)) return "";
  return '<div class="eq">' + refs.map(r => "<span>"+esc(r.e)+" "+num1.format(v/r.v)+"× "+esc(r.n)+"</span>").join("") + "</div>";
}
function equivTexto(v, excluir){
  const r = refsDestaque(excluir)[0];
  return r ? num1.format(v/r.v)+"× "+r.e+" "+r.n : "";
}

/* ---------- Números do mês (na visão escolhida) ---------- */
function numerosMes(){
  const {ano, mes} = MES_ATUAL;
  const desp = S.desp.filter(g => noMes(g.q, ano, mes));
  const saiu = desp.reduce((a,g) => a+g.v, 0);
  const entrou = S.rec.filter(g => noMes(g.q, ano, mes)).reduce((a,g) => a+g.v, 0);
  const variavel = desp.filter(g => g.c !== "Contas fixas").reduce((a,g) => a+g.v, 0);
  const restante = variavel / S.hoje * (S.diasNoMes - S.hoje);
  const pend = S.contasMes.filter(c => !c.paga);
  const abertas = c => (c.ocs || []).filter(o => !o.paga).length;
  const compMes = S.contasMes.filter(c => !c.e).reduce((a,c) => a + abertas(c)*c.v, 0);
  // dívidas com fim (parcelas e datas únicas): o que falta depois deste mês
  const agoraIdx = ano*12 + mes;
  const compFuturo = S.contasVis.filter(c => !c.e && c.vezes > 0).reduce((a,c) => a + restantesDepois(c) * c.v, 0);
  const comprometido = compMes + compFuturo;
  const aReceber = S.contasMes.filter(c => c.e).reduce((a,c) => a + (c.ocs || []).filter(o => !o.paga).length*c.v, 0);
  const livre = entrou - saiu;
  const ant = new Date(ano, mes-1, 1);
  const limiteAnt = new Date(ant.getFullYear(), ant.getMonth(), Math.min(S.hoje, new Date(ano, mes, 0).getDate()) + 1).getTime();
  const saiuAnt = S.desp.filter(g => g.q >= ant.getTime() && g.q < limiteAnt).reduce((a,g) => a+g.v, 0);
  const temAnt = S.vis.some(g => g.q < inicioMes(ano, mes));
  const trocasMes = S.trocasVis.filter(t => noMes(t.q, ano, mes));
  // acerto do casal: despesas compartilhadas divididas ao meio
  const nos = S.todos.filter(g => g.sh && g.t !== "r" && noMes(g.q, ano, mes));
  const pagoEu = nos.filter(meu).reduce((a,g) => a+g.v, 0);
  const pagoPar = nos.filter(g => !meu(g)).reduce((a,g) => a+g.v, 0);
  return {saiu, entrou, livre, comprometido, compMes, compFuturo, aReceber, restante, sobra: livre + aReceber - compMes - restante,
    saiuAnt, temAnt, nomeAnt: MESES_L[ant.getMonth()], trocasMes, trocado: trocasMes.reduce((a,t) => a+t.v, 0),
    pagoEu, pagoPar, acerto: (pagoEu - pagoPar) / 2};
}

/* ---------- Conquistas, nível e sequência (só o que é meu) ---------- */
function sequencia(){
  const dias = new Set(S.meusLanc.map(g => chaveDia(g.q)).concat(S.trocas.map(t => chaveDia(t.q))));
  const d = new Date();
  if (!dias.has(chaveDia(d.getTime()))) d.setDate(d.getDate()-1);
  let n = 0;
  while (dias.has(chaveDia(d.getTime()))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const meusComentarios = () => S.todos.reduce((a,g) => a + g.cm.filter(c => c.meu).length, 0);
const CONQUISTAS = [
  {id:"primeiro", i:"🌱", n:"Primeiro passo", d:"Registrou o primeiro gasto", ok:() => S.meusLanc.some(g => g.t !== "r")},
  {id:"dez", i:"🔟", n:"Pegando o ritmo", d:"10 lançamentos", ok:() => S.meusLanc.length >= 10},
  {id:"cinquenta", i:"📒", n:"Contador oficial", d:"50 lançamentos", ok:() => S.meusLanc.length >= 50},
  {id:"seq3", i:"🔥", n:"Três dias seguidos", d:"Registrou 3 dias em sequência", ok:() => sequencia() >= 3},
  {id:"seq7", i:"🏅", n:"Semana completa", d:"7 dias em sequência", ok:() => sequencia() >= 7},
  {id:"entrada", i:"💶", n:"Dinheiro entrando", d:"Registrou uma entrada", ok:() => S.meusLanc.some(g => g.t === "r")},
  {id:"emdia", i:"✅", n:"Em dia", d:"Pagou uma conta fixa", ok:() => S.meusLanc.some(g => g.cf)},
  {id:"troca1", i:"🔁", n:"Primeira troca", d:"Evitou um gasto", ok:() => S.trocas.length >= 1},
  {id:"troca10", i:"🧭", n:"Novo hábito", d:"10 trocas registradas", ok:() => S.trocas.length >= 10},
  {id:"sonho", i:"✨", n:"Com destino", d:"Criou uma meta ou imprevisto", ok:() => S.metas.some(meu)},
  {id:"meio", i:"🌓", n:"Meio caminho", d:"Um destino chegou a 50%", ok:() => S.metas.some(m => m.atual >= m.alvo/2)},
  {id:"missao", i:"🏆", n:"Missão cumprida", d:"Concluiu ou quitou um destino", ok:() => S.metas.some(m => m.atual >= m.alvo)},
  {id:"ref", i:"⚖️", n:"Minha régua", d:"Criou uma referência própria", ok:() => S.refs.length >= 2},
  {id:"papo", i:"💬", n:"Conversa", d:"Fez o primeiro comentário", ok:() => meusComentarios() >= 1},
  {id:"casal", i:"💞", n:"Dupla", d:"Entrou em casal no app", ok:() => casalExiste()}
];
function nivel(){
  const desbloq = CONQUISTAS.filter(c => c.ok()).length;
  const trocado = S.trocas.reduce((a,t) => a + t.v, 0);
  const xp = Math.round(S.meusLanc.length*10 + meusComentarios()*5 + desbloq*25 + S.trocas.length*15 + trocado);
  const n = Math.floor(Math.sqrt(xp/40)) + 1;
  const base = 40*(n-1)*(n-1), prox = 40*n*n;
  return {xp, n, base, prox, frac:(xp-base)/(prox-base)};
}
let filaTrofeus = [], mostrandoTrofeu = false;
function verificarConquistas(){
  const vistas = new Set(S.conquistasVistas);
  CONQUISTAS.forEach(c => {
    if (!vistas.has(c.id) && c.ok()){ ponte.marcarConquista(c.id); S.conquistasVistas.push(c.id); filaTrofeus.push(c); }
  });
  proximoTrofeu();
}
function proximoTrofeu(){
  if (mostrandoTrofeu || !filaTrofeus.length || RAPIDO) return;
  mostrandoTrofeu = true;
  const c = filaTrofeus.shift();
  const el = document.createElement("div");
  el.className = "trofeu";
  el.innerHTML = '<span class="i">'+c.i+'</span><small>Conquista desbloqueada</small><b>'+esc(c.n)+'</b>';
  document.body.appendChild(el);
  confete(); vibrar();
  setTimeout(() => { el.remove(); mostrandoTrofeu = false; proximoTrofeu(); }, 2800);
}
function confete(qtd){
  const cores = ["#FFB547","#FF5E7E","#9B8CFF","#4CD6A0","#5DB7FF"];
  for (let i = 0; i < (qtd || 36); i++){
    const p = document.createElement("i");
    p.className = "confete";
    p.style.left = Math.random()*100 + "vw";
    p.style.background = cores[i % cores.length];
    p.style.animationDuration = (1.6 + Math.random()*1.4) + "s";
    p.style.animationDelay = (Math.random()*.4) + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3600);
  }
}

/* ---------- Avisos com desfazer ---------- */
let avisoTimer = null;
function aviso(texto, rotuloAcao, acao){
  if (RAPIDO){ ponte.avisar(texto); return; }
  // cada aviso é um elemento novo, removido por completo depois de 2 s
  $$(".aviso").forEach(e => e.remove());
  clearTimeout(avisoTimer);
  const el = document.createElement("div");
  el.className = "aviso";
  el.innerHTML = "<span>"+esc(texto)+"</span>" + (rotuloAcao ? "<button>"+esc(rotuloAcao)+"</button>" : "");
  document.body.appendChild(el);
  const fechar = () => { el.classList.remove("on"); setTimeout(() => el.remove(), 350); };
  if (rotuloAcao) el.querySelector("button").onclick = e => { e.stopPropagation(); acao(); fechar(); };
  el.onclick = fechar;               // tocar no aviso também fecha
  void el.offsetHeight;              // garante a animação de entrada
  el.classList.add("on");
  avisoTimer = setTimeout(fechar, 2000);
}

/* ---------- Gestos: deslizar para apagar, toque e toque duplo ---------- */
function gestos(corpo, {aoApagar, aoToqueDuplo, aoToque}){
  let x0 = 0, y0 = 0, dx = 0, arrastando = false, decidido = false, ativo = false, timer = null;
  corpo.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; dx = 0; arrastando = false; decidido = false; ativo = true; });
  corpo.addEventListener("pointermove", e => {
    if (!ativo) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!decidido && (Math.abs(mx) > 10 || Math.abs(my) > 10)){
      decidido = true; arrastando = Math.abs(mx) > Math.abs(my) && mx < 0 && !!aoApagar;
      if (arrastando) corpo.style.transition = "none";
    }
    if (arrastando){ dx = Math.min(0, mx); corpo.style.transform = "translateX("+dx+"px)"; }
  });
  const fim = e => {
    if (!ativo) return; ativo = false;
    corpo.style.transition = "";
    if (arrastando){
      if (dx < -110){ corpo.style.transform = "translateX(-110%)"; vibrar(); setTimeout(aoApagar, 200); }
      else corpo.style.transform = "";
      return;
    }
    if (decidido || e.type === "pointercancel") return;
    if (e.target.closest("button")) return;
    const t = Date.now();
    if (aoToqueDuplo && ultimoToque.el === corpo && t - ultimoToque.t < 300){
      clearTimeout(timer); ultimoToque = {el:null,t:0}; aoToqueDuplo(e);
    } else {
      ultimoToque = {el:corpo,t};
      if (aoToque) timer = setTimeout(() => { if (ultimoToque.el === corpo && ultimoToque.t === t) aoToque(e); }, aoToqueDuplo ? 300 : 0);
    }
  };
  corpo.addEventListener("pointerup", fim);
  corpo.addEventListener("pointercancel", fim);
}

/* ---------- Folha inferior ---------- */
function abrirFolha(html, montar){
  fecharFolha(true);
  const veu = document.createElement("div"); veu.className = "veu";
  const folha = document.createElement("section"); folha.className = "folha";
  folha.setAttribute("role","dialog");
  folha.innerHTML = '<div class="alca"><i></i></div>' + html;
  document.body.append(veu, folha);
  requestAnimationFrame(() => { veu.classList.add("on"); folha.classList.add("on"); });
  veu.onclick = () => fecharFolha();
  const alca = $(".alca", folha); let y0 = 0, dy = 0, puxando = false;
  alca.addEventListener("pointerdown", e => { y0 = e.clientY; puxando = true; folha.style.transition = "none"; alca.setPointerCapture(e.pointerId); });
  alca.addEventListener("pointermove", e => { if (!puxando) return; dy = Math.max(0, e.clientY - y0); folha.style.transform = "translateY("+dy+"px)"; });
  alca.addEventListener("pointerup", () => { puxando = false; folha.style.transition = ""; if (dy > 90) fecharFolha(); else folha.style.transform = ""; dy = 0; });
  folhaAberta = {veu, folha};
  if (montar) montar(folha);
  return folha;
}
function fecharFolha(imediato){
  if (!folhaAberta) return;
  const {veu, folha} = folhaAberta; folhaAberta = null;
  if (imediato){ veu.remove(); folha.remove(); return; }
  if (RAPIDO){ veu.classList.remove("on"); folha.classList.remove("on"); setTimeout(() => ponte.fechar(), 220); return; }
  veu.classList.remove("on"); folha.style.transform = ""; folha.classList.remove("on");
  setTimeout(() => { veu.remove(); folha.remove(); }, 300);
}

/* ---------- Navegação ---------- */
function ir(nova){
  aba = nova;
  $$("nav [data-aba]").forEach(b => b.classList.toggle("ativo", b.dataset.aba === aba));
  window.scrollTo(0,0);
  render(true);
}
window.voltar = function(){
  if (folhaAberta){ fecharFolha(); return true; }
  if (aba !== "feed"){ ir("feed"); return true; }
  return false;
};
window.recarregar = function(){
  if (RAPIDO) return;
  carregar();
  if (!S.nuvem.logado && document.body.classList.contains("entrada")) return;   // não apaga o que está sendo digitado
  // não redesenha por baixo de uma folha aberta (a pessoa pode estar a escrever)
  if (!folhaAberta){ const y = window.scrollY; render(false); window.scrollTo(0, y); }
  verificarConquistas();
};

function render(animar){
  const tela = $("#tela");

/* ================= Extrato ================= */
function projetadas(a, m){
  const atual = a === MES_ATUAL.ano && m === MES_ATUAL.mes;
  const futuro = inicioMes(a, m) > inicioMes(MES_ATUAL.ano, MES_ATUAL.mes);
  if (!atual && !futuro) return [];
  const lista = [];
  S.contasVis.forEach(c => {
    const pagas = atual ? new Set((c.ocs || []).filter(o => o.paga).map(o => o.chave)) : new Set();
    ocorrencias(c, a, m).filter(o => !pagas.has(o.chave)).forEach(o => lista.push({prev:true, id:c.id, chave:o.chave, q:new Date(o.d.getFullYear(), o.d.getMonth(), o.d.getDate(), 12).getTime(), v:c.v,
      d:c.n + (c.vezes > 1 ? " ("+o.n+"/"+c.vezes+")" : "") + (c.var ? " ≈" : ""),
      c:c.c || (c.e ? (/sal[aá]rio|ordenado|vencimento/i.test(c.n) ? "Salário" : "Extra") : "Contas fixas"),
      t:c.e ? "r" : "d", dono:c.dono, sh:c.sh}));
  });
  return lista;
}

const doMesExtrato = () => S.vis.filter(g => noMes(g.q, extr.ano, extr.mes)).concat(projetadas(extr.ano, extr.mes));
function linhaExtrato(x){
  const d = new Date(x.q); const [emoji, cor] = cat(x.c); const r = x.t === "r";
  const quem = temCasal() ? ' · '+esc(nomeDe(x.dono))+(x.sh ? ' · Nós' : '') : '';

    + '<span class="av" style="--c:'+cor+'">'+emoji+'</span>'
    + '<span class="info"><b>'+esc(x.d)+'</b><small>'+esc(x.c)+(x.prev ? " · prevista" : "")+quem+'</small></span>'
    + '<span class="v'+(r ? " pos" : "")+'">'+(r ? "+" : "−")+din(x.v)+'</span></button>';

function listaExtrato(todos){
  let l = todos.filter(passaFiltro);
  if (extr.ordem === "valor") l.sort((a,b) => b.v - a.v);
  else if (extr.ordem === "cat") l.sort((a,b) => a.c.localeCompare(b.c) || b.q - a.q);
  else l.sort((a,b) => b.q - a.q);
  if (!l.length) return '<div class="vazio">'+(extr.busca.trim() || extr.tipo !== "todas" ? "Nada encontrado com esses filtros." : "Nada neste mês.")+'</div>';
  return l.map(linhaExtrato).join("");

/* ================= Ligações de eventos ================= */
function ligar(animar){
  ligarInicio(animar);
  ligarResto();
}
function ligarInicio(animar){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$(".trilho i[data-f]").forEach(i => i.style.width = (parseFloat(i.dataset.f)*100) + "%");
    $$(".fluxo i[data-w]").forEach(i => i.style.width = (parseFloat(i.dataset.w)*100) + "%");
  }));
  const tot = $("[data-contar]");
  if (tot && animar) contar(tot, parseFloat(tot.dataset.contar));

  $$("[data-modo]").forEach(b => b.onclick = () => { modo = b.dataset.modo; preparar(); vibrar(); render(true); });

  ligarPosts();
  $$("[data-vista]").forEach(b => b.onclick = () => { vista = b.dataset.vista; render(false); });
  const mais = $("#verMais"); if (mais) mais.onclick = () => { limitePosts += 40; render(false); };
}
function ligarPosts(){
  $$(".post[data-id]").forEach(el => {
    const id = el.dataset.id, corpo = $(".corpo", el), alheio = !!el.dataset.alheio;
    gestos(corpo, {
      aoApagar: alheio ? null : () => apagarGasto(id),
      aoToqueDuplo: () => { mostrarCoracao(corpo); const g = achar(id); if (g && !g.l) curtir(id); },
      aoToque: () => folhaDetalhe(id)
    });
    $("[data-curtir]", el).onclick = () => curtir(id);
    $("[data-comentar]", el).onclick = () => folhaComentarios(id);
    $("[data-cat]", el).onclick = () => alheio ? folhaDetalhe(id) : folhaCategoria(id);
  });
  $$(".post[data-troca]").forEach(el => gestos($(".corpo", el), {aoApagar: () => apagarTroca(el.dataset.troca)}));
}
function ligarResto(){
  $$("[data-conta]").forEach(b => b.onclick = () => folhaConta(b.dataset.conta));
  $$("[data-contas]").forEach(b => b.onclick = folhaContas);
  $$("[data-nova-entrada]").forEach(b => b.onclick = () => folhaNovo(true));

  // meses, filtros e busca
  $$("[data-mes]").forEach(b => b.onclick = () => { const [a, m] = b.dataset.mes.split("-").map(Number); extr.ano = a; extr.mes = m; render(false); });
  const meses = $("#meses"); if (meses){ const on = $(".mes-chip.on", meses); if (on) meses.scrollLeft = on.offsetLeft - meses.clientWidth/2 + on.clientWidth/2; }
  $$("[data-tipo]").forEach(b => b.onclick = () => { extr.tipo = b.dataset.tipo; render(false); });
  $$("[data-ordem]").forEach(b => b.onclick = () => { extr.ordem = b.dataset.ordem; render(false); });
  const busca = $("#busca");
  if (busca) busca.oninput = () => { extr.busca = busca.value; limitePosts = 40; $("#listaExtrato").innerHTML = listaAtual(); ligarPosts(); ligarLista(); };
  ligarLista();

  // trocas e destinos
  $$("[data-evitei]").forEach(b => b.onclick = () => evitei(b.dataset.evitei));
  $$("[data-editar-ref]").forEach(b => b.onclick = () => folhaReferencia(b.dataset.editarRef));
  $$("[data-nova-ref]").forEach(b => b.onclick = () => folhaReferencia(null, b.dataset.novaRef === "evitar"));
  $$("[data-meta]").forEach(el => {
    const id = el.dataset.meta;
    $("[data-guardar]", el).onclick = () => folhaGuardar(id);
    const del = $("[data-apagar-meta]", el);
    if (del) del.onclick = () => {
      const m = S.metas.find(x => x.id === id);
      confirmar('Excluir “'+esc(m.n)+'”?', 'O destino some'+(m.sh ? ' para os dois' : '')+'. Itens que mandavam dinheiro para cá passam a só contar.', "Excluir", () => { aplicar(ponte.apagar(id)); render(false); });
    };
  });
  const nm = $("[data-nova-meta]"); if (nm) nm.onclick = folhaNovaMeta;

  // perfil
  const sp = $("#salvarPerfil");
  if (sp) sp.onclick = () => { aplicar(ponte.salvarNome($("#pNome").value)); vibrar(); render(false); aviso("Nome salvo"); };
  $$("[data-moeda]").forEach(b => b.onclick = () => { aplicar(ponte.salvarMoeda(b.dataset.moeda)); render(false); });
  $$("[data-sens]").forEach(b => b.onclick = () => { aplicar(ponte.definirSensibilidade(Number(b.dataset.sens))); render(false); });
  const sa = $("#swAgitar"); if (sa) sa.onclick = () => ponte.ativarAgitar(!S.agitar);
  const sn = $("#swNotif"); if (sn) sn.onclick = () => { if (S.agitar) aviso("Desligue o agitar para desligar a notificação fixa"); else ponte.ativarNotificacao(); };
  const tp = $("#testarPopup"); if (tp) tp.onclick = () => { ponte.testarPopup(); aviso("Popup enviado. Se não aparecer por cima, libere as notificações flutuantes."); };
  const ap = $("#ajPopup"); if (ap) ap.onclick = () => ponte.abrirAjustesPopup();
  const aa = $("#ajApp"); if (aa) aa.onclick = () => ponte.abrirAjustesApp();
  $$("[data-atualizar]").forEach(b => b.onclick = () => {
    if (!(S.atualizacao || {}).podeInstalar){ aviso("Primeiro permita que o Finanças instale atualizações"); ponte.permitirInstalacao(); return; }
    pedir("instalarAtualizacao", () => ponte.instalarAtualizacao(), b, r => { if (!r.ok) aviso(r.msg); });
  });
  const pa = $("#procAtu"); if (pa) pa.onclick = () => pedir("procurarAtualizacao", () => ponte.procurarAtualizacao(), pa, r => aviso(r.nova ? "Versão nova encontrada" : r.msg));
  const pi = $("#permInstalar"); if (pi) pi.onclick = () => ponte.permitirInstalacao();
  const sa2 = $("#swAutoAtu"); if (sa2) sa2.onclick = () => { aplicar(ponte.definirAutoAtualizar(!(S.atualizacao || {}).automatico)); render(false); };
  const sp2 = $("#swPremium"); if (sp2) sp2.onclick = () => alternarPremium(!S.premium);
  $$("[data-premium]").forEach(b => b.onclick = () => folhaPremium(""));
  const lb = $("#libBateria"); if (lb) lb.onclick = () => ponte.liberarBateria();
  const ia = $("#iniAuto"); if (ia) ia.onclick = () => ponte.abrirInicioAutomatico();
  const ex = $("#exportar"); if (ex) ex.onclick = () => ponte.exportar();
  const im = $("#importar"); if (im) im.onclick = () => confirmar("Restaurar backup?", "Os seus dados atuais neste celular serão substituídos pelos do arquivo escolhido.", "Escolher arquivo", () => ponte.importar());
  ligarConta();
}
function ligarLista(){
  $$("[data-abrir]").forEach(b => b.onclick = () => folhaDetalhe(b.dataset.abrir));
  $$("#listaExtrato [data-conta]").forEach(b => b.onclick = () => folhaConta(b.dataset.conta));
}
function contar(el, alvo){
  const t0 = performance.now(), dur = 900;
  const passo = t => { const k = Math.min(1, (t-t0)/dur); const e = 1 - Math.pow(1-k, 3); el.textContent = din(alvo*e); if (k < 1) requestAnimationFrame(passo); };
  requestAnimationFrame(passo);
}
function mostrarCoracao(corpo){
  const d = document.createElement("div");
  d.innerHTML = '<svg class="coracao-grande" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.2 1.7-2 3.1-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';
  const svg = d.firstChild; corpo.appendChild(svg); vibrar();
  setTimeout(() => svg.remove(), 850);
}
function confirmar(titulo, texto, rotulo, acao){
  abrirFolha('<h3>'+titulo+'</h3><p class="nota">'+texto+'</p><button class="btn" id="sim">'+rotulo+'</button><button class="btn sec" id="nao">Cancelar</button>', f => {

function ligarEntrada(){
  const email = () => (($("#cEmail") || {}).value || entrada.email).trim();
  $$("[data-em]").forEach(b => b.onclick = () => { entrada.email = email(); entrada.modo = b.dataset.em; render(false); });
  const be = $("#btnEntrar");
  if (be) be.onclick = () => {
    const criar = entrada.modo === "criar";
    const e = email(), senha = $("#cSenha").value, nome = criar ? $("#cNome").value.trim() : "";
    entrada.email = e;
    if (!e.includes("@") || senha.length < 6){ aviso("Preencha o e-mail e uma senha com pelo menos 6 caracteres"); return; }
    if (criar && !nome){ aviso("Diga o seu nome, é assim que o parceiro(a) vai ver"); return; }
    pedir("entrar", () => ponte.entrarConta(e, senha, nome, criar), be, r => {
      if (!r.ok){ aviso(r.msg); return; }
      vibrar(); aba = "feed"; entrada.modo = "entrar"; render(true);
      aviso(criar ? "Conta criada. Bem-vindo(a)!" : "Bem-vindo(a) de volta"); verificarConquistas();
    });
  };
  const es = $("#esqueci"); if (es) es.onclick = () => { entrada.email = email(); entrada.modo = "rec1"; render(false); };
  $$("#voltarEntrar").forEach(b => b.onclick = () => { entrada.modo = "entrar"; render(false); });
  const enviarCodigo = b => {
    const e = email();
    if (!e.includes("@")){ aviso("Escreva o e-mail da conta"); return; }
    entrada.email = e;
    pedir("recuperar", () => ponte.recuperarSenha(e), b, r => {
      if (!r.ok){ aviso(r.msg); return; }
      if (entrada.modo !== "rec2"){ entrada.modo = "rec2"; render(false); }
      aviso("Código enviado para " + e);
    });
  };
  const bc = $("#btnCodigo"); if (bc) bc.onclick = () => enviarCodigo(bc);
  const re = $("#reenviar"); if (re) re.onclick = () => enviarCodigo(re);
  const br = $("#btnRedefinir");

    if (codigo.length < 6 || nova.length < 6){ aviso("Escreva o código e uma senha nova com pelo menos 6 caracteres"); return; }

      vibrar(); aba = "feed"; entrada.modo = "entrar"; render(true); aviso("Senha alterada. Bem-vindo(a) de volta");
    });
  };
  ligarConta();
}

let esperando = {};
window.respostaNuvem = function(pedido, r){
  S = r.estado; preparar();

function pedir(pedido, chamada, botao, cb){
  if (botao){ botao.disabled = true; botao.dataset.txt = botao.textContent; botao.textContent = "Aguarde…"; }
  esperando[pedido] = r => { if (botao && botao.isConnected){ botao.disabled = false; botao.textContent = botao.dataset.txt; } cb(r); };
  chamada();
}

/* ---------- Novo lançamento (também é o modo rápido) ---------- */
function folhaNovo(receitaInicial, quandoInicial){
  let receita = !!receitaInicial, escolhida = "", sh = modo === "nos", quando = quandoInicial || "hoje";
  const hj = new Date(), mesAtualStr = mesStr(MES_ATUAL.ano, MES_ATUAL.mes);
  if (quando === "mensal" || quando === "vezes") quando = "repetir";
  let data = isoData(Date.now()), primeira = isoData(Date.now()), freq = "m", comFim = false, vezes = 3, variavel = false, pagoJa = null;
  const evitar = S.refs.filter(r => r.evitar);
  abrirFolha('<div class="seg"><button data-r="0">Saída</button><button data-r="1">Entrada</button></div>'
    + '<input class="entrada-grande" id="txtGasto" autocomplete="off" enterkeyhint="done">'
    + '<div class="chips" id="quando"></div><div id="quandoBox"></div>'
    + '<div class="chips" id="chipsCat"></div><div id="prevEq" style="margin:0 18px;min-height:22px"></div>'
    + '<div id="nosBox"></div>'
    + '<button class="btn" id="salvarGasto">Adicionar</button>'
    + (evitar.length ? '<div class="rotulo">Ou registre uma troca</div><div class="chips">'+evitar.map(r => '<button class="chip verde" data-ev="'+r.id+'">Evitei '+esc(r.e)+' '+esc(r.n)+' · '+din(r.v)+'</button>').join("")+'</div>' : ''), f => {
    const inp = $("#txtGasto", f);
    const valorDigitado = () => { const r = inp.value.trim() ? ponte.detectar(inp.value, receita) : ""; return r ? JSON.parse(r) : null; };
    const pagoAtual = () => pagoJa !== null ? pagoJa : false;   // começa como não paga: entra no comprometido até marcar
    const primeiraJaPassou = () => { const [a, m, d] = primeira.split("-").map(Number); return new Date(a, m-1, d) <= hj && a === MES_ATUAL.ano && m-1 === MES_ATUAL.mes; };
    const dataFutura = () => { const [a, m, d] = data.split("-").map(Number); return new Date(a, m-1, d) > new Date(hj.getFullYear(), hj.getMonth(), hj.getDate()); };
    const rotuloBotao = () => {
      $("#salvarGasto", f).textContent = quando === "hoje" ? "Adicionar" : quando === "data" ? (dataFutura() ? "Programar" : "Adicionar") : (comFim ? "Criar "+vezes+" parcelas" : "Criar conta que se repete");
      const nota = $("#qNota", f); const d = valorDigitado();
      if (nota && quando === "data") nota.textContent = dataFutura() ? "Data futura: fica programada e entra no “comprometido” desse mês." : "Fica registrado com essa data.";
      if (nota && quando === "repetir") nota.textContent = comFim ? (d ? vezes+" × "+din(d.v)+" = "+din(vezes*d.v)+" no total" : "Escreva o valor de cada vez.") : "Repete "+FREQ[freq]+" até você excluir.";
    };
    const montarQuando = () => {
      $("#quando", f).innerHTML = [["hoje","Hoje"],["data","Outra data"],["repetir", S.premium ? "Repetir" : "Repetir 🔒"]]
        .map(([k,n]) => '<button class="chip'+(quando === k ? " on" : "")+'" data-q="'+k+'">'+n+'</button>').join("");
      $$("#quando .chip", f).forEach(bt => bt.onclick = () => {
        if (bt.dataset.q === "repetir" && !S.premium){ folhaPremium("Repetir contas (mensal, a cada 15 dias, semanal e parceladas) é um recurso Premium."); return; }
        quando = bt.dataset.q; montarQuando();
      });
      let h = "";
      if (quando === "data") h = '<label class="campo"><span>Data</span><input id="qData" type="date" value="'+data+'"></label><p class="nota" id="qNota"></p>';
      if (quando === "repetir") h = '<div class="chips">'+[["m","Todo mês"],["q","A cada 15 dias"],["s","Toda semana"]].map(([k,n]) => '<button class="chip'+(freq === k ? " on" : "")+'" data-freq="'+k+'">'+n+'</button>').join("")+'</div>'
        + '<label class="campo"><span>Primeira vez</span><input id="qPrim" type="date" value="'+primeira+'"></label>'
        + '<div class="chips"><button class="chip'+(comFim ? "" : " on")+'" data-fim="0">Sem fim</button><button class="chip'+(comFim ? " on" : "")+'" data-fim="1">Número de vezes</button></div>'
        + (comFim ? '<label class="campo"><span>Quantas vezes</span><input id="qVezes" inputmode="numeric" value="'+vezes+'"></label>' : chave("qVar", "O valor muda a cada vez", "Ex.: luz, água. O valor escrito vira a estimativa", variavel))
        + (primeiraJaPassou() ? chave("qPago", receita ? "A primeira já foi recebida" : "A primeira já foi paga", "", pagoAtual()) : '')
        + '<p class="nota" id="qNota"></p>';
      $("#quandoBox", f).innerHTML = h;
      const qd = $("#qData", f); if (qd) qd.onchange = () => { data = qd.value || data; rotuloBotao(); };
      $$("[data-freq]", f).forEach(bt => bt.onclick = () => { freq = bt.dataset.freq; montarQuando(); });
      $$("[data-fim]", f).forEach(bt => bt.onclick = () => { comFim = bt.dataset.fim === "1"; montarQuando(); });
      const qp0 = $("#qPrim", f); if (qp0) qp0.onchange = () => { primeira = qp0.value || primeira; pagoJa = null; montarQuando(); };
      const qv = $("#qVar", f); if (qv) qv.onclick = () => { variavel = !variavel; qv.classList.toggle("on", variavel); };
      const qp = $("#qPago", f); if (qp) qp.onclick = () => { pagoJa = !pagoAtual(); qp.classList.toggle("on", pagoJa); };
      const qve = $("#qVezes", f); if (qve) qve.oninput = () => { vezes = Math.min(600, Math.max(2, parseInt(qve.value) || 2)); rotuloBotao(); };
      rotuloBotao();
    };
    const montar = () => {
      $$(".seg button", f).forEach(b => b.classList.toggle("on", (b.dataset.r === "1") === receita));
      inp.placeholder = receita ? "1090 salário" : quando === "repetir" ? "400 renda" : "5,50 café";
      $("#chipsCat", f).innerHTML = chipsCategorias(receita, escolhida, true);
      $$("#chipsCat .chip", f).forEach(c => c.onclick = () => { escolhida = c.dataset.c; montar(); });
      $("#nosBox", f).innerHTML = chaveNos(sh);
      const sw = $("#swNos", f); if (sw) sw.onclick = () => { sh = !sh; montar(); };
      montarQuando();
      previa();
    };
    const previa = () => {
      const d = valorDigitado();
      if (d && d.r && !receita){ receita = true; escolhida = ""; montar(); return; }
      const auto = $('#chipsCat .chip[data-c=""]', f);
      if (auto) auto.textContent = d ? "Automática: " + cat(d.c)[0] + " " + d.c : "Automática";
      $("#prevEq", f).innerHTML = d ? (receita ? '<div class="eq"><span class="pos">Entrada de '+din(d.v)+'</span></div>' : equivalencia(d.v)) : "";
      rotuloBotao();
    };
    $$(".seg button", f).forEach(b => b.onclick = () => { receita = b.dataset.r === "1"; escolhida = ""; montar(); inp.focus(); });
    inp.oninput = previa;
    setTimeout(() => inp.focus(), 250);
    window.focarEntrada = () => inp.focus();
    const salvar = () => {
      let r, programado = false, msg = "";
      if (quando === "hoje") r = ponte.adicionarGasto(inp.value, escolhida, receita, sh, "");
      else if (quando === "data" && !dataFutura()){
        const [a, m, d] = data.split("-").map(Number);
        r = ponte.adicionarGasto(inp.value, escolhida, receita, sh, String(new Date(a, m-1, d, hj.getHours(), hj.getMinutes()).getTime()));
      } else if (quando === "data"){
        const [a, m, d] = data.split("-").map(Number);
        r = ponte.adicionarRecorrente(inp.value, escolhida, receita, sh, data, "m", 1, false, false);
        programado = true; msg = "Programado para "+d+" de "+MESES_L[m-1];
      } else {
        r = ponte.adicionarRecorrente(inp.value, escolhida, receita, sh, primeira, freq, comFim ? vezes : 0, !comFim && variavel, primeiraJaPassou() && pagoAtual());
        programado = true; msg = comFim ? vezes+" vezes criadas ("+FREQ[freq]+")" : (receita ? "Entrada" : "Conta")+" criada: "+FREQ[freq];
      }
      const res = aplicar(r);
      if (!res.ok){ aviso(res.msg || "Escreva o valor e o que foi, como “5,50 café”"); return; }
      vibrar();
      if (programado){
        if (RAPIDO){ ponte.avisar(msg); fecharFolha(); return; }
        fecharFolha(); render(false); aviso(msg); verificarConquistas(); return;
      }
      const g = S.meusLanc.slice().sort((a,b) => b.q - a.q)[0];
      if (RAPIDO){ ponte.avisar((g.t === "r" ? "+" : "") + din(g.v) + " em " + g.c + " salvo"); fecharFolha(); return; }
      fecharFolha();
      extr.ano = MES_ATUAL.ano; extr.mes = MES_ATUAL.mes;
      if (!visivel(g)){ modo = "total"; preparar(); }
      if (aba !== "feed") ir("feed"); else render(true);
      const p = $('.post[data-id="'+g.id+'"]'); if (p) p.classList.add("novo");
      verificarConquistas();
    };
    $("#salvarGasto", f).onclick = salvar;
    inp.onkeydown = e => { if (e.key === "Enter") salvar(); };
    $$("[data-ev]", f).forEach(b => b.onclick = () => { if (!RAPIDO) fecharFolha(); evitei(b.dataset.ev); });
    montar();
  });
}

      const sw = $("#swNos", f); if (sw) sw.onclick = () => { sh = !sh; montar(); };
    };
    $$(".seg button", f).forEach(b => b.onclick = () => {
      receita = b.dataset.r === "1";
      const lista = receita ? S.categoriasReceita : S.categorias;
      if (!lista.includes(escolhida)) escolhida = receita ? "Extra" : "Outros";
      montar();
    });
    montar();
    $("#eSalvar", f).onclick = () => {
      const [a, m, d] = $("#eDt", f).value.split("-").map(Number);
      const orig = new Date(g.q);
      const nq = a ? new Date(a, m-1, d, orig.getHours(), orig.getMinutes(), orig.getSeconds(), orig.getMilliseconds()).getTime() : g.q;
      if (!aplicar(ponte.editarGasto(id, String(nq), $("#eV", f).value, $("#eD", f).value, escolhida, receita, sh)).ok){ aviso("Confira o valor e a descrição"); return; }
      vibrar(); fecharFolha(); render(false); aviso("Alterações salvas");
    };
  });
}
function folhaComentarios(id){
  const lista = () => {
    const g = achar(id);
    return g && g.cm.length
      ? g.cm.map(c => '<div class="com"><span class="ini">'+esc((c.a||"?").charAt(0).toUpperCase())+'</span><div><p><b>'+esc(c.a)+'</b> '+esc(c.t)+'</p><small>'+haQuanto(c.q)+'</small></div></div>').join("")
      : '<p class="nota" style="margin:0 0 12px">'+(g && g.sh && temCasal() ? "Comente com "+esc(S.parceiro.nome)+": foi planejado? Valeu a pena?" : "Anote o contexto: foi planejado? Valeu a pena?")+'</p>';
  };
  const g = achar(id);
  abrirFolha('<h3>'+din(g.v)+' · '+esc(g.d)+'</h3><div class="coms" id="coms">'+lista()+'</div>'
    + '<div class="enviar"><input id="txtCom" placeholder="Escreva um comentário" enterkeyhint="send"><button id="envCom">Enviar</button></div>', f => {
    const inp = $("#txtCom", f);
    const enviar = () => {
      if (!inp.value.trim()) return;
      aplicar(ponte.comentar(id, inp.value)); inp.value = "";
      $("#coms", f).innerHTML = lista(); vibrar(); verificarConquistas();
    };
    $("#envCom", f).onclick = enviar;
    inp.onkeydown = e => { if (e.key === "Enter") enviar(); };
  });
}
function folhaCategoria(id){
  const g = achar(id);
  abrirFolha('<h3>Categoria</h3><div class="chips">'+chipsCategorias(g.t === "r", g.c, false)+'</div>', f => {
    $$(".chip", f).forEach(c => c.onclick = () => { aplicar(ponte.mudarCategoria(id, c.dataset.c)); vibrar(); fecharFolha(); render(false); });
  });
}

/* ---------- Contas e entradas fixas ---------- */
function textoPaga(c){
  if (!c.paga) return prazo(c.diasAte);
  const verbo = c.e ? "recebida" : "paga";
  return temCasal() && c.pagaPor ? verbo + " por " + nomeDe(c.pagaPor) : verbo;
}
function folhaConta(id){
  const c = S.contas.find(x => x.id === id); if (!c) return;
  const ocs = c.ocs || [];
  const verbo = c.e ? ["Marcar como recebida", "Desmarcar recebimento"] : ["Marcar como paga", "Desmarcar pagamento"];
  let corpo = "";
  if (ocs.length > 1){
    corpo = '<div class="rotulo">Neste mês</div><div class="contas-lista">' + ocs.map(o =>
      '<div class="item'+(o.paga ? " paga" : "")+'"><button class="check" data-oc="'+o.chave+'" aria-label="Alternar">'+ICON.ok+'</button>'
      + '<div class="info"><b>Dia '+o.dia+(c.vezes ? ' · '+o.n+' de '+c.vezes : '')+'</b><small>'+(o.paga ? (c.e ? "recebida" : "paga")+(temCasal() && o.pagaPor ? " por "+esc(nomeDe(o.pagaPor)) : "") : prazo(o.dia - S.hoje))+'</small></div></div>').join("") + '</div>';
  } else if (ocs.length === 1){
    const o = ocs[0];
    const bloqueada = o.paga && o.pagaPor && o.pagaPor !== S.eu.id;
    corpo = (!o.paga && c.var ? '<label class="campo"><span>Valor real deste mês</span><input id="valReal" inputmode="decimal" value="'+String(c.v).replace(".", ",")+'"></label>' : '')
      + (bloqueada ? '<p class="nota">Só '+esc(nomeDe(o.pagaPor))+' pode desmarcar.</p>' : '<button class="btn" id="sim" data-chave="'+o.chave+'">'+verbo[o.paga ? 1 : 0]+'</button>');
  }
  abrirFolha('<h3>'+esc(c.n)+(c.sh ? '<span class="nos-tag">Nós</span>' : '')+'</h3><div class="detalhe-v'+(c.e ? " pos" : "")+'">'+(c.var ? "≈ " : "")+(c.e ? "+" : "")+din(c.v)+'</div>'
    + '<p class="detalhe-d">'+(c.e ? "Entrada" : "Conta")+': '+esc(descConta(c))+'.'+(ocs.length ? '' : '<br>Não acontece neste mês.')+'</p>'
    + corpo + (meu(c) ? '<button class="btn sec" id="excluirConta" style="color:var(--late)">Excluir</button>' : ''), f => {
    const pagar = (chave, valor) => {
      const r = aplicar(ponte.alternarPaga(c.id, valor || "", chave));
      if (!r.ok){ aviso(r.msg); return false; }
      vibrar(); verificarConquistas(); return true;
    };
    const b = $("#sim", f);
    if (b) b.onclick = () => { const vr = $("#valReal", f); const era = ocs[0].paga; if (pagar(b.dataset.chave, vr ? vr.value : "")){ fecharFolha(); render(false); if (!era) confete(18); } };
    $$("[data-oc]", f).forEach(bt => bt.onclick = () => { if (pagar(bt.dataset.oc, "")){ render(false); folhaConta(id); } });
    const ex = $("#excluirConta", f);
    if (ex) ex.onclick = () => confirmar("Excluir “"+esc(c.n)+"”?", "As próximas deixam de aparecer. O que já foi pago continua no extrato.", "Excluir", () => { aplicar(ponte.apagar(c.id)); render(false); });
  });
}

function folhaContas(){
  const agoraIdx = MES_ATUAL.ano*12 + MES_ATUAL.mes;
  const grupos = [
    ["Neste mês", c => (c.ocs || []).length > 0],
    ["Programadas", c => !(c.ocs || []).length && (idxMes(c.ini) > agoraIdx || restantesDepois(c) > 0)],
    ["Encerradas", c => !(c.ocs || []).length && !(idxMes(c.ini) > agoraIdx || restantesDepois(c) > 0)]
  ];
  const item = (c, doMes) => '<div class="item'+(c.paga ? " paga" : "")+'">'
    + (doMes ? '<button class="check" data-pagar="'+c.id+'" aria-label="Alternar">'+ICON.ok+'</button>' : '')
    + '<div class="info" data-abrir-conta="'+c.id+'"><b>'+esc(c.n)+(c.sh ? '<span class="nos-tag">Nós</span>' : '')+'</b><small>'+(c.e ? "Entrada" : "Conta")+' · '+esc(descConta(c))+(doMes ? ' · '+esc(textoPaga(c)) : '')+'</small></div>'
    + '<span class="'+(c.e ? "pos" : "")+'">'+(c.var ? "≈" : "")+(c.e ? "+" : "")+din(c.v)+'</span></div>';
  const lista = () => {
    if (!S.contasVis.length) return '<p class="nota">Nada ainda. Cadastre renda, luz, internet, salário, prestações…</p>';
    return grupos.map(([nome, filtro], i) => {
      const l = S.contasVis.filter(filtro).sort((a,b) => a.dia - b.dia);
      return l.length ? '<div class="grupo">'+nome+'</div>' + l.map(c => item(c, i === 0)).join("") : "";
    }).join("");
  };
  abrirFolha('<h3>Contas e dívidas</h3><div class="contas-lista" id="cl">'+lista()+'</div>'
    + '<p class="nota" style="margin-top:12px">Toque no nome para ver detalhes ou excluir; no círculo para marcar como paga. Para criar, use o botão amarelo + e escolha “Todo mês” ou “Parcelado”.</p>', f => {
    const ligarLista = () => {
      $$("[data-pagar]", f).forEach(b => b.onclick = () => {
        const c = S.contas.find(x => x.id === b.dataset.pagar);
        // valor variável ou várias datas no mês: abre o detalhe para escolher
        if (c && ((c.var && !c.paga) || (c.ocs || []).length > 1)){ folhaConta(c.id); return; }
        const r = aplicar(ponte.alternarPaga(b.dataset.pagar, "", "")); if (!r.ok) aviso(r.msg);
        vibrar(); $("#cl", f).innerHTML = lista(); ligarLista(); render(false); verificarConquistas();
      });
      $$("[data-abrir-conta]", f).forEach(b => b.onclick = () => folhaConta(b.dataset.abrirConta));
    };
    ligarLista();
  });
}

/* ---------- Premium ---------- */
function alternarPremium(ativo){
  aplicar(ponte.definirPremium(ativo));
  if (!ativo) modo = "total";
  preparar(); vibrar(); render(false);
  aviso(ativo ? "Premium ativado" : "Premium desativado. Seus dados continuam guardados.");
}
function folhaPremium(motivo){
  abrirFolha('<h3>Premium</h3>'+(motivo ? '<p class="nota">'+esc(motivo)+'</p>' : '')
    + '<div class="contas-lista">'
    + '<div class="item"><span style="font-size:1.5rem">🔁</span><div class="info"><b>Contas que se repetem</b><small>Todo mês, a cada 15 dias ou toda semana, com ou sem fim (parceladas)</small></div></div>'
    + '<div class="item"><span style="font-size:1.5rem">💞</span><div class="info"><b>Visão de casal</b><small>Eu, Nós e Total, partilhar lançamentos e acerto de contas</small></div></div>'
    + '</div><p class="nota" style="margin-top:12px">Por enquanto é grátis: basta ativar. Se desativar, nada é apagado; tudo volta quando ativar de novo.</p>'
    + '<button class="btn" id="ativarPremium">Ativar Premium</button>', f => {
    $("#ativarPremium", f).onclick = () => { fecharFolha(); alternarPremium(true); };
  });
}

/* ---------- Referências (e o que evitar) ---------- */
function folhaReferencia(id, evitarInicial){
  const r = id != null ? S.refs.find(x => x.id === id) : null;
  const emojis = ["☕","🚬","🍺","🥤","🍫","🍔","🛵","🎰","⏱","⛽","🧺","📚","🎬","💊"];
  let e = r ? r.e : (evitarInicial ? "🚬" : "☕"), dest = r ? r.dest : !evitarInicial, ev = r ? r.evitar : !!evitarInicial, meta = r ? r.m : "";
  abrirFolha('<h3>'+(r ? "Editar referência" : evitarInicial ? "Algo a evitar" : "Nova referência")+'</h3>'
    + '<div class="chips" id="rE"></div>'
    + '<label class="campo"><span>Nome</span><input id="rN" value="'+(r ? esc(r.n) : "")+'" placeholder="'+(evitarInicial ? "Maço de cigarro" : "Café da manhã (pão, fruta, sumo)")+'"></label>'
    + '<label class="campo"><span>Quanto custa</span><input id="rV" inputmode="decimal" value="'+(r ? String(r.v).replace(".", ",") : "")+'" placeholder="'+(evitarInicial ? "6" : "3,50")+'"></label>'
    + '<div id="rChaves"></div><div id="rDest"></div>'
    + '<button class="btn" id="rSalvar">Salvar</button>' + (r ? '<button class="btn sec" id="rDel" style="color:var(--late)">Excluir referência</button>' : ''), f => {
    const montar = () => {
      $("#rE", f).innerHTML = emojis.map(x => '<button class="chip'+(x === e ? " on" : "")+'" data-e="'+x+'" style="font-size:1.25rem">'+x+'</button>').join("");
      $$("#rE .chip", f).forEach(b => b.onclick = () => { e = b.dataset.e; montar(); });
      $("#rChaves", f).innerHTML = chave("cDest", "Mostrar nos cartões", "Traduz valores nesta referência (até 2)", dest) + chave("cEv", "Quero evitar isto", "Ganha o botão “Evitei” no app, na notificação e no popup", ev);
      $("#cDest", f).onclick = () => { dest = !dest; montar(); };
      $("#cEv", f).onclick = () => { ev = !ev; montar(); };
      $("#rDest", f).innerHTML = ev ? '<div class="rotulo">Para onde vai o valor evitado</div><div class="chips">'
        + '<button class="chip'+(!meta ? " on" : "")+'" data-m="">Só contar</button>'
        + S.metasVis.map(m => '<button class="chip'+(meta === m.id ? " on" : "")+'" data-m="'+m.id+'">'+esc(m.e)+' '+esc(m.n)+'</button>').join("")
        + '</div>' + (S.metasVis.length ? '' : '<p class="nota">Crie um destino (curso, imprevisto…) na aba Trocas para mandar o dinheiro para lá.</p>') : '';
      $$("#rDest .chip", f).forEach(b => b.onclick = () => { meta = b.dataset.m; montar(); });
    };
    montar();
    $("#rSalvar", f).onclick = () => {
      if (!aplicar(ponte.salvarReferencia(r ? r.id : "", $("#rN", f).value, e, $("#rV", f).value, dest, ev, meta)).ok){ aviso("Dê um nome e um valor"); return; }
      vibrar(); fecharFolha(); render(false); verificarConquistas();
    };
    const del = $("#rDel", f); if (del) del.onclick = () => { aplicar(ponte.apagar(r.id)); fecharFolha(); render(false); };
  });
}

/* ---------- Destinos ---------- */
function folhaNovaMeta(){
  let tipo = "j", e = "🎓", sh = modo === "nos";
  const emojis = {j:["🎓","📚","🏖️","✈️","💻","🛟","🏠","🎯"], a:["🔧","🚗","🦷","🏥","💳","📱","🧾","🎯"]};
  abrirFolha('<h3>Novo destino</h3><div class="seg"><button data-t="j">Juntar</button><button data-t="a">Amortizar</button></div>'
    + '<p class="nota" id="mExp"></p><div class="chips" id="mE"></div>'
    + '<label class="campo"><span>Nome</span><input id="mN"></label>'
    + '<label class="campo"><span id="mRot"></span><input id="mA" inputmode="decimal"></label>'
    + '<div id="nosBox"></div><button class="btn" id="salvarMeta">Criar destino</button>', f => {
    const montar = () => {
      $$(".seg button", f).forEach(b => b.classList.toggle("on", b.dataset.t === tipo));
      $("#mExp", f).textContent = tipo === "j" ? "Juntar: o valor sobe até a meta. Ex.: curso de inglês, viagem, reserva." : "Amortizar: um imprevisto ou dívida que você vai pagando aos poucos. Ex.: conserto do carro, dentista.";
      $("#mRot", f).textContent = tipo === "j" ? "Quanto quer juntar" : "Valor total do imprevisto";
      $("#mN", f).placeholder = tipo === "j" ? "Curso de inglês" : "Conserto do carro";
      $("#mA", f).placeholder = tipo === "j" ? "600" : "450";
      if (!emojis[tipo].includes(e)) e = emojis[tipo][0];
      $("#mE", f).innerHTML = emojis[tipo].map(x => '<button class="chip'+(x === e ? " on" : "")+'" data-e="'+x+'" style="font-size:1.25rem">'+x+'</button>').join("");
      $$("#mE .chip", f).forEach(b => b.onclick = () => { e = b.dataset.e; montar(); });
      $("#nosBox", f).innerHTML = chaveNos(sh);
      const sw = $("#swNos", f); if (sw) sw.onclick = () => { sh = !sh; montar(); };
    };
    $$(".seg button", f).forEach(b => b.onclick = () => { tipo = b.dataset.t; montar(); });
    montar();
    $("#salvarMeta", f).onclick = () => {
      if (!aplicar(ponte.adicionarMeta($("#mN", f).value, $("#mA", f).value, e, tipo, sh)).ok){ aviso("Dê um nome e um valor"); return; }
      vibrar(); fecharFolha(); render(true); verificarConquistas();
    };
  });
}
function folhaGuardar(id){
  const m = S.metas.find(x => x.id === id);
  const amort = m.tipo === "a";
  abrirFolha('<h3>'+esc(m.e)+' '+esc(m.n)+'</h3><p class="nota">'+(amort ? "Pago" : "Guardado")+' até agora: '+din(m.atual)+' de '+din(m.alvo)+'. Use um valor negativo para corrigir.'
    + (m.sh && temCasal() ? ' Destino do casal: '+esc(S.parceiro.nome)+' vê este valor.' : '')+'</p>'
    + '<input class="entrada-grande" id="gV" inputmode="decimal" placeholder="50">'
    + '<div class="chips">'+[10,25,50,100].map(v => '<button class="chip" data-v="'+v+'">+ '+din(v)+'</button>').join("")+'</div>'
    + '<button class="btn" id="salvarAporte">'+(amort ? "Registrar pagamento" : "Guardar")+'</button>', f => {
    const inp = $("#gV", f);
    $$("[data-v]", f).forEach(b => b.onclick = () => { inp.value = b.dataset.v; });
    $("#salvarAporte", f).onclick = () => {
      const antes = m.atual >= m.alvo;
      if (!aplicar(ponte.aportarMeta(id, inp.value)).ok){ aviso("Digite um valor"); return; }
      const depois = S.metas.find(x => x.id === id);
      vibrar(); fecharFolha(); render(true);
      if (!antes && depois && depois.atual >= depois.alvo) confete();
      verificarConquistas();
    };
  });
}

/* ================= Início ================= */
$$("nav [data-aba]").forEach(b => b.onclick = () => ir(b.dataset.aba));
$("#fab").onclick = () => { vibrar(); folhaNovo(false); };
$("#miniAv").onclick = () => ir("perfil");

carregar();
extr.ano = MES_ATUAL.ano; extr.mes = MES_ATUAL.mes;
if (RAPIDO){
  document.body.classList.add("rapido");
  folhaNovo(false);
} else {
  render(true);
  setTimeout(verificarConquistas, 900);
}
</script>
</body>
</html>
