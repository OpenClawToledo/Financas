/* ================= Gráfico de linha: quanto ganhei × quanto comprometi (em tempo real) ================= */
let zoomLin = {a: 0, b: 1};   // janela visível do mês (fração de 0 a 1)
function graficoLinha(){
  const {ano, mes} = extr;
  const ini = inicioMes(ano, mes), fim = inicioMes(ano, mes + 1), agora = Date.now(), mesMs = fim - ini;
  const atual = agora >= ini && agora < fim, corte = atual ? agora : (agora >= fim ? fim : ini);
  const real = S.vis.filter(g => g.q >= ini && g.q < fim && g.q <= corte);
  const ev = (lista, tipoR) => lista.filter(g => (g.t === "r") === tipoR).map(g => ({q: g.q, v: g.v})).sort((a,b) => a.q - b.q);
  const gan = ev(real, true), sai = ev(real, false);
  const pend = projetadas(ano, mes).concat(S.fut.filter(g => noMes(g.q, ano, mes)));
  const pe = tipoR => pend.filter(x => (x.t === "r") === tipoR).map(x => ({q: Math.min(Math.max(x.q, corte), fim - 1), v: x.v})).sort((a,b) => a.q - b.q);
  const pg = pe(true), ps = pe(false);
  const soma = l => l.reduce((a,e) => a + e.v, 0);
  const G = soma(gan), C = soma(sai), aReceber = soma(pg), aPagar = soma(ps);
  const topoV = Math.max(G + aReceber, C + aPagar);
  if (!topoV) return {svg:'<p class="nota" style="margin:18px 0;text-align:center">Sem movimentos neste mês ainda.</p>', ler:""};
  const zoomado = zoomLin.b - zoomLin.a < 0.999;
  const qa = ini + zoomLin.a * mesMs, qb = ini + zoomLin.b * mesMs;
  const cumAt = (l, t) => soma(l.filter(e => e.q <= t));
  const Gt = t => cumAt(gan, t) + (t > corte ? cumAt(pg, t) : 0), Ct = t => cumAt(sai, t) + (t > corte ? cumAt(ps, t) : 0);
  // no zoom a escala vertical acompanha o trecho visível
  let vmin = zoomado ? Math.min(Gt(qa), Ct(qa)) : 0, vmax = zoomado ? Math.max(Gt(qb), Ct(qb)) : topoV;
  if (vmax - vmin < 1){ vmax = vmin + 1; }
  const passo = passoEixo((vmax - vmin) / 2.5), base = Math.floor(vmin / passo) * passo, topo = Math.ceil(vmax / passo) * passo + (zoomado ? 0 : 0);
  const W = 320, H = 168, x0 = 30, xf = 312, y0 = 140, alt = 118;
  const X = q => x0 + (q - qa) / (qb - qa) * (xf - x0), Y = v => y0 - (v - base) / ((topo - base) || 1) * alt;
  const pontos = (evs, b0, ti, tf) => { let c = b0; const p = [[ti, c]]; evs.forEach(e => { c += e.v; p.push([e.q, c]); }); p.push([tf, c]); return p; };
  const caminho = p => p.map((q, i) => (i ? "L" : "M") + X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1)).join("");
  const pG = pontos(gan, 0, ini, corte), pC = pontos(sai, 0, ini, corte);
  const pGp = pontos(pg, G, corte, fim), pCp = pontos(ps, C, corte, fim);
  let h = '<defs><clipPath id="clipLin"><rect x="'+x0+'" y="'+(y0-alt-10)+'" width="'+(xf-x0)+'" height="'+(alt+12)+'"/></clipPath></defs>';
  for (let t = base; t <= topo + 0.001; t += passo) h += '<line class="eixo" x1="'+x0+'" x2="'+xf+'" y1="'+Y(t)+'" y2="'+Y(t)+'" style="opacity:'+(t > base ? .5 : 1)+'"/><text x="'+(x0-6)+'" y="'+(Y(t)+3)+'" text-anchor="end">'+compacto(t)+'</text>';
  // datas no eixo: dias (ou horas quando o zoom é grande)
  const n = new Date(ano, mes + 1, 0).getDate(), spanDias = (qb - qa) / 864e5;
  if (spanDias <= 2.2){
    const passoH = spanDias <= 0.6 ? 3 : 6;
    for (let t = Math.ceil(qa / 36e5 / passoH) * passoH * 36e5; t <= qb; t += passoH * 36e5){
      const d = new Date(t); h += '<text x="'+X(t)+'" y="'+(y0+14)+'" text-anchor="middle">'+(d.getHours() === 0 ? d.getDate() + "/" + (d.getMonth() + 1) : d.getHours() + "h")+'</text>';
    }
  } else {
    const k = spanDias > 20 ? 7 : spanDias > 10 ? 3 : spanDias > 5 ? 2 : 1;
    for (let d = 1; d <= n; d++){
      const t = new Date(ano, mes, d, 12).getTime();
      if (t < qa || t > qb) continue;
      if (zoomado ? (d - 1) % k === 0 : [1, 8, 15, 22, n].includes(d)) h += '<text x="'+X(t)+'" y="'+(y0+14)+'" text-anchor="middle">'+d+'</text>';
    }
  }
  h += '<g clip-path="url(#clipLin)"><path d="'+caminho(pG)+'L'+X(corte)+' '+Y(base)+'L'+X(ini)+' '+Y(base)+'Z" fill="var(--ok)" opacity=".10"/>'
    + '<path class="lin-p" d="'+caminho(pGp)+'" stroke="var(--ok)"/><path class="lin-p" d="'+caminho(pCp)+'" stroke="var(--late)"/>'
    + '<path class="lin" d="'+caminho(pG)+'" stroke="var(--ok)"/><path class="lin" d="'+caminho(pC)+'" stroke="var(--late)"/>';
  if (atual) h += '<line class="lin-agora" x1="'+X(agora)+'" x2="'+X(agora)+'" y1="'+(y0-alt-4)+'" y2="'+y0+'"/>';
  h += '<circle cx="'+X(corte)+'" cy="'+Y(G)+'" r="3.5" fill="var(--ok)"/><circle cx="'+X(corte)+'" cy="'+Y(C)+'" r="3.5" fill="var(--late)"/>';
  // pontos de cada lançamento quando há zoom
  if (zoomado){
    gan.forEach((e, i) => { if (e.q >= qa && e.q <= qb) h += '<circle cx="'+X(e.q)+'" cy="'+Y(cumAt(gan, e.q))+'" r="2.4" fill="var(--ok)"/>'; });
    sai.forEach(e => { if (e.q >= qa && e.q <= qb) h += '<circle cx="'+X(e.q)+'" cy="'+Y(cumAt(sai, e.q))+'" r="2.4" fill="var(--late)"/>'; });
  }
  h += '</g>';
  if (atual && agora >= qa && agora <= qb) h += '<text x="'+X(agora)+'" y="'+(y0-alt-7)+'" text-anchor="middle" style="fill:var(--text)">agora</text>';
  // toque por dia
  const dados = [];
  for (let d = 1; d <= n; d++){
    const t0 = new Date(ano, mes, d).getTime(), t1 = Math.min(new Date(ano, mes, d, 23, 59, 59).getTime(), fim - 1), prev = t1 > corte;
    const g = Gt(t1), c = Ct(t1);
    dados.push('<b>Dia '+d+'</b>'+(prev ? ' (previsto)' : '')+': ganhei '+din(g)+' · comprometi '+din(c)+' · <b class="'+(g - c < 0 ? "neg" : "pos")+'">'+sdin(g - c)+'</b>');
    const xa = Math.max(X(t0), x0), xb = Math.min(X(t1 + 1), xf);
    if (xb - xa > 1) h += '<rect data-v="'+(d-1)+'" x="'+xa+'" y="'+(y0-alt-4)+'" width="'+(xb-xa)+'" height="'+(alt+4)+'" fill="transparent"/>';
  }
  const perto = (a, b) => Math.abs(zoomLin.a - a) < .004 && Math.abs(zoomLin.b - b) < .004;
  const zb = (k, t, on) => '<button data-z="'+k+'" class="'+(on ? "on" : "")+'">'+t+'</button>';
  const comp = C + aPagar, tt = tempoTrabalho(comp), sep = separadoMes(ano, mes);
  const ler = 'Ganhei <b class="pos">'+din(G)+'</b>'+(aReceber ? ' <small>(+'+din(aReceber)+' a receber)</small>' : '')
    + ' · Comprometi <b class="neg">'+din(comp)+'</b> <small>(saiu '+din(C)+(aPagar ? ' + '+din(aPagar)+' pendente' : '')+')</small>'
    + '<br>Sobra <b class="'+(G + aReceber - comp < 0 ? "neg" : "pos")+'">'+sdin(G + aReceber - comp)+'</b>'
    + (tt ? ' · comprometeu <b>'+tt+'</b> do seu trabalho' : '') + (sep ? ' · separado em metas/reserva: '+din(sep) : '');
  const leg = '<div class="graf-leg"><span><i style="background:var(--ok)"></i>Ganhei</span><span><i style="background:var(--late)"></i>Comprometi</span><span><i class="trac"></i>Pendente</span></div>'
    + '<div class="graf-zoom">'+zb("-", "−", false)+zb("+", "+", false)+zb("mes", "Mês", !zoomado)+zb("sem", "7 dias", false)+zb("hoje", "Hoje", false)+'<small>'+(zoomado ? "arraste para andar" : "pinça para aproximar")+'</small></div>';
  return {svg: '<svg id="svgLin" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ganhei e comprometi ao longo do mês">'+h+'</svg>'+leg, dados, ler};
}

// ----- zoom: pinça, arrastar e botões -----
const ZOOM_MIN = 0.02;
function ajustarZoom(a, b){
  let span = Math.min(1, Math.max(ZOOM_MIN, b - a));
  a = Math.min(Math.max(0, a), 1 - span);
  zoomLin = {a, b: a + span};
}
function refazerLinha(){
  const g = $("#graf"), svg = $("#svgLin", g); if (!svg) return;
  grafAtual = graficoLinha();
  const t = document.createElement("div"); t.innerHTML = grafAtual.svg;
  const novo = $("#svgLin", t); if (!novo) return;
  svg.innerHTML = novo.innerHTML;
  $$(".graf-zoom", g).forEach(z => z.replaceWith($(".graf-zoom", t)));
  ligarToques(g); ligarBotoesZoom(g);
}
function zoomPara(fator, centroFrac){
  const span = zoomLin.b - zoomLin.a, c = centroFrac == null ? (zoomLin.a + zoomLin.b) / 2 : centroFrac;
  const ns = Math.min(1, Math.max(ZOOM_MIN, span * fator)), rel = (c - zoomLin.a) / span;
  ajustarZoom(c - rel * ns, c - rel * ns + ns);
}
function ligarBotoesZoom(g){
  const {ano, mes} = extr, n = new Date(ano, mes + 1, 0).getDate(), dia = 1 / n;
  const ini = inicioMes(ano, mes), fim = inicioMes(ano, mes + 1), agora = Date.now();
  const fr = agora >= ini && agora < fim ? (agora - ini) / (fim - ini) : 0;
  $$("[data-z]", g).forEach(b => b.onclick = e => {
    e.stopPropagation(); const k = b.dataset.z;
    const agoraFr = (zoomLin.a <= fr && fr <= zoomLin.b) ? fr : null;
    if (k === "+") zoomPara(0.5, agoraFr);
    else if (k === "-") zoomPara(2, agoraFr);
    else if (k === "mes") ajustarZoom(0, 1);
    else if (k === "sem") ajustarZoom(fr - 3.5 * dia, fr + 3.5 * dia);
    else if (k === "hoje"){ const i0 = Math.floor(fr * n) * dia; ajustarZoom(i0, i0 + dia); }
    vibrar(); refazerLinha();
  });
}
let movidoGraf = false;
function ligarGestosLinha(g){
  const svg = $("#svgLin", g); if (!svg || svg.dataset.gestos) return;
  svg.dataset.gestos = "1"; svg.style.touchAction = "none";
  const pts = new Map(); let ref = null;
  const larg = () => svg.getBoundingClientRect().width * (282 / 320);
  const dist = () => { const [p, q] = [...pts.values()]; return Math.hypot(p.x - q.x, p.y - q.y); };
  const cf = () => { const [p, q] = [...pts.values()]; const r = svg.getBoundingClientRect(); return Math.min(1, Math.max(0, ((p.x + q.x) / 2 - r.left - r.width * 30 / 320) / larg())); };
  svg.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY}); movidoGraf = false;
    ref = pts.size === 2 ? {d: dist(), z: {...zoomLin}, c: cf()} : {x: e.clientX, z: {...zoomLin}};
  });
  svg.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size >= 2 && ref && ref.d){
      movidoGraf = true;
      const span0 = ref.z.b - ref.z.a, ns = Math.min(1, Math.max(ZOOM_MIN, span0 * ref.d / Math.max(dist(), 1)));
      const abs = ref.z.a + ref.c * span0; ajustarZoom(abs - ref.c * ns, abs - ref.c * ns + ns); refazerLinha();
    } else if (pts.size === 1 && ref && ref.x != null){
      const dx = e.clientX - ref.x;
      if (Math.abs(dx) > 6) movidoGraf = true;
      if (movidoGraf && ref.z.b - ref.z.a < 0.999){
        const span = ref.z.b - ref.z.a; ajustarZoom(ref.z.a - dx / larg() * span, ref.z.a - dx / larg() * span + span); refazerLinha();
      }
    }
  });
  const fim = e => { pts.delete(e.pointerId); ref = pts.size === 1 ? {x: [...pts.values()][0].x, z: {...zoomLin}} : null; };
  svg.addEventListener("pointerup", fim); svg.addEventListener("pointercancel", fim);
}

const DIA_INI = 7, DIA_FIM = 23;   // horas acordado

function lerPrefTema(){ try { return localStorage.getItem("fin.tema") || "escuro"; } catch(e){ return "escuro"; } }

const valorHora = () => { const r = (S.refs || []).find(x => /hora/i.test(x.n) && x.v > 0); return r ? r.v : 0; };
function tempoTrabalho(v){
  const vh = valorHora(); if (!vh || !v) return "";
  const min = Math.round(v / vh * 60);
  if (min < 1) return "menos de 1 min";
  if (min < 60) return min+" min";
  const h = Math.floor(min / 60), m = min % 60;
  return h+"h"+(m ? String(m).padStart(2, "0") : "");
}
const horaTxt = hf => { const h = Math.floor(hf), m = Math.round((hf - h) * 60); return (m === 60 ? h+1 : h)+"h"+String(m === 60 ? 0 : m).padStart(2, "0"); };
function numerosHoje(){
  const n = numerosMes();
  const ag = new Date(), ini = new Date(ag.getFullYear(), ag.getMonth(), ag.getDate()).getTime();
  const hoje = S.desp.filter(g => g.q >= ini && g.q <= Date.now() && !g.cf);
  const gasto = hoje.reduce((a, g) => a + g.v, 0);
  const temEntradas = n.entrou > 0 || S.contasMes.some(c => c.e);
  const diasRest = S.diasNoMes - S.hoje + 1;
  // o que sobra do mês depois das contas ainda por pagar, repartido pelos dias que faltam (hoje incluído)
  const disponivel = n.livre + n.aReceber - n.compMes + gasto;
  const orc = temEntradas ? Math.max(0, disponivel / diasRest) : 0;
  const hAgora = ag.getHours() + ag.getMinutes() / 60;
  const horasPassadas = Math.max(0.5, Math.min(DIA_FIM, hAgora) - DIA_INI);
  const ritmo = hAgora > DIA_INI ? gasto / horasPassadas : 0;          // € por hora até agora
  const resta = orc - gasto;
  let fim = null;                                                        // hora em que o dinheiro de hoje acaba
  if (ritmo > 0 && resta > 0) fim = Math.min(24, Math.max(hAgora, DIA_INI) + resta / ritmo);
  const porCat = {};
  hoje.forEach(g => porCat[catPai(g.c)] = (porCat[catPai(g.c)] || 0) + g.v);
  return {temEntradas, orc, gasto, resta, ritmo, fim, hAgora, diasRest, porCat, qtd: hoje.length};
}

/* ================= Extrato ================= */
function projetadas(a, m){
  const atual = a === MES_ATUAL.ano && m === MES_ATUAL.mes;
  const futuro = inicioMes(a, m) > inicioMes(MES_ATUAL.ano, MES_ATUAL.mes);
  if (!atual && !futuro) return [];
  const lista = [];
  S.contasVis.forEach(c => {
    const pagas = atual ? new Set((c.ocs || []).filter(o => o.paga).map(o => o.chave)) : new Set();
    ocorrencias(c, a, m).filter(o => !pagas.has(o.chave)).forEach(o => lista.push({prev:true, id:c.id, chave:o.chave, q:new Date(o.d.getFullYear(), o.d.getMonth(), o.d.getDate(), 12).getTime(), v:c.v,
      d:c.n + (c.vezes > 1 ? " ("+o.n+"/"+c.vezes+")" : "") + (c.var ? " ≈" : ""),
      c:c.c || (c.e ? (/sal[aá]rio|ordenado|vencimento/i.test(c.n) ? "Receitas › Salário" : OUTRAS_REC) : "Casa"),
      t:c.e ? "r" : "d", dono:c.dono, sh:c.sh}));
  });
  return lista;
}

const doMesExtrato = () => S.vis.filter(g => noMes(g.q, extr.ano, extr.mes)).concat(projetadas(extr.ano, extr.mes));
function linhaExtrato(x){
  const d = new Date(x.q); const [emoji, cor] = cat(x.c); const r = x.t === "r";
  const quem = temCasal() ? ' · '+esc(nomeDe(x.dono))+(x.sh ? ' · Nós' : '') : '';
  return '<button class="row'+(x.prev ? " prevista" : "")+'" '+(x.prev ? 'data-conta="'+x.id+'"' : 'data-abrircat="'+x.id+'"')+'>'
    + '<span class="data"><b>'+d.getDate()+'</b><small>'+MESES[d.getMonth()]+'</small></span>'
    + '<span class="av" style="--c:'+cor+'">'+emoji+'</span>'
    + '<span class="info"><b>'+esc(x.d)+'</b><small>'+esc(catNome(x.c))+(x.prev ? " · prevista" : "")+quem+'</small></span>'
    + '<span class="v'+(r ? " pos" : "")+'">'+(r ? "+" : "−")+din(x.v)+'</span></button>';
}
function listaExtrato(todos){
  let l = todos.filter(passaFiltro);
  if (extr.ordem === "valor") l.sort((a,b) => b.v - a.v);
  else if (extr.ordem === "cat") l.sort((a,b) => a.c.localeCompare(b.c) || b.q - a.q);
  else l.sort((a,b) => b.q - a.q);
  if (!l.length) return '<div class="vazio">'+(extr.busca.trim() || extr.tipo !== "todas" ? "Nada encontrado com esses filtros." : "Nada neste mês.")+'</div>';
  return l.map(linhaExtrato).join("");
}

/* ================= Trocas e destinos ================= */
function telaTrocas(){
  const mesT = S.trocas.filter(t => noMes(t.q, MES_ATUAL.ano, MES_ATUAL.mes));
  let h = '<p class="nota">Deixou de comprar algo? Registre a troca e o valor vai para um destino: juntar para um curso ou viagem, ou abater um imprevisto. '
    + 'O valor evitado não entra nos totais do mês: aparece só na barra do destino.'
    + (temCasal() ? ' As trocas são só suas; num destino do casal, só aparece o valor guardado.' : '') + '</p>';

  const evitar = S.refs.filter(r => r.evitar);
  h += '<h3 class="h3">O que quero evitar</h3>';
  if (!evitar.length) h += '<p class="nota">Exemplo: maço de cigarro, 6 €. Cada vez que não comprar, toque em “Evitei” (aqui, na notificação ou no popup ao agitar).</p>';
  evitar.forEach(r => {
    const doMes = mesT.filter(t => t.r === r.id);
    h += '<div class="cartao"><div class="top" data-editar-ref="'+r.id+'"><span class="emo">'+esc(r.e)+'</span><div><b>'+esc(r.n)+'</b><small>'+din(r.v)+' → '+destinoTexto(r.m)+'</small></div>'
      + '<span class="pct">'+doMes.length+'×</span></div>'
      + '<button class="evitar-btn" data-evitei="'+r.id+'">Evitei agora</button></div>';
  });
  h += '<button class="btn sec" data-nova-ref="evitar">Adicionar algo a evitar</button>';

  h += '<h3 class="h3">Destinos</h3>';
  if (!S.metasVis.length) h += '<p class="nota">Crie um destino para onde o dinheiro poupado vai: um curso, uma viagem ou um imprevisto que está pagando aos poucos.</p>';
  S.metasVis.forEach(m => {
    const f = Math.min(1, m.atual / m.alvo);
    const falta = Math.max(0, m.alvo - m.atual);
    const amort = m.tipo === "a";
    // parte que veio das minhas trocas (listrada na barra); o resto é dinheiro guardado
    const viaTrocas = Math.min(m.atual, S.trocas.filter(t => t.m === m.id).reduce((a,t) => a + t.v, 0));
    const fTr = Math.min(f, viaTrocas / m.alvo), fReal = f - fTr;
    h += '<div class="cartao'+(amort ? " amortizar" : "")+(f >= 1 ? " feita" : "")+'" data-meta="'+m.id+'"><div class="top"><span class="emo">'+esc(m.e)+'</span>'
      + '<div><b>'+esc(m.n)+'<span class="tipo-tag">'+(amort ? "Amortizar" : "Juntar")+'</span>'+(m.sh ? '<span class="nos-tag">Nós</span>' : '')+'</b><small>'+(amort ? "Pago " : "")+din(m.atual)+' de '+din(m.alvo)+'</small></div><span class="pct">'+Math.round(f*100)+'%</span></div>'
      + '<div class="trilho"><i data-f="'+fReal+'"></i><i class="tr" data-f="'+fTr+'"></i></div>'
      + (viaTrocas > 0 ? '<div class="leg-meta"><span><i></i>'+(amort ? "Pago" : "Guardado")+' '+din(m.atual - viaTrocas)+'</span><span><i class="tr"></i>Trocas '+din(viaTrocas)+'</span></div>' : '')
      + '<p class="nota" style="margin:0 0 12px">'+(f >= 1 ? (amort ? "Quitado." : "Meta concluída.") : "Faltam "+din(falta)+(amort ? " para quitar" : "")+(equivTexto(falta) ? ", ou "+esc(equivTexto(falta)) : "")+".")+'</p>'
      + '<div class="acoes"><button data-guardar>'+(amort ? "Pagar parte" : "Guardar")+'</button>'+(meu(m) ? '<button data-apagar-meta>Excluir</button>' : '')+'</div></div>';
  });
  h += '<button class="btn" data-nova-meta>Novo destino</button>';

  h += '<h3 class="h3">Minhas referências</h3><p class="nota">É com elas que o app traduz valores. As marcadas com contorno aparecem nos cartões (até 2).</p><div class="refs">';
  S.refs.forEach(r => { h += '<button class="ref'+(r.dest ? " dest" : "")+'" data-editar-ref="'+r.id+'">'+esc(r.e)+' '+esc(r.n)+' · '+din(r.v)+'</button>'; });
  h += '<button class="ref" data-nova-ref="">+ Nova</button></div>';
  return h;
}

function folhaFeedback(){
  let tipo = "Sugestão";

    const tipos = () => { $("#fbTipos", f).innerHTML = TIPOS.map(t => '<button class="chip'+(t === tipo ? " on" : "")+'" data-t="'+t+'">'+t+'</button>').join("");
      $$("[data-t]", f).forEach(b => b.onclick = () => { tipo = b.dataset.t; tipos(); }); };
    tipos();

      const t = $("#fbTexto", f).value.trim();

/* ================= Ligações de eventos ================= */
function ligar(animar){
  ligarInicio(animar);
  ligarResto();
}
function ligarInicio(animar){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$(".trilho i[data-f]").forEach(i => i.style.width = (parseFloat(i.dataset.f)*100) + "%");
    $$(".fluxo i[data-w], .rel-barra i[data-w]").forEach(i => i.style.width = (parseFloat(i.dataset.w)*100) + "%");
  }));
  const tot = $("[data-contar]");
  if (tot && animar) contar(tot, parseFloat(tot.dataset.contar));

  $$("[data-modo]").forEach(b => b.onclick = () => { modo = b.dataset.modo; preparar(); vibrar(); render(true); });

  const heroi = $(".heroi");
  if (heroi && "IntersectionObserver" in window){
    new IntersectionObserver(es => es.forEach(e => heroi.classList.toggle("parado", !e.isIntersecting))).observe(heroi);
  }
  ligarPosts();
  animarAoRolar();
  ligarGrafico();
  $$("[data-vista]").forEach(b => b.onclick = () => { vista = b.dataset.vista; gravarPref("vista", vista); render(false); });
  const mais = $("#verMais"); if (mais) mais.onclick = () => { limitePosts += 40; render(false); };
}
function ligarPosts(){
  $$(".post[data-id]").forEach(el => {
    const id = el.dataset.id, corpo = $(".corpo", el), alheio = !!el.dataset.alheio;
    gestos(corpo, {
      aoApagar: alheio ? null : () => apagarGasto(id),
      aoToqueDuplo: () => { mostrarCoracao(corpo); const g = achar(id); if (g && !g.l) curtir(id); },
      aoToque: () => folhaDetalhe(id),
      aoSegurar: () => alheio ? folhaDetalhe(id) : editarNoCartao(el, id)
    });
    $("[data-curtir]", el).onclick = () => curtir(id);
    $("[data-comentar]", el).onclick = () => folhaComentarios(id);
    $("[data-cat]", el).onclick = () => alheio ? folhaDetalhe(id) : folhaCategoria(id);
  });
}
function ligarResto(){
  $$("[data-conta]").forEach(ligarPrevista);
  $$("[data-pag]").forEach(b => b.onclick = () => {
    const k = b.dataset.pag;
    if (k === "feedback"){ folhaFeedback(); return; }
    perfilPag = k; window.scrollTo(0, 0); render(false);
  });
  const pv = $("#pagVoltar"); if (pv) pv.onclick = () => { perfilPag = null; render(false); };
  ligarCategorias(); ligarCarteiras();
  $$("[data-vpad]").forEach(b => b.onclick = () => { vista = b.dataset.vpad; gravarPref("vista", vista); render(false); });
  $$("[data-gpad]").forEach(b => b.onclick = () => { grafVista = b.dataset.gpad; gravarPref("graf", grafVista); render(false); });
  $$("[data-fundo]").forEach(b => b.onclick = () => { fundoTema = b.dataset.fundo; gravarPref("fundoTema", fundoTema); aplicarTema(); vibrar(); render(false); });
  $$("[data-tema]").forEach(b => b.onclick = () => { tema = b.dataset.tema; gravarPref("tema", tema); aplicarTema(); vibrar(); render(false); });
  const rh = $("#relHoraOk"); if (rh) rh.onclick = () => {
    const v = $("#relHora").value;
    const r = aplicar(ponte.salvarReferencia("", "Hora de trabalho", "⏱", v, false, false, ""));
    if (!r.ok){ aviso("Escreva quanto vale uma hora, ex.: 7,50"); return; }
    vibrar(); render(false); aviso("Guardado: agora cada gasto mostra o tempo de trabalho");
  };
  $$("[data-mpad]").forEach(b => b.onclick = () => { gravarPref("modo", b.dataset.mpad); modo = b.dataset.mpad; preparar(); render(false); });
  $$("[data-nova-entrada]").forEach(b => b.onclick = () => folhaNovo(true));

  // meses, filtros e busca
  $$("[data-mes]").forEach(b => b.onclick = () => { const [a, m] = b.dataset.mes.split("-").map(Number); extr.ano = a; extr.mes = m; render(false); });
  const meses = $("#meses"); if (meses){ const on = $(".mes-chip.on", meses); if (on) meses.scrollLeft = on.offsetLeft - meses.clientWidth/2 + on.clientWidth/2; }
  $$("[data-tipo]").forEach(b => b.onclick = () => { extr.tipo = b.dataset.tipo; render(false); });
  $$("[data-ordem]").forEach(b => b.onclick = () => { extr.ordem = b.dataset.ordem; render(false); });
  const busca = $("#busca");
  if (busca) busca.oninput = () => { extr.busca = busca.value; limitePosts = 40; $("#listaExtrato").innerHTML = listaAtual(); ligarPosts(); ligarLista(); };
  ligarLista();

  // trocas e destinos

/* Linha "prevista" (vem de uma conta que se repete): tocar abre a conta, segurar edita a conta.
   Não tem Editar/Duplicar/Comentários/Apagar: não é um lançamento, é a conta. */
function ligarPrevista(b){
  if (b.dataset.ligada) return; b.dataset.ligada = "1";
  let t = null, segurou = false, x0 = 0, y0 = 0;
  const parar = () => { clearTimeout(t); t = null; b.classList.remove("segurando"); };
  b.addEventListener("contextmenu", e => e.preventDefault());
  b.addEventListener("pointerdown", e => {
    segurou = false; x0 = e.clientX; y0 = e.clientY;
    t = setTimeout(() => { t = null; segurou = true; vibrar(); folhaEditarConta(b.dataset.conta); }, 480);
  });
  b.addEventListener("pointermove", e => { if (t && (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10)) parar(); });
  b.addEventListener("pointerup", parar);
  b.addEventListener("pointercancel", parar);
  b.onclick = e => { if (segurou){ e.preventDefault(); segurou = false; return; } folhaConta(b.dataset.conta); };
}
function ligarLista(){
  $$("[data-abrir]").forEach(b => b.onclick = () => folhaDetalhe(b.dataset.abrir));
  $$("#listaExtrato [data-conta]").forEach(ligarPrevista);
}
function contar(el, alvo){
  const t0 = performance.now(), dur = 900;
  const passo = t => { const k = Math.min(1, (t-t0)/dur); const e = 1 - Math.pow(1-k, 3); el.textContent = din(alvo*e); if (k < 1) requestAnimationFrame(passo); };
  requestAnimationFrame(passo);
}

/* ================= Segurar o cartão: tudo vira editável ali mesmo ================= */
function editarNoCartao(el, id){
  const g = achar(id); if (!g || !meu(g)) return;
  if ($(".corpo.editando")){ render(false); el = $('.post[data-id="'+id+'"]'); if (!el) return; }
  const corpo = $(".corpo", el);
  let receita = g.t === "r", escolhida = g.c, sh = !!g.sh;
  let v = String(g.v).replace(".", ","), d = g.d, dt = isoData(g.q);
  // lançamento de uma conta que se repete: escolher se a mudança vale só aqui ou também daqui para frente
  const conta = contaDaSerie(g);
  const podeSerie = conta && meu(conta);
  let escopo = "este";
  corpo.style.transform = ""; corpo.classList.add("editando");
  const notaEscopo = () => {
    if (!conta) return "";
    if (escopo === "este") return "Muda só este lançamento. <b>A conta e as próximas datas continuam iguais.</b>";
    const mensal = !conta.freq || conta.freq === "m";
    const vs = String(v).trim(), nv = parseFloat(vs.includes(",") ? vs.replace(/\./g, "").replace(",", ".") : vs), mud = [];
    if (nv > 0 && Math.abs(nv - conta.v) >= 0.005) mud.push("valor <b>"+din(nv)+"</b>");
    const nome = serieNome(d);
    if (nome && nome !== conta.n) mud.push("nome <b>"+esc(nome)+"</b>");
    if (escolhida !== (conta.c || "")) mud.push("categoria <b>"+esc(catNome(escolhida))+"</b>");
    const dia = dt ? +dt.split("-")[2] : 0;
    const mudaDia = dia && dia !== new Date(g.q).getDate();
    if (mudaDia && mensal) mud.push("todo dia <b>"+dia+"</b>");
    return (mud.length ? "Daqui para frente: "+mud.join(", ")+"." : "Nada muda nas próximas ainda.")
      + (mudaDia && !mensal ? " A data das próximas não muda (conta "+(conta.freq === "q" ? "quinzenal" : "semanal")+"); só a deste." : "")
      + " <b>Os lançamentos anteriores ficam como estão.</b>";
  };
  const atualizarNota = () => { const n = $(".nota-esc", corpo); if (n) n.innerHTML = notaEscopo(); };
  const desenhar = () => {
    const [emoji, cor] = cat(escolhida);
    corpo.innerHTML = '<div class="ed-topo"><span class="av" style="--c:'+cor+'">'+emoji+'</span>'
      + '<div class="seg"><button data-r="0" class="'+(receita ? "" : "on")+'">Saída</button><button data-r="1" class="'+(receita ? "on" : "")+'">Entrada</button></div>'
      + '<button class="tag" style="--c:'+cor+'" data-ed-cat>'+esc(catNome(escolhida))+'</button></div>'
      + (conta ? '<div class="ed-escopo"><small>🔁 Faz parte de “'+esc(conta.n)+'” · '+esc(descConta(conta))+'</small>'
        + (podeSerie ? '<div class="seg"><button data-esc="este" class="'+(escopo === "este" ? "on" : "")+'">Só este</button><button data-esc="prox" class="'+(escopo === "prox" ? "on" : "")+'">Este e os próximos</button></div>' : '')
        + '<span class="nota-esc">'+(podeSerie ? notaEscopo() : "Só quem criou a conta pode mudar as próximas; aqui muda só este lançamento.")+'</span></div>' : '')

/* ================= Curtidas e comentários animados ao rolar ================= */
const COM_VISTOS = (() => { try { return new Set(JSON.parse(localStorage.getItem("fin.comVistos") || "[]")); } catch(e){ return new Set(); } })();
function marcarVisto(k){
  COM_VISTOS.add(k);
  try { localStorage.setItem("fin.comVistos", JSON.stringify([...COM_VISTOS].slice(-400))); } catch(e){}
}
let obsFeed = null;
function animarAoRolar(){
  if (obsFeed){ obsFeed.disconnect(); obsFeed = null; }
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  obsFeed = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    obsFeed.unobserve(e.target);
    const cur = $(".acao.curtido", e.target);
    if (cur){ cur.classList.remove("ao-ver"); void cur.offsetWidth; cur.classList.add("ao-ver"); }
    const p = $(".ultimo-com[data-com]", e.target);
    if (p && p.dataset.pendente != null) digitar(p);
  }), {threshold: .6});
  $$(".post[data-id]").forEach(el => {
    const p = $(".ultimo-com[data-com]", el);
    if (p && !COM_VISTOS.has(p.dataset.com)){
      // comentário novo: fica em branco e é digitado letra a letra quando o cartão aparecer
      const tx = $(".tx", p);
      p.style.minHeight = p.offsetHeight + "px";
      p.dataset.pendente = tx.textContent; tx.textContent = ""; p.classList.add("digitando");
    }
    obsFeed.observe(el);
  });
}
function digitar(p){
  const tx = $(".tx", p), letras = [...p.dataset.pendente];
  delete p.dataset.pendente;
  marcarVisto(p.dataset.com);
  const passo = Math.max(18, Math.min(55, 1400 / Math.max(letras.length, 1)));
  let i = 0;
  const t = setInterval(() => {
    if (!p.isConnected){ clearInterval(t); return; }
    tx.textContent = letras.slice(0, ++i).join("");
    if (i >= letras.length){ clearInterval(t); p.classList.remove("digitando"); p.classList.add("postou"); p.style.minHeight = ""; }
  }, passo);
}

/* Roda de rolagem: itens [{v, t}]; aoMudar(v) quando o item do centro muda. */
function roda(el, itens, marcada, aoMudar){
  const H = 44;
  el.classList.add("roda");
  el.innerHTML = '<div class="roda-lista"><div class="roda-esp"></div>'
    + itens.map((it, i) => '<div class="roda-it" data-i="'+i+'">'+it.t+'</div>').join("") + '<div class="roda-esp"></div></div>';
  const L = el.firstChild, els = $$(".roda-it", el);
  let atual = Math.max(0, itens.findIndex(it => it.v === marcada));
  const marcar = i => els.forEach((d, k) => d.classList.toggle("on", k === i));
  const posicionar = () => { L.scrollTop = atual * H; };
  marcar(atual); posicionar(); requestAnimationFrame(posicionar);
  L.onscroll = () => {
    const i = Math.min(itens.length - 1, Math.max(0, Math.round(L.scrollTop / H)));
    if (i === atual) return;
    atual = i; marcar(i); vibrar(); aoMudar(itens[i].v);
  };
  els.forEach(d => d.onclick = () => L.scrollTo({top: +d.dataset.i * H, behavior: "smooth"}));
  return { texto: (i, t) => { if (els[i]) els[i].innerHTML = t; } };
}

/* ---------- Voz: números por extenso junto da moeda ("cinco euros e cinquenta") ---------- */
const NUM_PAL = {zero:0,um:1,uma:1,dois:2,duas:2,"três":3,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,
  catorze:14,quatorze:14,quinze:15,dezasseis:16,dezesseis:16,dezassete:17,dezessete:17,dezoito:18,dezanove:19,dezenove:19,vinte:20,trinta:30,
  quarenta:40,cinquenta:50,"cinqüenta":50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,
  quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900,mil:1000};
const MOEDA_PAL = /^(€|euros?|reais|real|cêntimos?|centimos?|centavos?)$/i;
function falaParaTexto(t){
  let s = String(t || "").trim(), mais = /^mais\s+/i.test(s);
  if (mais) s = s.replace(/^mais\s+/i, "");
  const pal = s.split(/\s+/), saida = [];
  for (let i = 0; i < pal.length; ){
    // junta uma sequência de números por extenso ("vinte e cinco")
    let j = i, total = 0, atual = 0, achou = false;
    while (j < pal.length){
      const w = pal[j].toLowerCase();
      if (NUM_PAL[w] !== undefined){ achou = true; if (w === "mil"){ total += (atual || 1) * 1000; atual = 0; } else atual += NUM_PAL[w]; j++; }
      else if (achou && w === "e" && j + 1 < pal.length && NUM_PAL[pal[j+1].toLowerCase()] !== undefined) j++;
      else break;
    }
    const depoisMoeda = j < pal.length && MOEDA_PAL.test(pal[j]);
    const antesMoeda = saida.length >= 2 && saida[saida.length-1].toLowerCase() === "e" && MOEDA_PAL.test(saida[saida.length-2]);
    if (achou && (depoisMoeda || antesMoeda)){ saida.push(String(total + atual)); i = j; }
    else { saida.push(pal[i]); i++; }
  }
  return (mais ? "+" : "") + saida.join(" ");
}

      $$(".seg button", f).forEach(b => b.classList.toggle("on", (b.dataset.r === "1") === receita));
      inp.placeholder = receita ? "1090 salário" : quando === "repetir" ? "400 renda" : "5,50 café";
      ligarChipsCat(f, "chipsCat", "chipsSub", () => receita, () => escolhida, v => { escolhida = v; previa(); }, true);
      $("#nosBox", f).innerHTML = chaveNos(sh);
      const sw = $("#swNos", f); if (sw) sw.onclick = () => { sh = !sh; montar(); };
      montarQuando();
      previa();
    };
    const previa = () => {
      const d = valorDigitado();
      if (d && d.r && !receita){ receita = true; escolhida = ""; montar(); return; }
      const auto = $('#chipsCat .chip[data-c=""]', f);
      if (auto) auto.innerHTML = !d ? "✨ Automática" : (d.e ? "✍️ " : cat(d.c)[0] === "✨" ? "" : "✨ ") + cat(d.c)[0] + " " + esc(catNome(d.c));
      const dica = $(".dica-cat", f);
      if (dica) dica.textContent = !d ? "Toque numa categoria ou escreva no fim: “12 corte de cabelo saúde”"
        : escolhida ? "“"+d.d+"” em "+escolhida+" (escolhida)"
        : "“"+d.d+"” em "+canonCat(d.c)+(d.e ? " (escrita por você)" : " (identificada)");
      $("#prevEq", f).innerHTML = d ? (receita ? '<div class="eq"><span class="pos">Entrada de '+din(d.v)+'</span></div>' : equivalencia(d.v)) : "";
      rotuloBotao();
    };
    $$(".seg button", f).forEach(b => b.onclick = () => { receita = b.dataset.r === "1"; escolhida = ""; montar(); inp.focus(); });
    inp.oninput = previa;
    setTimeout(() => inp.focus(), 250);
    window.focarEntrada = () => inp.focus();
    const salvar = () => {
      let r, programado = false, msg = "";
      const dd = valorDigitado(), extra = {ca};
      if (receita && imediato() && dd){
        const dv = dm ? (dvTxt.trim() ? numTxt(dvTxt) : dd.v) : 0, rv = numTxt(rvTxt);
        if (dv + rv > dd.v + 0.004){ aviso("Meta + reserva passam do valor da entrada"); return; }
        Object.assign(extra, {dm, dv, rv});
      }
      if (imediato()) gravarPref("carteira", ca);
      if (quando === "hoje") r = ponte.adicionarGastoEx(inp.value, escolhida, receita, sh, "", JSON.stringify(extra));
      else if (quando === "data" && !dataFutura()){
        const [a, m, d] = data.split("-").map(Number);
        r = ponte.adicionarGastoEx(inp.value, escolhida, receita, sh, String(new Date(a, m-1, d, hj.getHours(), hj.getMinutes()).getTime()), JSON.stringify(extra));
      } else if (quando === "data"){
        const [a, m, d] = data.split("-").map(Number);
        r = ponte.adicionarRecorrente(inp.value, escolhida, receita, sh, data, "m", 1, false, false);
        programado = true; msg = "Programado para "+d+" de "+MESES_L[m-1];
      } else {
        r = ponte.adicionarRecorrente(inp.value, escolhida, receita, sh, primeira, freq, comFim ? vezes : 0, !comFim && variavel, primeiraJaPassou() && pagoAtual());
        programado = true; msg = comFim ? vezes+" vezes criadas ("+FREQ[freq]+")" : (receita ? "Entrada" : "Conta")+" criada: "+FREQ[freq];
      }
      const res = aplicar(r);
      if (!res.ok){ aviso(res.msg || "Escreva o valor e o que foi, como “5,50 café”"); return; }
      vibrar();
      if (programado){
        if (RAPIDO){ ponte.avisar(msg); fecharFolha(); return; }
        fecharFolha(); render(false); aviso(msg); verificarConquistas(); return;
      }
      const g = S.meusLanc.slice().sort((a,b) => b.q - a.q)[0];
      if (RAPIDO){ ponte.avisar((g.t === "r" ? "+" : "") + din(g.v) + " em " + g.c + " salvo"); fecharFolha(); return; }
      fecharFolha();
      extr.ano = MES_ATUAL.ano; extr.mes = MES_ATUAL.mes;
      if (!visivel(g)){ modo = "total"; preparar(); }
      if (aba !== "feed") ir("feed"); else render(true);
      const p = $('.post[data-id="'+g.id+'"]'); if (p) p.classList.add("novo");
      verificarConquistas();
    };
    $("#salvarGasto", f).onclick = salvar;
    const lf = $("#lerFatura", f); if (lf) lf.onclick = () => { fecharFolha(); ponte.escolherFatura(); };
    inp.onkeydown = e => { if (e.key === "Enter") salvar(); };

    // ----- Voz -----
    const mic = $("#mic", f);
    let ouvindo = false, autoSalvar = false, timerAuto = null;
    const cancelarAuto = () => { if (!timerAuto) return; clearTimeout(timerAuto); timerAuto = null; rotuloBotao(); };
    const pararMic = () => { ouvindo = false; if (mic) mic.classList.remove("on"); inp.placeholder = receita ? "1090 salário" : "5,50 café"; };
    window.aoOuvir = r => {
      if (!f.isConnected) return;
      if (r.estado === "ouvindo"){ ouvindo = true; mic && mic.classList.add("on"); inp.value = ""; inp.placeholder = "Pode falar: “5,50 café”"; }
      else if (r.estado === "parcial"){ inp.value = r.texto; previa(); }
      else if (r.estado === "final"){
        pararMic(); inp.value = falaParaTexto(r.texto); previa(); vibrar();
        if (autoSalvar && valorDigitado()){
          $("#salvarGasto", f).textContent = "Adicionando… toque fora para cancelar";
          timerAuto = setTimeout(() => { timerAuto = null; salvar(); }, 1600);
        }
      } else { pararMic(); if (r.msg) aviso(r.msg); }
    };
    if (mic) mic.onclick = e => { e.stopPropagation(); cancelarAuto(); if (ouvindo){ ponte.pararDeOuvir(); pararMic(); } else { inp.blur(); ponte.ouvir(); } };
    f.addEventListener("pointerdown", e => { if (timerAuto && e.target.id !== "salvarGasto") cancelarAuto(); }, true);
    inp.addEventListener("input", cancelarAuto);
    window.comecarVoz = () => { if (!mic) return; autoSalvar = true; inp.blur(); ponte.ouvir(); };
    $$("[data-ev]", f).forEach(b => b.onclick = () => { if (!RAPIDO) fecharFolha(); evitei(b.dataset.ev); });
    montar();
  });
}

const semAcento = s => String(s || "").normalize("NFD").replace(/\p{Mn}+/gu, "").toLowerCase().trim();
const dataCurta = iso => { if (!iso) return ""; const [a, m, d] = iso.split("-").map(Number); return d+" "+MESES[m-1]+(a !== MES_ATUAL.ano ? " "+a : ""); };
function folhaFatura(f){
  const hoje = isoData(Date.now());

  let pm = S.premium ? f.pm : 0, sugestao = f.pm;
  let prestacoes = f.totalParcelas > 0;
  let variavel = !!f.variavel;
  let paga = !!f.debitoDireto && data <= hoje;
  let cat = canonCat(f.categoria) || "Outros";
  let sh = modo === "nos";
  const PMS = [[0,"Só esta"],[1,"Todo mês"],[2,"2 em 2 meses"],[3,"3 em 3 meses"],[6,"6 em 6 meses"],[12,"Todo ano"]];
  abrirFolha('<h3>📄 Fatura'+(f.emissor !== "Fatura" ? ' '+esc(f.emissor) : '')+'</h3><div id="fCorpo"></div>', fo => {
    const montar = () => {
      let h = '';
      const info = [f.periodoIni ? 'Período '+dataCurta(f.periodoIni)+' a '+dataCurta(f.periodoFim) : '', f.dataEmissao ? 'emitida '+dataCurta(f.dataEmissao) : '',
        f.debitoDireto ? 'débito direto' : '', f.qr ? 'valor conferido no código QR' : ''].filter(Boolean).join(' · ');
      if (info) h += '<p class="nota">'+esc(info)+'</p>';
      if (existente) h += '<div class="chips">'
        + '<button class="chip'+(usarExistente ? " on" : "")+'" data-ex="1">Registar em “'+esc(existente.n)+'”</button>'
        + '<button class="chip'+(usarExistente ? "" : " on")+'" data-ex="0">Criar conta nova</button></div>';
      if (!usarExistente) h += '<label class="campo"><span>Nome</span><input id="fNome" value="'+esc(nome)+'" placeholder="Ex.: Luz, Internet, Seguro do carro"></label>';
      h += '<div class="linha-campos" style="display:flex;gap:10px;margin:0 18px 12px">'
        + '<label class="campo"><span>Valor</span><input id="fValor" inputmode="decimal" value="'+esc(valor)+'" placeholder="0,00"></label>'
        + '<label class="campo"><span>'+(f.debitoDireto ? "Data do débito" : "Data limite")+'</span><input id="fData" type="date" value="'+data+'"></label></div>';
      if (f.entidade || f.referencia) h += '<div class="mb"><div><small>Multibanco</small>'+(f.entidade ? 'Entidade <b>'+esc(f.entidade)+'</b> · ' : '')+'Ref. <b>'+esc(f.referencia)+'</b></div>'
        + '<button class="btn mini sec" id="fCopiar">Copiar ref.</button></div>';
      if (!usarExistente){
        h += '<div class="rotulo">Repete?</div><div class="chips rolar">'+PMS.map(([k,n]) => '<button class="chip'+(pm === k ? " on" : "")+'" data-pm="'+k+'">'+n+(k && !S.premium ? " 🔒" : "")+'</button>').join("")+'</div>';
        if (!S.premium && sugestao) h += '<p class="nota">Parece repetir '+esc(PM_TXT[sugestao] || "")+'. Com o Premium vira uma conta que se repete sozinha.</p>';
        if (pm && f.totalParcelas) h += chave("fPrest", "Prestação "+f.parcela+" de "+f.totalParcelas, "Criar as "+(f.totalParcelas - f.parcela + 1)+" que faltam (incluindo esta) e terminar na última", prestacoes);
        if (pm && !(prestacoes && f.totalParcelas)) h += chave("fVar", "O valor muda de fatura para fatura", "Luz, água, gás: o valor desta fica como estimativa das próximas", variavel);
      }
      h += chave("fPaga", "Já está paga", data < hoje && !f.debitoDireto ? "A data já passou: marque se já pagou" : (f.debitoDireto ? "Débito direto: é paga sozinha na data" : ""), paga);
      if (!usarExistente){
        h += '<div class="rotulo">Categoria</div><div class="chips rolar" id="fCats"></div><div class="chips rolar sub-cat" id="fSubs"></div>';
        h += chaveNos(sh);
      }
      h += '<button class="btn" id="fSalvar">'+(usarExistente ? 'Registar em '+esc(existente.n) : pm ? 'Criar conta' : 'Adicionar fatura')+'</button>'
        + '<button class="btn sec" id="fCancelar">Cancelar</button>';
      $("#fCorpo", fo).innerHTML = h;
      // mostra a opção escolhida nas filas que deslizam
      $$(".chips.rolar", fo).forEach(fila => { const on = $(".chip.on", fila); if (on) fila.scrollLeft = on.offsetLeft - fila.offsetLeft - 18; });
      const guardar = () => { const n = $("#fNome", fo); if (n) nome = n.value; valor = $("#fValor", fo).value; data = $("#fData", fo).value || data; };
      $$("[data-ex]", fo).forEach(b => b.onclick = () => { guardar(); usarExistente = b.dataset.ex === "1"; montar(); });
      $$("[data-pm]", fo).forEach(b => b.onclick = () => {
        const k = +b.dataset.pm;
        if (k && !S.premium){ folhaPremium("Contas que se repetem (mensais, a cada 2, 3 ou 6 meses, anuais e prestações) são um recurso Premium."); return; }
        guardar(); pm = k; montar();
      });
      if ($("#fCats", fo)) ligarChipsCat(fo, "fCats", "fSubs", () => false, () => cat, v => { cat = v; }, false);
      const tg = (id, f2) => { const e = $("#"+id, fo); if (e) e.onclick = () => { guardar(); f2(); montar(); }; };
      tg("fPrest", () => prestacoes = !prestacoes);
      tg("fVar", () => variavel = !variavel);
      tg("fPaga", () => paga = !paga);
      tg("swNos", () => sh = !sh);
      const fd = $("#fData", fo); if (fd) fd.onchange = () => { guardar(); montar(); };
      const cp = $("#fCopiar", fo); if (cp) cp.onclick = () => { aplicar(ponte.copiar(f.referencia.replace(/\s/g, ""))); aviso("Referência copiada"); vibrar(); };
      $("#fCancelar", fo).onclick = () => fecharFolha();
      $("#fSalvar", fo).onclick = () => {
        guardar();
        const pedido = usarExistente ? {contaId: existente.id, valor, data, paga}
          : {nome: nome.trim() || f.emissor, valor, data, pm, vezes: pm && prestacoes && f.totalParcelas ? f.totalParcelas : 0,
             parcela: pm && prestacoes && f.totalParcelas ? f.parcela : 0, variavel: variavel && !(prestacoes && f.totalParcelas), paga, cat, sh};
        const r = aplicar(ponte.adicionarFatura(JSON.stringify(pedido)));
        if (!r.ok){ aviso(r.msg || "Confira o valor e a data"); return; }
        vibrar();
        if (RAPIDO){ ponte.avisar(r.msg); fecharFolha(); return; }
        fecharFolha(); render(false); aviso(r.msg);
      };
    };
    montar();
  });
}

/* ---------- Editar a conta inteira: nome, valor, categoria e como se paga ---------- */
const TIPOS_CONTA = [["u",1,"Data única"],["m",1,"Todo mês"],["m",2,"2 em 2 meses"],["m",3,"3 em 3 meses"],["m",6,"6 em 6 meses"],["m",12,"Todo ano"],["q",1,"A cada 15 dias"],["s",1,"Toda semana"]];
function folhaEditarConta(id){
  const c = S.contas.find(x => x.id === id); if (!c) return;
  if (!meu(c)){ aviso("Só quem criou a conta pode editar"); return; }
  const receita = !!c.e;
  const tipoDe = x => x.vezes === 1 ? "u" : (x.freq === "q" || x.freq === "s") ? x.freq : "m";
  const tipo0 = tipoDe(c), pm0 = tipo0 === "m" ? Math.max(1, c.pm || 1) : 1;
  const ini0 = (() => {
    if ((c.freq === "q" || c.freq === "s") && c.d0) return c.d0;
    const [a, m] = (c.ini || mesStr(MES_ATUAL.ano, MES_ATUAL.mes)).split("-").map(Number);
    return a+"-"+String(m).padStart(2,"0")+"-"+String(Math.min(c.dia || 1, new Date(a, m, 0).getDate())).padStart(2,"0");
  })();
  let tipo = tipo0, pm = pm0, data = ini0, comFim = c.vezes > 1, vezes = c.vezes > 1 ? c.vezes : 3, variavel = !!c.var;
  let nome = c.n, valor = String(c.v).replace(".", ",");
  let escolhida = c.c || (receita ? (/sal[aá]rio|ordenado|vencimento/i.test(c.n) ? "Receitas › Salário" : OUTRAS_REC) : "Casa");
  const mudouForma = () => tipo !== tipo0 || pm !== pm0;
  // próxima vez que ainda não foi paga (a partir de hoje): é daí que a nova forma recomeça
  const proxima = () => {
    const hj = new Date(); hj.setHours(0,0,0,0);
    const pagas = new Set((c.ocs || []).filter(o => o.paga).map(o => o.chave));
    for (let k = 0; k < 36; k++){
      const a = MES_ATUAL.ano + Math.floor((MES_ATUAL.mes + k) / 12), m = (MES_ATUAL.mes + k) % 12;
      const o = ocorrencias(c, a, m).find(o => !pagas.has(o.chave) && o.d >= hj);
      if (o) return o;
    }
    return null;
  };
  const trocarForma = (t, p) => {
    const antes = mudouForma();
    tipo = t; pm = p;
    if (!mudouForma()){ data = ini0; vezes = c.vezes > 1 ? c.vezes : vezes; comFim = c.vezes > 1; return; }
    if (!antes){
      const o = proxima();
      data = o ? isoData(o.d.getTime()) : isoData(Date.now());
      if (c.vezes > 1 && o) vezes = Math.max(1, c.vezes - o.n + 1);
    }
  };
  abrirFolha('<h3>Editar '+(receita ? "entrada" : "conta")+'</h3>'
    + '<label class="campo"><span>Nome</span><input id="ecN" value="'+esc(nome)+'"></label>'
    + '<label class="campo"><span>Valor'+(c.var ? " (estimativa)" : "")+'</span><input id="ecV" inputmode="decimal" value="'+esc(valor)+'"></label>'
    + '<div class="rotulo">Categoria</div><div class="chips rolar" id="ecCat"></div><div class="chips rolar sub-cat" id="ecSub"></div>'
    + '<div class="rotulo">Como se paga</div><div class="chips" id="ecTipo"></div><div id="ecBox"></div>'
    + '<button class="btn" id="ecSalvar">Salvar</button>', f => {
    $("#ecN", f).oninput = e => { nome = e.target.value; };
    $("#ecV", f).oninput = e => { valor = e.target.value; nota(); };
    ligarChipsCat(f, "ecCat", "ecSub", () => receita, () => escolhida, v => { escolhida = v; }, false);
    const nota = () => {
      const n = $("#ecNota", f); if (!n) return;
      const [a, m, d] = data.split("-").map(Number);
      const quando = d+" de "+MESES_L[m-1]+(a !== MES_ATUAL.ano ? " de "+a : "");
      const v = parseFloat(String(valor).replace(/\./g, "").replace(",", ".")) || 0;
      let t = tipo === "u" ? "Acontece uma vez, em "+quando+"."
        : (comFim ? vezes+" vezes a partir de "+quando+(v ? " · "+din(v*vezes)+" no total" : "")+"." : "Repete a partir de "+quando+" até você excluir.");
      if (mudouForma()) t += " O que já foi "+(receita ? "recebido" : "pago")+" continua no extrato.";
      n.textContent = t;
    };
    const montar = () => {
      $("#ecTipo", f).innerHTML = TIPOS_CONTA.map(([t, p, n]) => '<button class="chip'+(tipo === t && (t !== "m" || pm === p) ? " on" : "")+'" data-t="'+t+'" data-p="'+p+'">'+n+(t !== "u" && !S.premium ? " 🔒" : "")+'</button>').join("");
      $$("#ecTipo .chip", f).forEach(bt => bt.onclick = () => {
        if (bt.dataset.t !== "u" && !S.premium){ folhaPremium("Repetir contas (mensal, a cada 15 dias, semanal e parceladas) é um recurso Premium."); return; }
        trocarForma(bt.dataset.t, +bt.dataset.p); vibrar(); montar();
      });
      let h = '<label class="campo"><span>'+(tipo === "u" ? "Data" : mudouForma() ? "Recomeça em" : "Primeira vez")+'</span><input id="ecData" type="date" value="'+data+'"></label>';
      if (tipo !== "u"){
        h += '<div class="chips"><button class="chip'+(comFim ? "" : " on")+'" data-fim="0">Sem fim</button><button class="chip'+(comFim ? " on" : "")+'" data-fim="1">Número de vezes (parcelas)</button></div>';
        h += comFim ? '<label class="campo"><span>Quantas vezes'+(mudouForma() ? " a partir dessa data" : "")+'</span><input id="ecVezes" inputmode="numeric" value="'+vezes+'"></label>'
                    : chave("ecVar", "O valor muda a cada vez", "Ex.: luz, água. O valor escrito vira a estimativa", variavel);
      }
      h += '<p class="nota" id="ecNota"></p>';
      $("#ecBox", f).innerHTML = h;
      $("#ecData", f).onchange = e => { data = e.target.value || data; nota(); };
      $$("[data-fim]", f).forEach(bt => bt.onclick = () => { comFim = bt.dataset.fim === "1"; montar(); });
      const ve = $("#ecVezes", f); if (ve) ve.oninput = () => { vezes = Math.min(600, Math.max(2, parseInt(ve.value) || 2)); nota(); };
      const va = $("#ecVar", f); if (va) va.onclick = () => { variavel = !variavel; va.classList.toggle("on", variavel); };
      nota();
    };
    montar();
    $("#ecSalvar", f).onclick = () => {
      const unica = tipo === "u";
      const r = aplicar(ponte.redefinirConta(c.id, nome, valor, escolhida, data, unica ? "m" : tipo, unica ? 1 : pm,
        unica ? 1 : (comFim ? vezes : 0), !unica && !comFim && variavel));
      if (!r.ok){ aviso(r.msg || "Confira o nome e o valor"); return; }
      vibrar(); fecharFolha(); render(false); aviso((receita ? "Entrada" : "Conta")+" atualizada");
    };
  });
}

      $("#rE", f).innerHTML = emojis.map(x => '<button class="chip'+(x === e ? " on" : "")+'" data-e="'+x+'" style="font-size:1.25rem">'+x+'</button>').join("");
      $$("#rE .chip", f).forEach(b => b.onclick = () => { e = b.dataset.e; montar(); });
      $("#rChaves", f).innerHTML = chave("cDest", "Mostrar nos cartões", "Traduz valores nesta referência (até 2)", dest) + chave("cEv", "Quero evitar isto", "Ganha o botão “Evitei” no app, na notificação e no popup", ev);
      $("#cDest", f).onclick = () => { dest = !dest; montar(); };
      $("#cEv", f).onclick = () => { ev = !ev; montar(); };
      $("#rDest", f).innerHTML = ev ? '<div class="rotulo">Para onde vai o valor evitado</div><div class="chips">'
        + '<button class="chip'+(!meta ? " on" : "")+'" data-m="">Só contar</button>'
        + S.metasVis.map(m => '<button class="chip'+(meta === m.id ? " on" : "")+'" data-m="'+m.id+'">'+esc(m.e)+' '+esc(m.n)+'</button>').join("")
        + '</div>' + (S.metasVis.length ? '' : '<p class="nota">Crie um destino (curso, imprevisto…) na aba Trocas para mandar o dinheiro para lá.</p>') : '';
      $$("#rDest .chip", f).forEach(b => b.onclick = () => { meta = b.dataset.m; montar(); });
    };
    montar();
    $("#rSalvar", f).onclick = () => {
      if (!aplicar(ponte.salvarReferencia(r ? r.id : "", $("#rN", f).value, e, $("#rV", f).value, dest, ev, meta)).ok){ aviso("Dê um nome e um valor"); return; }
      vibrar(); fecharFolha(); render(false); verificarConquistas();
    };
    const del = $("#rDel", f); if (del) del.onclick = () => { aplicar(ponte.apagar(r.id)); fecharFolha(); render(false); };
  });
}

/* ---------- Destinos ---------- */
function folhaNovaMeta(){
  let tipo = "j", e = "🎓", sh = modo === "nos";
  const emojis = {j:["🎓","📚","🏖️","✈️","💻","🛟","🏠","🎯"], a:["🔧","🚗","🦷","🏥","💳","📱","🧾","🎯"]};
  abrirFolha('<h3>Novo destino</h3><div class="seg"><button data-t="j">Juntar</button><button data-t="a">Amortizar</button></div>'
    + '<p class="nota" id="mExp"></p><div class="chips" id="mE"></div>'
    + '<label class="campo"><span>Nome</span><input id="mN"></label>'
    + '<label class="campo"><span id="mRot"></span><input id="mA" inputmode="decimal"></label>'
    + '<div id="nosBox"></div><button class="btn" id="salvarMeta">Criar destino</button>', f => {
    const montar = () => {
      $$(".seg button", f).forEach(b => b.classList.toggle("on", b.dataset.t === tipo));
      $("#mExp", f).textContent = tipo === "j" ? "Juntar: o valor sobe até a meta. Ex.: curso de inglês, viagem, reserva." : "Amortizar: um imprevisto ou dívida que você vai pagando aos poucos. Ex.: conserto do carro, dentista.";
      $("#mRot", f).textContent = tipo === "j" ? "Quanto quer juntar" : "Valor total do imprevisto";
      $("#mN", f).placeholder = tipo === "j" ? "Curso de inglês" : "Conserto do carro";
      $("#mA", f).placeholder = tipo === "j" ? "600" : "450";
      if (!emojis[tipo].includes(e)) e = emojis[tipo][0];
      $("#mE", f).innerHTML = emojis[tipo].map(x => '<button class="chip'+(x === e ? " on" : "")+'" data-e="'+x+'" style="font-size:1.25rem">'+x+'</button>').join("");
      $$("#mE .chip", f).forEach(b => b.onclick = () => { e = b.dataset.e; montar(); });
      $("#nosBox", f).innerHTML = chaveNos(sh);
      const sw = $("#swNos", f); if (sw) sw.onclick = () => { sh = !sh; montar(); };
    };
    $$(".seg button", f).forEach(b => b.onclick = () => { tipo = b.dataset.t; montar(); });
    montar();
    $("#salvarMeta", f).onclick = () => {
      if (!aplicar(ponte.adicionarMeta($("#mN", f).value, $("#mA", f).value, e, tipo, sh)).ok){ aviso("Dê um nome e um valor"); return; }
      vibrar(); fecharFolha(); render(true); verificarConquistas();
    };
  });
}
function folhaGuardar(id){
  const m = S.metas.find(x => x.id === id);
  const amort = m.tipo === "a";
  abrirFolha('<h3>'+esc(m.e)+' '+esc(m.n)+'</h3><p class="nota">'+(amort ? "Pago" : "Guardado")+' até agora: '+din(m.atual)+' de '+din(m.alvo)+'. Use um valor negativo para corrigir.'
    + (m.sh && temCasal() ? ' Destino do casal: '+esc(S.parceiro.nome)+' vê este valor.' : '')+'</p>'
    + '<input class="entrada-grande" id="gV" inputmode="decimal" placeholder="50">'
    + '<div class="chips">'+[10,25,50,100].map(v => '<button class="chip" data-v="'+v+'">+ '+din(v)+'</button>').join("")+'</div>'
    + '<button class="btn" id="salvarAporte">'+(amort ? "Registrar pagamento" : "Guardar")+'</button>', f => {
    const inp = $("#gV", f);
    $$("[data-v]", f).forEach(b => b.onclick = () => { inp.value = b.dataset.v; });
    $("#salvarAporte", f).onclick = () => {
      const antes = m.atual >= m.alvo;
      if (!aplicar(ponte.aportarMeta(id, inp.value)).ok){ aviso("Digite um valor"); return; }
      const depois = S.metas.find(x => x.id === id);
      vibrar(); fecharFolha(); render(true);
      if (!antes && depois && depois.atual >= depois.alvo) confete();
      verificarConquistas();
    };
  });
}

/* ================= Início ================= */
$$("nav [data-aba]").forEach(b => b.onclick = () => ir(b.dataset.aba));
$("#fab").onclick = () => { vibrar(); folhaNovo(false); };
$("#miniAv").onclick = () => ir("perfil");
/** Abre o lançamento vindo de fora (atalho, toque traseiro, financas://novo). */
window.abrirNovo = function(){
  if (RAPIDO || !S || !S.nuvem.logado) return false;
  if (folhaAberta) fecharFolha(true);
  folhaNovo(false);
  return true;
};

carregar();
extr.ano = MES_ATUAL.ano; extr.mes = MES_ATUAL.mes;
if (RAPIDO){
  document.body.classList.add("rapido");
  if (FATURA) folhaLendo(); else folhaNovo(false);
} else {
  render(true);
  setTimeout(verificarConquistas, 900);
}
</script>
